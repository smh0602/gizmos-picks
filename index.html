const confClass = c => c >= 70 ? 'c-hi' : c >= 60 ? 'c-mid' : 'c-lo';

/* 🔴 THE PROJECTION IS NEVER COMPUTED HERE. card.py decides it ONCE per
   player per market and every surface shows that same number -- Sam,
   2026-08-27: "you should have the same numbers across the entire website
   if your talking about the same stat or projction." Reimplementing it in
   JavaScript would create a second copy, and this project has a documented
   history of two copies of one number drifting apart. This function
   FORMATS a number card.py already produced. Nothing more.
   ⛔ If there is no projection, render nothing. An absent projection means
   there was no game log to build one from -- it does not mean guess. */
function projChip(v, unit){
  if (v == null) return '';
  // [Sam, 2026-10-01] the number alone: no explanation tooltip, no model/record tint.
  /* ONE DECIMAL. JSON turns 1.0 into 1, and "PROJ 1 H" next to a line of
     1.5 reads like a different kind of number than "PROJ 1.0 H".
     🔴 EXCEPT WHEN card.py DELIBERATELY KEPT A SECOND ONE. It does that
     when one decimal would land exactly on one of that player's own lines
     -- 1.47 beside "under 1.5" is honest, "1.5" beside "under 1.5" reads
     as the card arguing with itself. ⛔ toFixed(1) here threw that digit
     away and put the contradiction straight back on the page. */
  const shown = (typeof v !== 'number') ? v
    : (Math.abs(v - Number(v.toFixed(1))) > 1e-9 ? v.toFixed(2) : v.toFixed(1));
  return `<span class="proj">`
       + `PROJ <span class="pv">${shown}</span>${unit ? ' ' + unit : ''}</span>`;
}

/* The Player Props tab renders from props.json.gz, which has no model in
   it. The projections live on the published card, so the tab joins against
   them. Loaded once, and a miss is not an error -- it just means no card
   has been published for today yet, and no projections are shown. */
let PROJ = null;
async function loadProjections(){
  if (PROJ) return PROJ;
  /* 🔴 THROUGH `loadCard`, NOT A SECOND FETCH OF ITS OWN. This asked for
     `picks/${todayET()}.json` directly, so on a morning with no card yet
     the Player Props tab silently lost EVERY projection — one of the
     three things Sam reported missing on 2026-09-14 — while the fallback
     card that has them sat unread. ⛔ Two readers of one file is rule 66;
     two readers with DIFFERENT fallback behaviour is how one of them goes
     quiet without anyone noticing. */
  try { PROJ = (await loadCard()).projections || {}; }
  catch(e){ PROJ = {}; }
  return PROJ;
}
/* ⛔ ~~const playName = p => {...}~~ DELETED 2026-09-14. A THIRD dead
   function (rule 130), and one the hand audit had missed — it was found
   only by sweeping all 185 definitions rather than the 127 a reviewer
   enumerated. ⚠️ It formatted a pitcher prop as "Name — Over 5.5 K" and
   dates from before the board carried its own label; every row builds
   its own name now. */

function pickCard(p){
  /* 🔴 `isH` MEANS "THIS NUMBER IS THE PLAYER'S OWN RECORD, NOT A MODEL",
     which is what it has always meant -- MLB has no hitter model. Reading
     confidence_basis directly lets FOOTBALL rows render through this exact
     component, which is the point: same board, same columns, same sort.
     ⚠️ PROVEN A NO-OP ON MLB: across 533 published picks in 12 cards,
     kind==='hitter' and confidence_basis==='RECORD' never disagree once. */
  /* THREE PROVENANCES, NOT TWO:
       MODEL   an MLB pitcher -- the only rows with a model behind them
       RECORD  an MLB hitter, or an NFL row -- the player's OWN rate
       MARKET  a college row -- a price and no rate at all (see fbPicks)
     🔴 `isH` HAS ALWAYS MEANT "not a model number", so everything that is
     not MODEL takes that branch.
     [Sam, 2026-10-01] no explanation boxes or tags on the page. */
  const basis = p.confidence_basis || (p.kind === 'hitter' ? 'RECORD' : 'MODEL');
  const isH = basis !== 'MODEL';
  const c = el('div','pk');
  const h = el('div','pk-h');

  // One number in one place. [Sam, 2026-10-01] no explanation boxes or tags on the page.
  /* ⚠️ A ROW CAN HAVE NO NUMBER. A college football row carries a price
     and no rate on purpose -- printing "undefined" where a confidence
     goes is exactly the kind of thing a reader reads as a broken site. */
  h.append(p.confidence == null
    ? el('div', 'conf norate', '<div class="n">&mdash;</div><div class="l">CONF</div>')
    : el('div', 'conf ' + confClass(p.confidence),
        `<div class="n">${p.confidence}</div><div class="l">CONF</div>`));

  if (p.pid) h.insertAdjacentHTML('beforeend',
    `<img class="hs" src="${headUrl(p.pid)}" alt="" loading="lazy"
      onerror="this.style.visibility='hidden'">`);

  const t = el('div','pk-t');
  const who = p.pitcher || p.player;
  /* ⚠️ THREE SIDES, NOT TWO. A one-sided market (Anytime TD) has side
     'yes' and no line -- it rendered as "Under Anytime TD", which states
     the opposite of the bet. */
  const sideWord = p.side === 'over' ? 'Over'
                 : p.side === 'yes'  ? 'Yes'
                 : 'Under';
  const gl = p.kind === 'fb-line' || p.kind === 'mlb-line';   // [Sam, 2026-10-01] a game-line pick, same row
  const unit = isH || gl || p.kind === 'fb' ? p.market_label   // [Sam, 2026-10-09] a football MODEL row too
             : (p.market === 'strikeouts' ? 'K' : 'Outs');
  /* ⚠️ A one-sided market (Anytime TD) has NO LINE. "Under null Outs" was
     on screen before this guard. */
  const lineTxt = p.line == null ? ''
    : ` ${gl && /spread|run_line/.test(p.market) && p.line > 0 ? '+' : ''}${p.line}`;
  const bc = p.band === '70-80' ? 'ok' : (p.band ? 'bad' : '');
  /* ⛔ The calibration BAND chip ("70-80", "60-70") is gone from the row.
     Sam, 2026-08-26. It is a bucket label from the calibration table and
     means nothing to a reader; the confidence number beside it already
     says the same thing more precisely. ✅ The band is STILL on the row
     in the data and the Track Record tab still reports by band -- this
     removes a chip, not a measurement.
     [Sam, 2026-10-01] the MODEL / RECORD / MARKET chip is gone too. */
  t.append(el('div','play', `${who}${gl ? '' : ' — ' + sideWord}${lineTxt} ${unit}`
    + '&nbsp;' + projChip(p.projection, p.projection_unit)));

  /* 🔴 THREE CASES, NOT TWO.
       MLB  -- team ids, so mark() by id.
       FOOTBALL -- no ids, but a logo directory keyed by name (fbMark).
       neither -- the plain matchup string.
     ⛔ Before this, every football row fell to the bare text and the
     picks board was the only tab with no logos on it. */
  const matchup = (p.away_id || p.home_id)
    ? `${mark(p.away, p.away_id, 17)} ${ab(p.away)} <span style="color:var(--line)">@</span> ${mark(p.home, p.home_id, 17)} ${ab(p.home)}`
    : (p.away && p.home && typeof fbMark === 'function' && FBTEAMS[LEAGUE])
    ? `${fbMark(p.away, 17)} ${fbAb(p.away)} <span style="color:var(--line)">@</span> ${fbMark(p.home, 17)} ${fbAb(p.home)}`
    : p.game;
  t.append(el('div','meta',
    `<span style="display:inline-flex;align-items:center;gap:5px">${matchup}</span>
     ${p.first_pitch ? '&nbsp;·&nbsp; ' + p.first_pitch : ''}`));
  h.append(t);

  h.append(el('div','pk-px',
    `<div class="px">${sgn(p.price)}</div>
     <div class="bk">${bookChip(p.book)}</div>
     ${betControl(p.link)}`));
  c.append(h);

  if (p.why && p.why.length)
    c.append(el('div','pk-b', '<ul>' + p.why.map(w => `<li>${w}</li>`).join('') + '</ul>'));

  /* 🔴 THE MODEL'S OWN DIAGNOSTICS ARE NOT RENDERED. Sam, 2026-08-26:
     "we have to advertise a clean look to the website that doesnt include
     nonsense users dont need to read and cant understand."
     T21, T22, rule 15 and STEP 4B are notes the model writes to ITSELF --
     "a shuttled arm reads 14.4 points worse point-in-time (z=6.97)" is a
     sentence for the ledger, not for somebody deciding a bet.
     ⛔ THEY ARE STILL COMPUTED AND STILL STORED in picks/<date>.json.
     This hides them from the PAGE; it does not stop recording them, and
     the calibration record still depends on every one of them.
     [Sam, 2026-10-01] no per-row flags either (actionable flags, lineup
     risk): still written to the card, not shown on the page. */

  /* 🔴 A ROW SEATED BELOW ITS PRICE SAYS SO WITH ITS NUMBERS. Sam,
     2026-09-25 (C8): pitchers keep their own 25 seats, and when fewer than
     25 beat their price the rest are the best pitcher rows that do NOT --
     "clearly labelled that it loses to its price on the corrected number
     (show the printed %, the break-even and the edge)". ⛔ The edge is the
     card's own (`edge`, from the unrounded number), never recomputed here.
     [Sam, 2026-10-01] numbers only, no sentence.
     ⚠️ Each number is guarded on its own field; a row missing one shows
     the bare label rather than printing "undefined". */
  if (p.below_price)
    c.append(el('div','fl fl-note',
      (p.confidence != null && p.break_even != null && p.edge != null)
        ? `Below its price: ${p.confidence}% vs ${p.break_even}% break-even (edge ${p.edge > 0 ? '+' : ''}${p.edge}%)`
        : 'Below its price'));

  /* 🔴 WHAT THIS OPPONENT HAS DONE TO STARTERS LATELY.
     Sam's idea, 2026-08-26. Built from our OWN pitcher logs -- every one of
     3,852 starts names its opponent -- so it costs nothing and is
     point-in-time by construction, which a scraped table never is.
     ⚠️ Rows on this side of the line are tinted. That is a READING AID on
     descriptive data, not a model output: the model's opponent term is the
     SEASON rate, and whether this recent window beats it is owed-test T36. */
  if (p.opp_recent && p.opp_recent.starts && p.opp_recent.starts.length){
    const r = p.opp_recent;
    const isK = p.market === 'strikeouts';
    const beat = x => p.side === 'over'
      ? (isK ? x.k > p.line : x.outs > p.line)
      : (isK ? x.k < p.line : x.outs < p.line);
    const nBeat = r.starts.filter(beat).length;
    const d = el('details','oppl');
    d.innerHTML = `<summary>Last ${r.n} starting pitchers to face ${ab(r.opponent)}
        &nbsp;&middot;&nbsp; <span class="k">${r.mean_k} K</span> / ${r.mean_ip} IP average
        &nbsp;&middot;&nbsp; <span class="k">${nBeat}/${r.n}</span> on this side of ${p.line}
        </summary>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Date</th><th>Pitcher</th><th class="n">IP</th><th class="n">K</th>
          <th class="n">H</th><th class="n">ER</th><th class="n">BB</th><th class="n">P</th></tr></thead>
        <tbody>${r.starts.map(x => `<tr class="${beat(x) ? 'beat' : ''}">
          <td>${x.d}</td><td>${x.pitcher}${x.throws ? ' <span class="rec">('+x.throws+')</span>' : ''}</td>
          <td class="n">${x.ip}</td><td class="n"><b>${x.k}</b></td>
          <td class="n">${x.hit == null ? '&mdash;' : x.hit}</td>
          <td class="n">${x.er == null ? '&mdash;' : x.er}</td>
          <td class="n">${x.bb == null ? '&mdash;' : x.bb}</td>
          <td class="n">${x.np == null ? '&mdash;' : x.np}</td></tr>`).join('')}
        </tbody></table></div>`;
    c.append(d);
  }

  /* Alt ladder — pitchers only; hitters have no rungs in the feed. */
  if (p.ladder && p.ladder.length){
    const L = el('div','lad');
    L.append(el('div','lb', 'HARD ROCK ALT LADDER'));
    p.ladder.forEach(r => {
      const star = p.ladder_pick && r.line === p.ladder_pick.line && r.side === p.ladder_pick.side;
      const cls = 'rung' + (star ? ' star' : '') + (r.clears_price_floor ? '' : ' dim');
      const inner = `<b>${r.side === 'over' ? 'o' : 'u'}${r.line}</b>
                     <span class="pc">${sgn(r.price)}</span>
                     <span class="pc">${r.blend.toFixed(0)}%</span>`;
      const href = betLink(r.link);
      const node = href ? el('a', cls, inner) : el('span', cls, inner);
      if (href){ node.href = href; node.target = '_blank'; node.rel = 'noopener'; }
      if (r.app_label) node.title = r.app_label;
      L.append(node);
    });
    c.append(L);
  }

  /* ⚠️ EVERY BIT IS GUARDED ON ITS OWN FIELD. MLB rows carry all of
     them, so this is a no-op there; a college row carries none and used
     to print "Own record undefined (undefined% smoothed)". */
  const bits = [];
  if (isH){
    if (p.raw != null)
      bits.push(`Own record <b>${p.raw}</b>`
        + (p.rate != null ? ` (${p.rate}% smoothed)` : ''));
    if (p.splits && p.splits.last15) bits.push(`Last 15 <b>${p.splits.last15}</b>`);
    if (p.splits && p.splits.home) bits.push(`Home <b>${p.splits.home}</b> · Road <b>${p.splits.road}</b>`);
    if (p.splits && p.splits.vs_opp) bits.push(`vs ${p.opponent ? ab(p.opponent) : 'opp'} <b>${p.splits.vs_opp}</b>`);
    if (p.market_implied != null) bits.push(`Market has it at <b>${p.market_implied}%</b>`);
  } else {
    if (p.raw != null) bits.push(`Own record <b>${p.raw}</b>`);
    if (p.model != null) bits.push(`Model <b>${p.model}%</b>`);
    if (p.class && p.class.all) bits.push(`Similar arms <b>${p.class.all}</b>`
      + (p.class.four_plus ? ` (${p.class.four_plus} on 4+ innings)` : ''));
    if (p.h2h) bits.push(`Head-to-head: ${p.h2h}`);
  }
  if (p.break_even != null) bits.push(`Break-even <b>${p.break_even}%</b>`);
  if (p.other_side)
    bits.push(`Other side: ${p.other_side.side} ${p.line} at ${sgn(p.other_side.price)}, <b>${p.other_side.blend}%</b>`);
  c.append(el('div','ev', bits.map(b => `<span>${b}</span>`).join('')));
  return c;
}

/* [Sam, 2026-10-01] MLB's Gizmo's Picks gets football's "Player props / Game
   lines" switch. A game-line row is the game model's own (kind mlb-line) and
   is drawn by pickCard, the prop rows' own markup. */
function mlbKindBar(P){
  const n = k => (k === 'props' ? (P.picks || [])
                  : (P.game_lines || []).filter(p => p.kind === 'mlb-line')).length;
  const chip = (k, label) => `<button class="kchip${MLBPICKKIND === k ? ' on' : ''}"
    data-mlbkind="${k}">${label} <span>${n(k)}</span></button>`;
  return `<div class="kindbar">${chip('props', 'Player props')}${chip('lines', 'Game lines')}</div>`;
}

function mlbGameLines(P){
  return (P.game_lines || []).filter(p => p.kind === 'mlb-line')
    .sort((a, b) => (a.rank || 999) - (b.rank || 999)).map(p => pickCard(p));
}

async function renderPicks(){
  const v = $('#view'); v.innerHTML = '<div class="msg">Loading…</div>';
  const d = todayET();
  let P;
  // Picks live at picks/<date>.json, deliberately outside data/ --
  // data/ is what the collector writes, picks/ is what we publish.
  try { P = await loadCard(); }
  catch(e){
    v.innerHTML = `<div class="panel"><h2>Gizmo's Picks</h2>
      <p class="plain">No card published for ${d} yet.</p></div>`;
    return;
  }

  v.innerHTML = '';
  const head = el('div','panel');
  /* ⛔ THE DATE IN THE HEADING IS THE CARD'S OWN, NEVER `todayET()`. A
     heading that says today over yesterday's rows is the misinformation
     this fallback exists to avoid. */
  head.innerHTML = `<h2>Gizmo's Picks &mdash; ${CARD_DATE}</h2>`;
  v.append(head);
  const kb = el('div', null, mlbKindBar(P));
  v.append(kb);
  kb.addEventListener('click', e => {
    const b = e.target.closest('.kchip');
    if (!b) return;
    MLBPICKKIND = b.dataset.mlbkind;
    renderPicks();
  });
  if (MLBPICKKIND === 'lines'){
    const gl = mlbGameLines(P);
    gl.forEach(c => v.append(c));
    if (!gl.length) v.append(el('div', 'msg', 'No game lines on this card.'));
    return;
  }

  // Rank by confidence -- what a reader expects from a picks page, and it
  // keeps the badge column monotonic instead of jumping around.
  /* A pick on a game that has started is history, not a recommendation.
     Filter on the ISO kickoff where the card carries one; a card without
     that field is shown whole rather than silently half-hidden. */
  const dated = P.picks.filter(p => p.commence);
  /* [2026-10-01] counted whether or not they are shown, so the control
     stays and can hide them again after "Show started games". */
  const startedN = dated.length === P.picks.length
    ? P.picks.filter(p => new Date(p.commence) <= new Date()).length : 0;
  let live = (showStarted || !startedN) ? P.picks
             : P.picks.filter(p => new Date(p.commence) > new Date());
  // Same rule: if every pick on the card is on a started game, hiding them
  // all leaves an empty board, so show them.
  const pkAllDone = startedN > 0 && startedN === P.picks.length;
  if (pkAllDone) { live = P.picks; }
  if (startedN) v.append(el('div', null, startedToggle(startedN, 'pk-started', pkAllDone)));

  /* The card already ranked itself -- band first, then edge. Re-sorting on
     `confidence` here would drop every hitter to the bottom, because a
     hitter row deliberately has no confidence number. */
  /* Kind filter. The board is deliberately balanced now (about half and
     half), but the highest NUMBERS are almost always short hitter unders,
     so a pure descending list buries the pitchers. This lets you read
     either side on its own without changing the order within it. */
  const counts = {all: live.length,
                  pitcher: live.filter(p => p.kind !== 'hitter').length,
                  hitter:  live.filter(p => p.kind === 'hitter').length};
  const chips = el('div','kindbar',
    ['all','pitcher','hitter'].map(k =>
      `<button class="kchip${PICKKIND===k?' on':''}" data-kind="${k}">${
        k==='all'?'All':k==='pitcher'?'Pitchers':'Batters'} <span>${counts[k]}</span></button>`).join(''));
  v.append(chips);
  chips.addEventListener('click', e => {
    const b = e.target.closest('.kchip');
    if (!b) return;
    PICKKIND = b.dataset.kind;
    renderPicks();
  });

  const shown = PICKKIND === 'all' ? live
              : live.filter(p => (PICKKIND === 'hitter') === (p.kind === 'hitter'));
  shown.sort((a,b) => (a.rank||999) - (b.rank||999)).forEach(p => v.append(pickCard(p)));
  if (!live.length) v.append(el('div','msg','No plays on this card.'));
  else if (!shown.length) v.append(el('div','msg','No plays of that kind on this card.'));
  setTimeout(() => {
    const t = $('#pk-started');
    if (t) t.addEventListener('click', () => { showStarted = !showStarted; renderPicks(); });
  }, 0);

  /* TOP 10 OF THE DAY.
     🔴 NOT picks[:10]. card.py builds this from a WIDER pool (every priced
     row plus every alt ladder rung, and rungs never reach the board) and a
     NARROWER price gate, deduped to one row per player. Rendering it from
     P.top10 rather than re-deriving it here is deliberate: a second
     implementation of the selection rule is a second thing to drift. */
  const liveGames = new Set(live.map(p => p.game));
  const t10 = (P.top10 || []).filter(x => !x.game || liveGames.has(x.game));
  if (t10.length){
    const tn = el('div','panel');
    const unitOf = x => x.market === 'strikeouts' ? 'K'
                      : x.market === 'outs' ? 'Outs'
                      : (x.market_label || x.market);
    tn.innerHTML = `<h2>Top 10 plays of the day</h2>
      <div class="t10">${t10.map((x,i) => {
        const who = x.pitcher || x.player;
        const side = x.side === 'over' ? 'Over' : 'Under';
        return `<div class="r">${i+1}</div>
          <div class="w"><b>${who}</b> — ${side} ${x.line} ${unitOf(x)}
            ${x.alt_rung ? '<span class="altchip">ALT RUNG</span>' : ''}
            ${projChip(x.projection, x.projection_unit)}
            <div class="rec" style="font-size:11px">${x.game || ''}${x.first_pitch ? ' · ' + x.first_pitch : ''}</div></div>
          <div class="c ${confClass(x.confidence)}">${x.confidence}%</div>
          <div class="p">${sgn(x.price)}</div>`;
      }).join('')}</div>`;
    v.append(tn);
  }

  const pairs = (P.pairs || []).filter(x => !x.games || x.games.every(g => liveGames.has(g)));
  if (pairs.length){
    const pn = el('div','panel');
    pn.innerHTML = `<h2>Pairs</h2>
      <div style="overflow-x:auto"><table class="pairs">
      <thead><tr><th>Bet</th><th>Games</th><th class="n">Pays</th><th class="n">Both hit</th></tr></thead>
      <tbody>${pairs.map(x => `<tr>
        <td><b>${x.legs.join('</b> + <b>')}</b></td>
        <td class="rec">${x.games.join(' · ')}</td>
        <td class="n">${x.multiplier.toFixed(2)}x</td>
        <td class="n"><b>${x.joint}%</b></td></tr>`).join('')}</tbody></table></div>`;
    v.append(pn);
  }
}

/* One price cell: a bet button when the book gave us a link, plain text
   when it did not. ⛔ Never a guessed URL -- an unlinked price is shown
   unlinked rather than pointed at a page that may not exist. */
function priceCell(v, label){
  /* 🔴 The NUMBER always shows. An earlier version returned a bare dash
     when no price was attached, so a board built before best_total /
     best_spread existed rendered the totals and run lines as empty
     columns -- the line itself vanished along with the price it was
     missing. The line is a fact about the game; the price is a fact
     about a book. Losing the second must never lose the first. */
  if (!v || v.price == null)
    return `<span class="cell plain">${label && label !== 'undefined' ? label : '—'}</span>`;
  const u = betLink(v.link);
  const body = `<b>${label}</b> ${sgn(v.price)}`;
  if (u) return `<a class="cell best" href="${u}" target="_blank" rel="noopener nofollow"
         title="${bookName(v.book)}">${body} →</a>`;
  if (needsState(v.link)) return `<span class="cell best needs" onclick="focusState()">${body}</span>`;
  return `<span class="cell best" title="${bookName(v.book)}">${body}</span>`;
}

/* Track Record — read from data/latest/record.json, not hardcoded.
   Two records live here and they are NEVER added together:
     * the MACHINE card, graded automatically from stored results
     * the HAND-BUILT cards, a dated snapshot from the project ledger
   One is uncurated and one was chosen by a session. Mixing them would
   measure neither. Both carry the date they were last true. */
let RECORD = null;

/* ⚠️ A SHARED COMPONENT CARRIES ITS FIRST CALLER'S VOICE, AND NOTHING
   WAS CHECKING THAT. `[Sam, 2026-09-17]` This was written for the MLB
   MODEL and its first person was correct there and only there. Football
   renders through it too, where the number is the player's OWN 2025
   record — `record.json` says outright "No number here is a model
   output" — so "we said" is a DESCRIPTIVE number wearing a MODEL voice,
   which is rule 55 in a tooltip.
   🔴 AND IT IS NOT ONLY FOOTBALL. `[measured 2026-09-16]` today's MLB
   card is 25 MODEL rows and 25 RECORD rows, passing through these same
   buckets. MLB's own RECORD rows still read "we said"; that is Sam's
   call, reported and left.
   ✅ THE PARAMETER IS OPTIONAL AND THE DEFAULT IS THE OLD STRING, so MLB's
   rendered output is unchanged — proven byte-for-byte against a frozen
   copy of this function in `research/bandrow_pre_saidas.js`, not merely
   asserted. ⛔ Reuse is right (rule 66); a component's WORDS are an
   assumption about its caller, and this one now takes it as an argument. */
function bandRow(b, saidAs){
  const gap = b.hit == null ? null : b.hit - b.said;
  const cls = gap == null ? 'v-none' : (gap >= 0 ? 'v-good' : 'v-bad');
  const verdict = gap == null ? 'No sample'
                : gap >= 0 ? 'Beat the claim'
                : gap > -10 ? 'Slightly hot' : 'Overconfident';
  return `<div class="band">
    <div class="bn">${b.name}<small>${b.n} pick${b.n===1?'':'s'}</small></div>
    <div class="track">
      ${b.hit != null ? `<div class="hit ${gap >= 0 ? 'good' : 'bad'}" style="width:${b.hit}%"></div>` : ''}
      <div class="said" style="left:${b.said}%" title="${saidAs || 'we said'} ${b.said}%"></div>
      <div class="lbl">hit ${b.hit != null ? b.hit + '%' : '—'} &nbsp;·&nbsp; claimed ${b.said}%</div>
    </div>
    <div class="verd ${cls}">${verdict}${gap != null ? `<br><span style="font-weight:600;color:var(--mut)">${
      gap > 0 ? '+' : ''}${gap.toFixed(1)} pts</span>` : ''}</div>
  </div>`;
}

function dayDetailHtml(rows, date){
  if (!rows || !rows.length) return '<div class="msg">No picks stored for that card.</div>';
  const label = r => r.market === 'strikeouts' ? 'K'
                   : r.market === 'outs' ? 'Outs'
                   : (r.market_label || r.market);
  /* Losers first is tempting and wrong -- the card was published in
     confidence order, so that is the order it is reviewed in. */
  const body = rows.map(r => {
    const res = r.void ? ['v','VOID'] : r.won ? ['w','HIT'] : ['l','MISS'];
    return `<tr>
      <td><b>${r.player}</b> <span class="rec">${r.game || ''}</span></td>
      <td>${r.side === 'over' ? 'Over' : 'Under'} ${r.line} ${label(r)}</td>
      <td class="n">${r.confidence != null ? r.confidence + '%' : '—'}</td>
      <td class="n">${r.price != null ? sgn(r.price) : '—'}</td>
      <td class="n">${r.actual == null ? '—' : r.actual}</td>
      <td><span class="res ${res[0]}">${res[1]}</span></td></tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table class="ddtab">
      <thead><tr><th>Player</th><th>Pick</th><th class="n">Conf</th>
        <th class="n">Price</th><th class="n">Actual</th><th>Result</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

/* 🔴 IS v5.0 STILL THE BEST VERSION? `[Sam, 2026-09-23]` The weekly
   champion-vs-challenger check (`mlb_refit.py`, research/mlb_refit_spec.md).
   [Sam, 2026-10-01] no explanation boxes or tags on the page: `labN`
   prints the value alone. */
function labN(x, unit){
  // [Sam, 2026-10-01] no explanation boxes or tags on the page: the formatted value alone.
  const fmt = val => `${Array.isArray(val) ? val.join(' / ') : val}${unit || ''}`;
  if (!x || typeof x !== 'object' || !('basis' in x)){
    const raw = (x && typeof x === 'object') ? x.value : x;
    return raw == null ? '' : fmt(raw);
  }
  return x.value == null ? `—${unit || ''}` : fmt(x.value);
}

function refitPanel(F){
  if (!F || !F.display) return '';
  const D = F.display, P = D.paired || {};
  const verdictWord = {QUALIFIES: 'The re-fitted version qualifies — a pull request is waiting for your decision.',
    'DOES NOT QUALIFY': 'The re-fitted version has not beaten v5.0 by your rule. v5.0 stays.',
    'NOT YET MEASURABLE': 'Not enough side-by-side predictions yet to decide.'}[F.verdict] || F.verdict;
  const rec = (name, R) => `<tr><td>${name}</td><td>${labN(R.predictions)}</td>
      <td>${labN(R.mean_log_loss)}</td><td>${labN(R.strikeouts_mean_log_loss)}</td><td>${labN(R.outs_mean_log_loss)}</td></tr>`;
  const cal = (rows) => (rows || []).filter(r => r.rows && r.rows.value)
    .map(r => `<tr><td>${r.bucket}</td><td>${labN(r.model_said, '%')}</td><td>${labN(r.it_hit, '%')}</td><td>${labN(r.rows)}</td></tr>`).join('');
  return `<div class="panel">
    <h2>Is v5.0 still the best version?</h2>
    <p class="stamp"><span class="rec">built ${F.built_at}</span></p>
    <p><b>${verdictWord}</b></p>
    <table class="ob" style="margin-top:12px"><thead><tr><th></th><th>Predictions</th><th>Surprise</th>
      <th>Strikeouts</th><th>Outs</th></tr></thead><tbody>
      ${rec('v5.0 (on the card)', D.champion || {})}${rec('Re-fitted', D.challenger || {})}</tbody></table>
    <p style="margin-top:10px">Side by side: ${labN(P.predictions)} predictions. Average improvement from
      re-fitting ${labN(P.mean_improvement)}, and the chance of seeing that by luck alone ${labN(P.p_one_sided)}.</p>
    <h3 style="margin:18px 0 8px;font-size:14px">When v5.0 says a number, how often does it happen?</h3>
    <table class="ob"><thead><tr><th>It said</th><th>On average</th><th>It happened</th><th>Rows</th></tr></thead>
      <tbody>${cal((D.calibration || {}).champion)}</tbody></table>
  </div>`;
}

/* [Sam, 2026-10-02] the game model's lines, graded in their OWN line of the
   record (record.json `game_lines`), never mixed into the props above. */
function mlbGameLineRecord(R){
  const G = R.game_lines || {}, M = G.by_market || {};
  const box = (k, t) => t && t.n ? `<div class="tr-box"><div class="k">${k}</div>
    <div class="v">${t.pct}%</div><div class="s">${t.w}/${t.n}</div></div>` : '';
  return G.n ? `<div class="tr-hero">${box('Game lines', G)}${box('Moneyline', M.moneyline)}${
    box('Run line', M.run_line)}</div>` : '';
}

async function renderRecord(){
  const v = $('#view');
  if (!RECORD){
    v.innerHTML = '<div class="msg">Loading…</div>';
    try { RECORD = await jget('data/latest/record.json'); }
    catch(e){
      v.innerHTML = `<div class="panel"><h2>Track Record</h2>
        <p class="plain">No record file yet.</p></div>`;
      return;
    }
  }
  const R = RECORD, M = R.overall || {};
  /* ⚠️ OPTIONAL: the model check writes its own file weekly. Missing is
     not an error on this tab — the panel simply does not draw. */
  let REFIT = null;
  try { REFIT = await jget('data/latest/mlb-refit.json'); } catch(e){ REFIT = null; }
  const W = await winnersLoad('mlb');
  const cal = R.calibration_meta || {};
  /* Bands now come from the MODEL's own graded rows, not from a copied
     ledger snapshot. Empty until enough cards are graded, and that is the
     honest state rather than a borrowed number. */
  const bands = (R.calibration || []).map(c => bandRow({
      name: c.bucket, n: c.n, said: c.predicted, hit: c.pct })).join('');

  const machine = M.n
    ? `<div class="tr-hero">
        <div class="tr-box"><div class="k">Auto card</div><div class="v">${M.w}<span style="font-size:18px;color:var(--mut)">/${M.n}</span></div><div class="s">${M.pct}% hit rate</div></div>
        <div class="tr-box"><div class="k">Pitchers</div><div class="v">${(R.by_kind.pitcher.pct ?? '—')}%</div><div class="s">${R.by_kind.pitcher.w}/${R.by_kind.pitcher.n}</div></div>
        <div class="tr-box"><div class="k">Hitters</div><div class="v">${(R.by_kind.hitter.pct ?? '—')}%</div><div class="s">${R.by_kind.hitter.w}/${R.by_kind.hitter.n}</div></div>
        <div class="tr-box"><div class="k">Cards graded</div><div class="v">${R.days_graded}</div></div>
       </div>`
    : '<p class="plain">The automatic card has not been graded yet.</p>';

  /* 🔴 EVERY DAY IS CLICKABLE. Sam, 2026-08-26: he wants to open a date
     and see which props hit and which missed. The per-pick detail is a
     SEPARATE gzipped file, fetched once the first time a row is opened --
     inlining it would push the record file past 400KB uncompressed by the
     end of the season on a tab that only needs totals to draw. */
  const dayRows = (R.by_day || []).map(d =>
    `<tr class="dayrow" data-date="${d.date}" title="Click to see every pick from this card">
       <td>${d.date} <span class="caret">▸</span></td>
       <td><b>${d.w}/${d.n}</b>${d.voids ? ` <span class="rec" style="font-size:11px">+${d.voids} void</span>` : ''}</td>
       <td>${(100*d.w/d.n).toFixed(0)}%</td></tr>
     <tr class="daydetail" id="dd-${d.date}" hidden><td colspan="3"></td></tr>`).join('');

  /* Wire the day rows after the table is in the DOM. */
  setTimeout(() => {

/* Trends.
   Descriptive only -- form, splits, and what the market implies. No model
   is involved and none is claimed (ledger rule 55). */
function renderTrends(){
  const v = $('#view');
  setTimeout(() => {
    const t = $('#tr-started');
    if (t) t.addEventListener('click', () => { showStarted = !showStarted; renderTrends(); });
  }, 0);
  if (!BOARD){ v.innerHTML = '<div class="msg">No odds file yet.</div>'; return; }

  const teamLine = (t, tt) => {
    const s = SPLITS[t] || {};
    const cells = [
      s.w != null ? `<b>${s.w}-${s.l}</b> overall` : null,
      s.last10 ? `<b>${s.last10}</b> last 10` : null,
      s.home ? `<b>${s.home}</b> home` : null,
      s.away ? `<b>${s.away}</b> road` : null,
      s.streak ? `<b>${s.streak}</b> streak` : null,
      tt != null ? `market has them at <b>${tt}</b> runs` : null,
    ].filter(Boolean);
    return `<div style="display:flex;align-items:center;gap:9px;padding:7px 0">
      ${mark(t, null, 22)}<b style="width:40px">${ab(t)}</b>
      <span style="font-size:12px;color:var(--mut)">${cells.join(' &nbsp;·&nbsp; ')}</span></div>`;
  };

  /* The "why" under each matchup. Built ONLY from numbers already on the
     card -- records, streaks, and the market's own implied team totals.
     ⛔ Nothing here is a projection and nothing is invented: where a
     figure is missing the sentence about it is simply not written. */
  const trendWhy = g => {
    const a = g.away, h = g.home;
    const sa = SPLITS[a] || {}, sh = SPLITS[h] || {};
    const ta = (g.team_total||{})[a], th = (g.team_total||{})[h];
    const bits = [];

    if (ta != null && th != null){
      const fav = ta > th ? a : h, gap = Math.abs(ta - th);
      bits.push(gap < 0.35
        ? `The market splits this almost evenly — ${ta} runs to ${th}, a gap of ${gap.toFixed(2)}. It is pricing a coin-flip.`
        : `The market leans <b>${ab(fav)}</b>, giving them ${Math.max(ta,th)} runs against ${Math.min(ta,th)} — ${gap.toFixed(2)} of separation.`);
    }
    if (g.total != null){
      bits.push(g.total >= 9.5 ? `At ${g.total} this is one of the higher totals on the board — the books expect runs.`
              : g.total <= 7.5 ? `At ${g.total} the books expect a low-scoring game.`
              : `A total of ${g.total} is right around the league's middle.`);
    }
    const form = t => {
      const s2 = SPLITS[t] || {};
      if (!s2.last10) return null;
      const [w] = String(s2.last10).split('-').map(Number);
      if (isNaN(w)) return null;
      return w >= 7 ? `${ab(t)} come in hot at ${s2.last10} over their last ten`
           : w <= 3 ? `${ab(t)} are cold at ${s2.last10} over their last ten`
           : null;
    };
    const f = [form(a), form(h)].filter(Boolean);
    if (f.length) bits.push(f.join(', and ') + '.');

    const split = (t, s2) => (s2.home && s2.away)
      ? `${ab(t)} are ${t === h ? s2.home : s2.away} ${t === h ? 'at home' : 'on the road'}` : null;
    const sp = [split(a, sa), split(h, sh)].filter(Boolean);
    if (sp.length === 2) bits.push(sp.join(' while ') + '.');

    if (!bits.length) return '';
    return `<div class="why2" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
              font-size:12.5px;line-height:1.55;color:#46525f">${bits.join(' ')}</div>`;
  };

  const allT = BOARD.games || [];
  const {list: _trList, nStarted, allDone} = splitStarted(allT);
  const games = _trList
    .slice().sort((a,b) => a.commence < b.commence ? -1 : 1);
  v.innerHTML = `<div style="margin-bottom:8px">
      <h2 style="margin:0 0 4px;font-size:16px">Trends</h2></div>
    ${startedToggle(nStarted, 'tr-started', allDone)}
    ${games.length ? '' : '<div class="msg">No games on the board.</div>'}
    ${games.map(g => `<div class="panel" style="padding:14px 16px;margin:10px 0">
        <div style="font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em">
          ${new Date(g.commence).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'})}
          &nbsp;·&nbsp; total ${g.total ?? '—'} &nbsp;·&nbsp; run line ${g.run_line_team ? ab(g.run_line_team) + ' ' : ''}${sgn(g.run_line)}
        </div>
        ${teamLine(g.away, (g.team_total||{})[g.away])}
        ${teamLine(g.home, (g.team_total||{})[g.home])}
        ${trendWhy(g)}
      </div>`).join('')}`;
}

let PROPS = null;
/* The published card, cached. renderPicks and renderParlays were each
   re-fetching picks/<date>.json on EVERY render -- which the 60-second
   timer meant was every minute, per tab. Caching it is a bandwidth win and,
   more importantly, it lets the change-detector below see whether anything
   on the card has actually moved. */
let CARD = null, CARD_DATE = null, CARD_ASKED = null, CARD_BACK = 0;

/* 🔴🔴 THE CARD FALLS BACK TO THE MOST RECENT PUBLISHED ONE.
   [Sam, 2026-09-14: "gizmos picks did not load today and did not
   deliver any picks for the mlb slate as well as didnt provide
   projections, thats one of our main builds"]

   Measured the morning he said it: the tab read "No card published for
   2026-09-14 yet." The MLB card cron is 10:04am ET. So THE MAIN TAB WAS
   BLANK FROM MIDNIGHT TO 10AM ET — ten hours, EVERY DAY, by design —
   while a complete card for the previous day sat one filename away.

   ⛔ AND IT IS THE SAME FAILURE SHAPE AS THE 09-12 OUTAGE: all-or-nothing.
   One missing file took down the picks, the parlays AND every projection
   on the Player Props tab, because all three ask for today's date and
   give up on a 404.

   ➡️ SO THE RULE IS: A MISSING CARD IS A REASON TO SHOW AN OLDER ONE
   UNDER ITS OWN DATE — NEVER A REASON TO SHOW NOTHING. `CARD_BACK` still
   counts how many days back it came from.
   [Sam, 2026-10-01] no explanation boxes on the page: a fallback card is
   labelled only by its own date (`CARD_DATE`) in the headings. */
const CARD_MAX_BACK = 7;
async function loadCard(){
  const d = todayET();
  if (CARD && CARD_ASKED === d) return CARD;
  CARD_ASKED = d;
  let err = null;
  for (let back = 0; back <= CARD_MAX_BACK; back++){
    /* ⛔ ET, never the browser's local midnight. `todayET` is the one
       function that decides what day it is here (rule 66), so the walk
       back counts days off ITS answer rather than off a new Date(). */
    const t = new Date(d + 'T12:00:00Z');
    t.setUTCDate(t.getUTCDate() - back);
    const day = t.toISOString().slice(0, 10);
    try {
      const c = await jget(`picks/${day}.json`);
      CARD = c; CARD_DATE = day; CARD_BACK = back;
      return CARD;
    } catch(e){ if (back === 0) err = e; }
  }
  CARD = null; CARD_DATE = null; CARD_BACK = 0;
  throw err || new Error('no card in the last ' + CARD_MAX_BACK + ' days');
}

/* A game that has started is not a betting board any more.
   The collector keeps everything -- the stored snapshot is a record, and
   records do not get edited. The PAGE decides what is still actionable,
   and by default that is games that have not thrown a pitch. Measured on
   a live board: 11 of 20 games had already started, which is 1,762 dead
   props sitting in front of 416 live ones. */
let showStarted = false;
let PICKKIND = 'all';
let MLBPICKKIND = 'props';
const hasStarted = g => new Date(g.commence) <= new Date();

/* The started/upcoming split, decided once. `allDone` means filtering
   would leave nothing, so the filter is not applied at all. */
function splitStarted(all){
  const nStarted = all.filter(hasStarted).length;
  const allDone = all.length > 0 && nStarted === all.length;
  return {list: (showStarted || allDone) ? all : all.filter(g => !hasStarted(g)),
          nStarted, allDone};
}

/* 🔴 A CHOICE THAT ISN'T ONE IS NOT A CHOICE. Sam, 2026-08-26: "if the
   games are all concluded this shouldnt even be an option." He is right --
   when EVERY game has started, hiding them empties the tab, so the toggle
   stops being a filter and becomes the only way to see anything. In that
   state the games are shown and no toggle is drawn.
   [Sam, 2026-10-01] no explanation boxes on the page: the toggle is a plain link. */
function startedToggle(n, id, allDone){
  if (!n || allDone) return '';
  return `<div style="margin:10px 0"><a id="${id}" style="color:var(--accent);font-weight:700;cursor:pointer">${
    showStarted ? 'Hide' : 'Show'} started games</a></div>`;
}
const PMARKETS = [
  ['batter_hits','Hits'],['batter_total_bases','Total bases'],
  ['batter_home_runs','Home runs'],['batter_rbis','RBIs'],
  ['batter_hits_runs_rbis','Hits+Runs+RBIs'],
  ['pitcher_strikeouts','Strikeouts (P)'],['pitcher_outs','Outs recorded (P)'],
];
const MKLABEL = Object.fromEntries(PMARKETS);

/* The "why", assembled here from the numbers rather than shipped as prose.
   One implementation, and the sentence can never drift from the figures
   sitting next to it. */
function propWhy(p){
  const e = p.evidence || {};
  if (!e.season) return '';
  const [h, n] = e.season.split('/').map(Number);
  const word = p.side === 'over' ? 'cleared this' : 'stayed under';
  const out = [`Has ${word} in <b>${h} of ${n}</b> games this season.`];
  if (e.vs_opp){
    const [vh, vn] = e.vs_opp.split('/').map(Number);
    if (vn >= 3) out.push(`Against ${ab(e.opp||'')}: <b>${vh} of ${vn}</b>.`);
  }
  if (p.implied != null && n >= 40){
    const own = 100 * h / n, gap = own - p.implied;
    if (Math.abs(gap) >= 8)
      out.push(`His own record says <b>${own.toFixed(0)}%</b>; the market prices it near <b>${p.implied}%</b>.`);
  }
  return out.join(' ');
}

/* 🔴 ONE PARLAY TABLE, TWO SPORTS. Extracted 2026-09-04 when football
   parlays shipped. ⛔ A second copy of this markup would be a second
   place for the same number to be formatted differently -- the exact
   hazard rule 66 names, and the reason `pickCard` and `projChip` are
   shared too. This function FORMATS what card.py / card_fb.py produced
   and computes nothing. */
function parlayTable(title, rows){
  const pn = el('div','panel');
  pn.innerHTML = `<h2>${title}</h2>
      <div style="overflow-x:auto"><table class="pairs">
      <thead><tr><th>Bet</th><th>Games</th><th class="n">Pays</th>
        <th class="n">All hit</th><th class="n">$30 EV</th></tr></thead>
      <tbody>${rows.map(x => `
        <tr>
          <td><b>${x.legs.join('</b> + <b>')}</b></td>
          <td class="rec">${x.games.join(' · ')}</td>
          <td class="n">${x.multiplier.toFixed(2)}x</td>
          <td class="n"><b>${x.joint}%</b></td>
          <td class="n">${x.ev_30 > 0 ? '+' : ''}${x.ev_30}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
  return pn;
}

async function renderParlays(){
  const v = $('#view'); v.innerHTML = '<div class="msg">Loading…</div>';
  const d = todayET();
  let P;
  try { P = await loadCard(); }
  catch(e){
    v.innerHTML = `<div class="panel"><h2>Parlays</h2>
      <p class="plain">No card published for ${d} yet.</p></div>`;
    return;
  }
  v.innerHTML = '';
  const PL = P.parlays || {};
  const head = el('div','panel');
  head.innerHTML = `<h2>Parlays &mdash; ${CARD_DATE}</h2>`;
  v.append(head);

  const live = new Set((P.picks || [])
    .filter(p => showStarted || !p.commence || new Date(p.commence) > new Date())
    .map(p => p.game));

  const TITLES = {'2': 'Two-leg &mdash; pays 1.8x or more',
                  '3': 'Three-leg &mdash; pays 3x or more',
                  '4': 'Four-leg &mdash; pays 3x or more'};
  let any = 0;
  ['2','3','4'].forEach(size => {
    const rows = (PL[size] || []).filter(x => !x.games || x.games.every(g => live.has(g)));
    if (!rows.length) return;
    any += rows.length;
    v.append(parlayTable(TITLES[size], rows));
  });

  const total = ['2','3','4'].reduce((n, k) => n + (PL[k] || []).length, 0);
  if (!any) v.append(el('div','msg', total
    ? 'No parlays left: every one has a leg in a game that has started.'
    : 'No parlays on this card.'));
}

   downloaded. ⚠️ Deliberately NOT a hardcoded list: the moment a
   back-fill lands the season appears on its own, with no code change.
   That is the same rule as everything else here -- never write down a
   fact you cannot auto-update.
   ══════════════════════════════════════════════════════════════════ */
const FBHAVE = {};

async function fbSeasonsAvailable(side){
  const sd = side || fbSide;
  const k = LEAGUE + '|' + sd;
  if (FBHAVE[k]) return FBHAVE[k];
  const got = await Promise.all(FB_SEASONS.map(async y => {
    try { const r = await fetch(fbPath(y, sd), {method: 'HEAD'}); return r.ok ? y : null; }
    catch(e){ return null; }
  }));
  FBHAVE[k] = got.filter(y => y !== null);
  return FBHAVE[k];
}

async function fbLoad(season){
  const k = LEAGUE + '|' + fbSide;
  FBDATA[k] = FBDATA[k] || {};
  if (FBDATA[k][season] !== undefined) return FBDATA[k][season];
  try { FBDATA[k][season] = await jgetGz(fbPath(season)); }
  catch(e){ FBDATA[k][season] = null; }
  return FBDATA[k][season];
}

const FBDOS = {};
async function fbDossierLoad(lg){
  if (FBDOS[lg] !== undefined) return FBDOS[lg];

     rule `fbDossierLoad`'s neighbour `fbRecordLoad` follows. */
  try { FBDOS[lg] = await jgetGz(`${LG_DATA[lg]}/latest/dossiers.json.gz`); }

function fbDossierBy(D){
  const m = new Map();
  (((D || {}).dossiers) || []).forEach(x => { if (x.board_id) m.set(x.board_id, x); });
  return m;
}

/* One section. ⛔ The state is carried by STYLE, never by the word
