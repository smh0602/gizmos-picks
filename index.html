/* ══════════════════════════════════════════════════════════════════
   FOOTBALL GAME CARD + BOX SCORE — MLB's Scores tab, for football.

   Sam, 2026-09-03: *"the score by quarter, show the betting lines, the
   odds under each team, home and away teams, the date, etc. i dont want
   to include player lines tho"*.

   🔴 SAME INTERACTION AS MLB: a clickable card, a modal on click, Escape
   and backdrop to close. It reuses MLB's own `.g`, `.g-top`, `.tm`,
   `.mid`, `.bar`, `.ovl` and `.modal` classes, so the two sports render
   through the SAME stylesheet rather than a lookalike.
   ⛔ NO PLAYER LINES, deliberately. MLB shows starting pitchers because
   they are the single biggest input to a baseball game; football has no
   equivalent, and inventing one would be filler.

   ⚠️ QUARTER SCORES REACH THE TWO LEAGUES BY DIFFERENT ROUTES, AND THIS
   FILE DOES NOT CARE WHICH. CFBD returns `homeLineScores`/`awayLineScores`
   on the same call we already make; nflverse's schedule has no
   per-quarter column at all, so the NFL's are DERIVED from play-by-play
   (T53) and joined into the same `home_line`/`away_line` keys. ⛔ THE
   PAGE MUST NEVER LEARN THE DIFFERENCE -- one renderer, one shape, and a
   game with no line score says so in words rather than drawing an empty
   grid. ⛔ Do not fabricate quarters from the final score.
   ══════════════════════════════════════════════════════════════════ */

/* The market row for one football game, from the live odds board. */
function fbBoardFor(g){
  const B = (FBBOARD[LEAGUE] || {}).games || [];
  if (!B.length) return null;
  const nm = x => String(x || '').toLowerCase();
  // ⚠️ The schedule says "SEA"; the board says "Seattle Seahawks". The
  // team directory bridges them, so match on BOTH shapes.
  const full = x => { const t = fbResolve(x); return (t && t.name) ? t.name : x; };
  const h = nm(full(g.home)), a = nm(full(g.away));
  return B.find(x => nm(x.home) === h && nm(x.away) === a) || null;
}

function fbGameCard(g){
  /* 🔴 THE LIVE VIEW, AND IT MUST BE READ HERE — this is the function
     that actually renders a game. `[2026-09-06]` ⛔ `fbScores` also
     defines a `row` template that has NEVER been called; wiring the live
     score into it would have shipped a "live" tab that could not show a
     live game. **A renderer nobody calls is worse than no renderer: it
     looks like the thing you edited.** */
  const M = fbMerge(g);
  const done = M.final;
  const c = el('div', 'g clickable');
  c.addEventListener('click', ev => {
    if (ev.target.closest('a')) return;
    fbOpenBox(g);
  });
  const b = fbBoardFor(g);
  const nameOf = x => { const t = fbResolve(x); return (t && t.name) ? t.name : x; };

  const side = (t, score, right) => {
    const d = el('div', 'tm' + (right ? ' r' : ''));
    /* ⚠️ A LIVE GAME SHOWS ITS SCORE WHERE A FINAL SHOWS ITS SCORE — the
       same slot, so the eye does not have to move when a game ends. */
    if (done || M.live) d.append(el('div', 'win', String(score == null ? '' : score)));
    else if (b && b.win_pct && b.win_pct[nameOf(t)] != null)
      d.append(el('div', 'win', b.win_pct[nameOf(t)] + '%'));
    d.append(el('div', 'abbr', right
      ? `${fbAb(t)} ${fbMark(t, 24)}` : `${fbMark(t, 24)} ${fbAb(t)}`));
    d.append(el('div', 'rec', nameOf(t) || ''));
    // 🔵 THE MONEYLINE UNDER EACH TEAM, exactly as MLB does it.
    const ml = b && (b.best_ml || {})[nameOf(t)];
    if (ml) d.append(el('div', 'ml', sgn(ml.price)));
    return d;
  };

  const mid = el('div', 'mid');
  if (M.live){
    /* 🔴 IN PROGRESS. The clock and the period come from the feed and
       nowhere else — our stored file has nothing to say about a game
       being played. */
    mid.append(el('div', 'time live', 'LIVE'));
    mid.append(el('div', 'sc', `${M.away} – ${M.home}`));
    mid.append(el('div', 'date', M.detail
      || ((M.clock || '') + (M.period ? ' · Q' + M.period : ''))));
  } else if (done){
    mid.append(el('div', 'time', g.overtime ? 'FINAL / OT' : 'FINAL'));
    mid.append(el('div', 'sc', `${M.away} – ${M.home}`));
    /* ⚠️ A DISAGREEMENT IS PUBLISHED, NEVER SWALLOWED. The stored score
       is what the Track Record grades against, so it is the one shown —
       but two sources disagreeing about a final is a real data problem
       and hiding it would make this tab the place it goes unnoticed. */
    if (M.conflict) mid.append(el('div', 'date confl',
      `live feed says ${M.theirs}`));
    else if (M.fromFeed) mid.append(el('div', 'date', 'just in'));
  } else {
    mid.append(el('div', 'date', fbKickDate(g.start) || ''));
    mid.append(el('div', 'time', fbKickTime(g.start) || 'TBD'));
  }
  const top = el('div', 'g-top');
  top.append(side(g.away, M.away, false), mid, side(g.home, M.home, true));
  c.append(top);

  // ---- market strip, same component as MLB's
  if (b && (b.total != null || b.run_line != null)){
    const bar = el('div', 'bar');
    // 🔴 NAME THE TEAM the spread belongs to. "-3.5" between two names
    // says nothing about whose line it is.
    const sp = b.run_line_team ? fbAb(b.run_line_team) + ' ' : '';
    bar.append(el('span', null,
      `O/U <b>${b.total ?? '&mdash;'}</b> &nbsp; Spread <b>${sp}${
        b.run_line != null ? sgn(b.run_line) : '&mdash;'}</b>`));
    bar.append(el('span', null, b.n_books
      ? `<b>${b.n_books}</b> books` : '<span class="sub">no moneyline posted</span>'));
    c.append(bar);
  }
  return c;
}

/* The modal. ⛔ No network call -- everything is already on the row. */
/* ══════════════════════════════════════════════════════════════════════
   🔴 THE BOX SCORE — PASSING, RUSHING AND RECEIVING, PER PLAYER
   ══════════════════════════════════════════════════════════════════════
   Sam, 2026-09-06: *"user need to be able to click on a score and see the
   box score from that game, includes qb passing stats, rb stats, wr
   stats, etc."*

   ✅ IT COMES FROM DATA WE ALREADY STORE. `players-<season>.json.gz` is
   the same file the card and the Track Record are built from, so a box
   score costs no new source, no new credit and no new cron.
   ✅ AND THE JOIN IS EXACT, MEASURED BEFORE IT WAS BUILT: every
   `game_id` in the logs matches a schedule id — **17 of 17 for college,
   285 of 285 for the NFL** — and every team named on a log row is one of
   that game's two sides. ⛔ No name matcher, keyed on the id (rule 54).

   [Sam, 2026-10-01] no explanation boxes or tags on the page. */
/* ══════════════════════════════════════════════════════════════════
   🔴 THE BOX SCORE COMES FROM ESPN, AND THE STORED LOG IS THE FALLBACK.
   `[Sam, 2026-09-06: "not all games in the scores tab have a full box
   score ... needs to allow the user to click into games in real time and
   see the live boxscore as well as seeing box scores for games that have
   finished"]`

   ⛔ WHY THE STORED LOG COULD NEVER ANSWER THIS, MEASURED RATHER THAN
   ARGUED `[2026-09-06, against the shipped files]`:

       Division I games PLAYED so far          202
       ...carrying a stored player log          17
       SATURDAY 2026-09-05 alone               103
       ...carrying a stored player log           0   🔴

   The college logs cover the FBS teams this product tracks and are
   rebuilt WEEKLY, so on any day before the rebuild the biggest slate of
   the week has NO box score at all. That is the bug Sam is looking at.

   ✅ ESPN's own summary endpoint answers for every game, live and final.
   MEASURED IN SAM'S OWN BROWSER, from this page's origin:
       CORS                       ALLOWED  (Access-Control-Allow-Origin)
       36 Division I games sampled from 9/5
         both sides with players  35
         no player stats at all    1   (an FCS-vs-D2 game ESPN carries
                                        but publishes no players for)
   ⛔ NO COLLECTOR, NO STORED FILE, NO COMMIT, NO CREDITS — the same shape
   as the live score layer and as MLB's statsapi polling.

   🔴 THE COLUMNS ARE READ FROM THE PAYLOAD, NEVER ASSUMED (rule 121), and
   this is not theoretical — the two leagues genuinely disagree:
       college passing labels  C/ATT YDS AVG TD INT QBR            (6)
       NFL     passing labels  C/ATT YDS AVG TD INT SACKS QBR RTG  (8)
   A positional parser would have printed a college QB's QBR under an NFL
   "SACKS" heading. So every table is built from `labels[]`, and a block
   whose labels and stats disagree in length shows only the columns both
   carry rather than shifting the numbers left.

   ⚠️ THE STORED LOG IS STILL THE GRADING AUTHORITY. Track Record grades
   against `players-<season>.json.gz`, never against this.
   [Sam, 2026-10-01] the panel no longer names its source on the page.
   ══════════════════════════════════════════════════════════════════ */
/* 🔴 EVERY ESPN STRING IS ESCAPED. This is the first third-party text
   this page has ever put into `innerHTML` — our own files are ours, a
   vendor's are not — and a team nickname carrying a `<` would otherwise
   be markup. ⛔ There is no global escaper in this file; the two `esc`
   identifiers in it are Escape-key handlers, which is exactly the kind
   of near-miss that ships. */
function fbEsc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

const FBBOX = {};            /* league|id -> parsed box, or a reason      */
let FB_BOX_OFF = false;      /* ⛔ set ONLY by a refusal, never by a 404   */

/* ⚠️ ONE REFUSAL IS A FACT ABOUT THE BROWSER; ONE 404 IS A FACT ABOUT ONE
   GAME. Merging them would let a single missing event silence the whole
   feature for the session — so a bad status is returned for that game and
   only a THROWN fetch (CORS, offline, DNS) turns the layer off. */
async function fbBoxFetch(id, force){
  const key = LEAGUE + '|' + id;
  if (!force && FBBOX[key] !== undefined) return FBBOX[key];
  if (FB_BOX_OFF) return null;
  const base = FB_LIVE_PATH[LEAGUE];
  if (!base || !id) return null;
  /* 🔴 ASK ONLY WHEN WE HOLD ESPN'S OWN ID. Measured 2026-09-06 against
     the shipped schedules: NFL 2026 carries it on 272 of 272 games and
     NFL 2025 on 0 of 285 — that season's key is `2025_01_DAL_PHI`, which
     is nflverse's, not ESPN's. ⛔ Sending it would be a guaranteed 404
     dressed up as a question. The stored logs DO cover 2025, so this
     returns a reason and the panel falls through to them. */
  if (!/^\d+$/.test(String(id))) { FBBOX[key] = {noid: true}; return FBBOX[key]; }
  let out;
  try {
    const r = await fetch(`${FB_LIVE_BASE}/${base}/summary?event=${encodeURIComponent(id)}`,
                          {cache: 'no-store'});
    out = r.ok ? fbBoxParse(await r.json()) : {http: r.status};
  } catch (e) {
    FB_BOX_OFF = true;
    return null;
  }
  FBBOX[key] = out;
  return out;
}

/* Read the shape that arrived. Every field is defended, because a field
   this function invents is a number the page would state on ESPN's
   behalf. */
function fbBoxParse(j){
  const S = v => (v === null || v === undefined) ? '' : String(v);
  const pl = (j && j.boxscore && j.boxscore.players) || [];
  const cmp = (j && j.header && j.header.competitions) || [];
  const st  = (cmp[0] && cmp[0].status) || {};
  const ty  = st.type || {};
  const teams = pl.map(t => ({
    name:  S((t.team || {}).displayName || (t.team || {}).shortDisplayName),
    abbr:  S((t.team || {}).abbreviation),
    blocks: ((t.statistics) || []).map(s => ({
      name:   S(s.name),
      text:   S(s.text),
      labels: Array.isArray(s.labels) ? s.labels.map(S) : [],
      totals: Array.isArray(s.totals) ? s.totals.map(S) : [],
      rows:   ((s.athletes) || []).map(a => ({
        name:   S(((a.athlete) || {}).displayName),
        jersey: S(((a.athlete) || {}).jersey),
        pos:    S((((a.athlete) || {}).position || {}).abbreviation),
        stats:  Array.isArray(a.stats) ? a.stats.map(S) : []
      }))
    }))
  }));
  return {
    teams,
    state:  S(ty.state),
    detail: S(ty.detail || ty.shortDetail),
    live:   ty.state === 'in',
    /* ⚠️ COMPUTED, NEVER WRITTEN (rule 132). */
    players: teams.reduce((n, t) => n + t.blocks.reduce((k, b) => k + b.rows.length, 0), 0),
    sides:   teams.filter(t => t.blocks.some(b => b.rows.length)).length,
    at: Date.now()
  };
}

/* The three Sam named, in his order, open. Everything else is real and is
   offered rather than dropped — but folded, so the modal is a box score
   and not a wall of special teams. */
const FB_BOX_MAIN = ['passing', 'rushing', 'receiving'];

/* ⚠️ SORTED BY THE COLUMN LABELLED `YDS`, IF THERE IS ONE. Found by its
   LABEL, so it survives the two leagues carrying different columns — and
   when no such label exists the feed's own order is kept rather than
   invented. */
function fbBoxSort(b){
  const i = b.labels.indexOf('YDS');
  if (i < 0) return b.rows;
  const num = r => { const v = parseFloat(String(r.stats[i]).replace(/[^\d.\-]/g, ''));
                     return isFinite(v) ? v : -Infinity; };
  return b.rows.slice().sort((x, y) => num(y) - num(x));
}

function fbBoxBlock(b){
  if (!b.rows.length) return '';
  const rows = fbBoxSort(b);
  /* 🔴 A ROW WHOSE CELL COUNT DISAGREES WITH THE HEADER IS NOT SHIFTED
     LEFT TO FIT. Render the columns both sides actually have. */
  const wide = rows.reduce((m, r) => Math.max(m, r.stats.length), 0);
  const n = Math.min(b.labels.length, wide);
  const nm = b.name.replace(/([A-Z])/g, ' $1');
  return `<h4 class="bxh">${nm.charAt(0).toUpperCase() + nm.slice(1)}</h4>
    <div style="overflow-x:auto"><table class="bs bx" style="width:100%">
      <thead><tr><th>Player</th>${
        b.labels.slice(0, n).map(l => `<th class="n">${fbEsc(l)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td style="white-space:nowrap"><b>${fbEsc(r.name)}</b>${
          r.pos ? ` <span class="sub">${fbEsc(r.pos)}</span>`
                : r.jersey ? ` <span class="sub">#${fbEsc(r.jersey)}</span>` : ''}</td>
        ${Array.from({length: n}, (_, i) => `<td class="n">${
          (r.stats[i] === '' || r.stats[i] === undefined) ? '&mdash;' : fbEsc(r.stats[i])
        }</td>`).join('')}
      </tr>`).join('')}</tbody></table></div>`;
}

function fbBoxSide(t){
  const main = FB_BOX_MAIN
      .map(k => t.blocks.find(b => b.name === k)).filter(Boolean)
      .map(fbBoxBlock).join('');
  const rest = t.blocks.filter(b => FB_BOX_MAIN.indexOf(b.name) < 0 && b.rows.length);
  const more = rest.length
    ? `<details class="bxmore"><summary>${rest.length} more &mdash; ${
        rest.map(b => fbEsc(b.name.replace(/([A-Z])/g, ' $1').toLowerCase().trim()))
            .join(', ')}</summary>${rest.map(fbBoxBlock).join('')}</details>`
    : '';
  return `<div class="bxteam"><h3 class="bxt">${fbMark(t.name, 20)} ${
    fbEsc(t.abbr || fbAb(t.name))}</h3>${
    main || '<p class="plain">No passing, rushing or receiving recorded yet.</p>'}${more}</div>`;
}

/* The ESPN half of the panel. ⛔ Returns null when it has nothing, so the
   caller falls through to the stored log rather than printing an empty
   box over a log that exists. */
function fbBoxEspn(box){
  if (!box || box.http || !box.teams || !box.teams.length) return null;
  if (!box.sides) return null;
  /* [Sam, 2026-10-01] no explanation boxes or tags on the page: the feed's
     own game status as one plain line, then each side (a side with no
     stats prints fbBoxSide's own plain line). */
  return `<p class="plain">${fbEsc(box.detail || (box.live ? 'in progress' : 'final'))}</p>
    ${box.teams.map(fbBoxSide).join('')}`;
}

const FBLOG = {};
async function fbLogsLoad(season){
  const k = LEAGUE + '|' + season;
  if (FBLOG[k] !== undefined) return FBLOG[k];
  try {
    const d = await jgetGz(`${LG_DATA[LEAGUE]}/latest/players-${season}.json.gz`);
    /* Index by game once, on load — a modal must not walk every player. */
    const by = {};
    Object.values(d.players || {}).forEach(p => (p.g || []).forEach(r => {
      const gid = String(r.game_id == null ? '' : r.game_id);
      if (!gid) return;
      (by[gid] ||= []).push({ name: p.name, pos: p.pos || r.pos || '', r });
    }));
    FBLOG[k] = by;
  } catch (e) { FBLOG[k] = null; }
  return FBLOG[k];
}

/* ⚠️ `0` IS A REAL NUMBER AND `null` IS NOT. A blank cell and a zero are
   different facts — the same distinction the Track Record makes with an
   em-dash — so this never turns one into the other. */
function fbNum(v){ return (v === null || v === undefined || v === '') ? null : Number(v); }

function fbStatRows(rows, kind){
  const has = r => kind === 'pass' ? fbNum(r.att)
              : kind === 'rush' ? fbNum(r.car)
              : fbNum(r.rec) !== null ? fbNum(r.rec) : fbNum(r.tgt);
  return rows
    .map(x => ({ ...x, k: has(x.r) }))
    .filter(x => x.k !== null && x.k > 0)
    .sort((a, b) => {
      const y = kind === 'pass' ? 'pass_yds' : kind === 'rush' ? 'rush_yds' : 'rec_yds';
      return (fbNum(b.r[y]) || 0) - (fbNum(a.r[y]) || 0);
    });
}

function fbBoxTable(rows, kind, label){
  const list = fbStatRows(rows, kind);
  if (!list.length) return '';
  const cols = kind === 'pass'
      ? [['C/ATT', r => `${fbNum(r.cmp) ?? '—'}/${fbNum(r.att) ?? '—'}`],
         ['YDS', r => fbNum(r.pass_yds)], ['TD', r => fbNum(r.pass_td)],
         ['INT', r => fbNum(r.int)]]
    : kind === 'rush'
      ? [['CAR', r => fbNum(r.car)], ['YDS', r => fbNum(r.rush_yds)],
         ['TD', r => fbNum(r.rush_td)],
         ['AVG', r => { const c = fbNum(r.car), y = fbNum(r.rush_yds);
                        return (c && y != null) ? (y / c).toFixed(1) : null; }]]
      : [['REC', r => fbNum(r.rec)], ['YDS', r => fbNum(r.rec_yds)],
         ['TD', r => fbNum(r.rec_td)],
         /* ⚠️ TARGETS ARE NFL-ONLY. College play-by-play does not carry
            them, so the column is DROPPED rather than filled with a
            zero that would read as "nobody threw to him". */
         ...(list.some(x => fbNum(x.r.tgt) !== null)
             ? [['TGT', r => fbNum(r.tgt)]] : [])];
  const cell = v => v === null || v === undefined ? '<td class="n">&mdash;</td>'
                                                  : `<td class="n">${v}</td>`;
  return `<h4 class="bxh">${label}</h4>
    <table class="bs bx" style="width:100%">
      <thead><tr><th>Player</th>${cols.map(c => `<th class="n">${c[0]}</th>`).join('')}</tr></thead>
      <tbody>${list.map(x => `<tr>
        <td style="white-space:nowrap"><b>${x.name}</b>${
          x.pos ? ` <span class="sub">${x.pos}</span>` : ''}</td>
        ${cols.map(c => cell(c[1](x.r))).join('')}
      </tr>`).join('')}</tbody></table>`;
}

/* Has this game started, by the clock? ⛔ Answers ONLY what the kickoff
   time supports — it does not claim the game is over, because nothing in
   the stored file knows that until a score lands. */
function fbKickedOff(g){
  if (!g.start) return false;
  const s = String(g.start);
  const d = /[Zz]|[+\-]\d\d:?\d\d$/.test(s) ? new Date(s)
          : new Date(s.replace(' ', 'T') + '-04:00');   /* naive stamps are ET */
  return isFinite(d) && d.getTime() < Date.now();
}

function fbBoxScore(g, by, box){
  /* 🔴 ESPN FIRST, THE STORED LOG SECOND, AND A REASON THIRD. Measured
     2026-09-06: the stored logs hold 17 of 202 Division I games played
     and ZERO of Saturday's 103, so preferring them would keep the empty
     panel Sam reported. */
  const live = fbBoxEspn(box);
  if (live) return live;
  /* 🔴 A GAME WITH NO PLAYERS IS THREE DIFFERENT FACTS AND THE FEED
     SAYS WHICH. Measured against live ESPN 2026-09-06: the 2026 NFL
     opener came back `state:"pre"` with 0 players and the kickoff
     time in `detail`, while a Division II final came back `post`
     with 0 players. ⛔ Calling both "publishes no player stats" would
     repeat the exact mistake of the modal that told Sam a game had
     not kicked off three and a half hours after kickoff — rule 134,
     the page may only assert what its data carries.
     [Sam, 2026-10-01] each is one plain line; a refused, id-less or
     failed ESPN request prints nothing and the stored log shows. */
  const why = (box && box.state === 'pre')
        ? '<p class="plain">This game has not kicked off.</p>'
      : (box && box.live)
        ? `<p class="plain">Under way${box.detail ? ' — ' + fbEsc(box.detail) : ''},
            and ESPN has not posted any player stats yet.</p>`
      : (box && box.teams && box.teams.length && !box.sides)
        ? `<p class="plain">ESPN carries this game but publishes no
            player stats for it.</p>`
        : '';
  /* One plain line: with nothing stored for this game the reason stands
     alone, rather than above the stored log's own empty line. */
  if (why && !(by && (by[String(g.id)] || []).length)) return why;
  const stored = fbBoxStored(g, by);
  return why + stored;
}

function fbBoxStored(g, by){
  // [Sam, 2026-10-01] no explanation boxes on the page: each empty state is one plain line.
  if (!by) return `<p class="plain">No player logs stored for ${fbScSeason}.</p>`;
  const rows = by[String(g.id)] || [];
  if (!rows.length) return '<p class="plain">No player log for this game.</p>';
  const side = nm => {
    const mine = rows.filter(x => x.r.team === nm);
    if (!mine.length) return `<div class="bxteam"><h3 class="bxt">${fbMark(nm, 20)}
      ${fbAb(nm)}</h3><p class="plain">No log stored for this side.</p></div>`;
    const tables = ['pass', 'rush', 'rec'].map(k => fbBoxTable(mine, k,
      k === 'pass' ? 'Passing' : k === 'rush' ? 'Rushing' : 'Receiving')).join('');
    return `<div class="bxteam"><h3 class="bxt">${fbMark(nm, 20)} ${fbAb(nm)}</h3>
      ${tables || '<p class="plain">No passing, rushing or receiving recorded.</p>'}</div>`;
  };
  return side(g.away) + side(g.home);
}

async function fbOpenBox(g){
  const ovl = el('div', 'ovl');
  const nameOf = x => { const t = fbResolve(x); return (t && t.name) ? t.name : x; };
  const b = fbBoardFor(g);
  const hl = g.home_line, al = g.away_line;

  /* Score by quarter. ⚠️ Render WHATEVER LENGTH comes back -- an
     overtime game has more than four columns, and assuming 4 would hide
     the overtime period that decided the game. */
  const n = Math.max(hl ? hl.length : 0, al ? al.length : 0);
  const head = Array.from({length: n}, (_, i) =>
    `<th class="n">${i < 4 ? (i + 1) : (n === 5 ? 'OT' : 'OT' + (i - 3))}</th>`).join('');
  const row = (t, line, total) => `<tr>
      <td style="white-space:nowrap">${fbMark(t, 20)} <b>${fbAb(t)}</b></td>
      ${Array.from({length: n}, (_, i) =>
        `<td class="n">${(line && line[i] != null) ? line[i] : ''}</td>`).join('')}
      <td class="n"><b>${total == null ? '' : total}</b></td>
    </tr>`;

  /* [Sam, 2026-10-01] no explanation boxes on the page: the empty state is one plain line.
     🔴 "Not kicked off" is derived from the kickoff time, never from a
     missing score: it once said so about a game that had kicked off three
     and a half hours earlier `[Sam's screenshot, UCLA @ California,
     2026-09-06]`. ⛔ Rule 132. */
  const quarters = n
    ? `<table class="bs" style="width:100%">
         <thead><tr><th>Team</th>${head}<th class="n">T</th></tr></thead>
         <tbody>${row(g.away, al, g.away_score)}${row(g.home, hl, g.home_score)}</tbody>
       </table>`
    : `<p class="plain">${g.final ? 'No quarter scores stored for this game.'
        : fbKickedOff(g) ? 'No score stored for this game yet.'
        : 'This game has not kicked off.'}</p>`;

  const line = (label, val) => val == null || val === ''
    ? '' : `<div><span class="lab">${label}</span> <b>${val}</b></div>`;

  const market = b
    ? `<div class="sp2" style="display:flex;flex-wrap:wrap;gap:18px;margin-top:4px">
         ${line('O/U', b.total)}
         ${line('Spread', (b.run_line_team ? fbAb(b.run_line_team) + ' ' : '')
                          + (b.run_line != null ? sgn(b.run_line) : ''))}
         ${line(fbAb(g.away), (b.best_ml || {})[nameOf(g.away)]
                ? sgn(b.best_ml[nameOf(g.away)].price) : '')}
         ${line(fbAb(g.home), (b.best_ml || {})[nameOf(g.home)]
                ? sgn(b.best_ml[nameOf(g.home)].price) : '')}
         ${line('Books', b.n_books)}
       </div>`
    : '<p class="plain">No live odds stored for this game.</p>';

  const venue = [g.venue, g.roof, g.surface].filter(Boolean).join(' &middot; ');
  const wx = [g.temp != null ? g.temp + '&deg;F' : '',
              g.wind != null ? g.wind + ' mph wind' : ''].filter(Boolean).join(' &middot; ');

  ovl.innerHTML = `<div class="modal">
    <div class="modal-h">
      <div>
        <div style="font-weight:800;font-size:15px">${nameOf(g.away)} @ ${nameOf(g.home)}</div>
        <div class="sub" style="margin-top:3px">
          ${fbKickDate(g.start) || ''} ${fbKickTime(g.start) ? '&middot; ' + fbKickTime(g.start) : ''}
          ${g.week ? '&middot; Week ' + g.week : ''}
          ${g.neutral ? '&middot; neutral site' : ''}
          ${g.div_game ? '&middot; conference game' : ''}
        </div>
      </div>
      <button class="x" aria-label="Close">&times;</button>
    </div>
    <div class="modal-b">
      <h3 style="margin:0 0 8px;font-size:13px">Score by quarter</h3>
      ${quarters}
      <h3 style="margin:18px 0 4px;font-size:13px">Betting lines</h3>
      ${market}
      ${venue || wx ? `<p class="plain">${venue}${venue && wx ? '<br>' : ''}${wx}</p>` : ''}
      <h3 style="margin:18px 0 4px;font-size:13px">Box score</h3>
      <div id="fbbox"><p class="plain">Loading the player log&hellip;</p></div>
    </div></div>`;
  document.body.append(ovl);
  /* ⚠️ THE LOG IS FETCHED AFTER THE MODAL IS ON SCREEN, and that file is
     13KB to 520KB gzipped. Blocking the modal on it would make every
     click feel broken on a slow connection; this way the header, the
     quarters and the market are up instantly and the box score fills in.
     ✅ Cached per league+season, so the second click is free. */
  (async () => {
    const host = ovl.querySelector('#fbbox');
    if (!host) return;
    /* ⚠️ BOTH SOURCES ARE ASKED FOR AT ONCE. The ESPN summary is one
       small request and the stored log is up to 520KB gzipped; running
       them in series would make the fast answer wait for the slow one. */
    const [by, box] = await Promise.all([
      fbLogsLoad(fbScSeason),
      fbBoxFetch(g.espn || g.id, false)
    ]);
    if (!ovl.isConnected) return;      // they closed it while we fetched
    host.innerHTML = fbBoxScore(g, by, box);
    window.__fbBoxShown = {id: String(g.espn || g.id), source:
      (box && box.sides) ? 'espn' : (by && (by[String(g.id)] || []).length) ? 'stored' : 'none',
      live: !!(box && box.live), players: (box && box.players) || 0};

    /* 🔴 A LIVE GAME REFRESHES ITSELF, AND ONLY THE PANEL MOVES. Rule
       135: a timer must never move the page under someone's hands. The
       modal body's scroll position is captured and restored, the timer
       is cleared when the modal closes, and a game that is not `in`
       never starts one. */
    if (box && box.live && !FB_BOX_OFF) {
      /* 🔴 `.ovl` IS THE SCROLLER, NOT `.modal-b`. Found by a check
         written to guard this very check: `.ovl` carries
         `overflow-y:auto` and `.modal-b` carries no overflow at all, so
         restoring `.modal-b.scrollTop` was a SILENT NO-OP and a live
         refresh would have thrown the reader back to the top of the
         modal — the exact annoyance rule 135 exists for, reintroduced
         inside the fix for it. */
      const body = ovl;
      const tick = async () => {
        if (!ovl.isConnected) return;
        const nb = await fbBoxFetch(g.espn || g.id, true);
        if (!ovl.isConnected || !nb) return;
        const y = body ? body.scrollTop : 0;
        host.innerHTML = fbBoxScore(g, by, nb);
        if (body) body.scrollTop = y;   /* same frame: the node is replaced,
                                           not the document reflowed */
        if (nb.live) BOXT = setTimeout(tick, FB_LIVE_MS);
      };
      var BOXT = setTimeout(tick, FB_LIVE_MS);
      ovl.addEventListener('fbclose', () => clearTimeout(BOXT));
    }
  })();
  const close = () => {
    /* ⛔ THE TIMER IS STOPPED BEFORE THE NODE GOES. A poll that outlives
       its modal is a request nobody reads and a leak that compounds every
       time a game is opened. */
    ovl.dispatchEvent(new Event('fbclose'));
    ovl.remove(); document.removeEventListener('keydown', esc);
  };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  ovl.addEventListener('click', e => { if (e.target === ovl) close(); });
  ovl.querySelector('.x').addEventListener('click', close);
}



/* ══════════════════════════════════════════════════════════════════
   FOOTBALL NEWS. ⚪ DESCRIPTIVE. Headlines and links only, credited to
   the publisher. Same card grid as the MLB News tab.
   ══════════════════════════════════════════════════════════════════ */
const FBNEWS = {};

async function fbNewsLoad(){
  if (FBNEWS[LEAGUE] !== undefined) return FBNEWS[LEAGUE];
  try { FBNEWS[LEAGUE] = await jget(`${LG_DATA[LEAGUE]}/latest/news.json`); }
  catch(e){ FBNEWS[LEAGUE] = null; }
  return FBNEWS[LEAGUE];
}

/* 🔴 A HEADLINE WITHOUT ART STILL HAS A SUBJECT — the football version of
   MLB's `newsLogo`. Yahoo CFB supplied an image on 0 of 25 items in the
   probe, so without this a third of the grid is blank tiles.
   ⛔ CONSERVATIVE ON PURPOSE. It matches the LONGEST school name that
   appears as a whole phrase in the headline, and refuses anything under
   five characters. A short school name inside an unrelated word is
   exactly how a story about a person ends up wearing a team's crest, and
   a wrong crest states something the story does not say.
   ⚠️ Falls back to nothing, which renders the same plain tile MLB uses. */
let FB_NEWSIDX = null;
function fbNewsLogo(title){
  /* ⚠️ NORMALISE THE APOSTROPHE FIRST. `[2026-09-06]` "Michigan’s Heisman
     Sleeper" fell through to a blank tile because the possessive test
     only knew the STRAIGHT quote and the headline used a TYPOGRAPHIC one
     (U+2019). ⛔ Every publisher's CMS emits curly quotes; matching only
     the ASCII one silently loses a whole class of headline. */
  const raw = String(title || '').replace(/[\u2018\u2019\u02BC]/g, "'");
  const t = ' ' + raw.toLowerCase() + ' ';
  if (!FB_NEWSIDX || FB_NEWSIDX.lg !== LEAGUE){
    const dir = FBTEAMS[LEAGUE] || {};
    const seen = new Set();
    const names = [];
    Object.keys(dir).forEach(k => {
      if (k.length < 5) return;                 // ⛔ too short to be safe
      const e = dir[k];
      if (!e || !e.logo) return;
      const key = k.toLowerCase();
      if (seen.has(key)) return;
      seen.add(key); names.push([key, e.logo]);
    });
    names.sort((a, b) => b[0].length - a[0].length);   // longest first
    /* The short, ALL-CAPS keys the length rule had to exclude. */
    const caps = [];
    Object.keys(dir).forEach(k => {
      if (k.length >= 5 || k.length < 2) return;
      if (k !== k.toUpperCase()) return;        // ⛔ acronyms only
      const e = dir[k];
      if (e && e.logo) caps.push([k, e.logo]);
    });
    FB_NEWSIDX = {lg: LEAGUE, names, caps};
  }
  for (const [nm, logo] of FB_NEWSIDX.names){
    if (t.indexOf(' ' + nm + ' ') > -1 || t.indexOf(' ' + nm + "'") > -1) return logo;
  }
  /* 🔴 THEN THE ACRONYMS, AND ONLY THEN. `[2026-09-06]` "Tiger Tails: Your
     daily LSU news" had no art because the safety rule drops any key
     under five characters — which is right for lowercase matching, and
     wrong for LSU, TCU, BYU, UCF, SMU and the rest.
     ⛔ THE GUARD IS CASE: an all-capitals key matched CASE-SENSITIVELY
     against the original headline, on word boundaries. "USC" cannot
     collide with a lowercase word, and this pass runs LAST so a full
     school name always wins. */
  for (const [nm, logo] of (FB_NEWSIDX.caps || [])){
    if (new RegExp('\\b' + nm + '\\b').test(raw)) return logo;
  }
  return '';
}

async function fbNews(){
  const v = $('#fbview');
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  const N = await fbNewsLoad();
  if (!N || !(N.items || []).length){
    v.innerHTML = fbShell(`<div class="msg">No ${LG_NAME[LEAGUE]} headlines yet.</div>`);
    fbWire(); return;
  }
  const ago = iso => {
    if (!iso) return '';
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.round(m/60) + 'h ago';
    return Math.round(m/1440) + 'd ago';
  };
  // [Sam, 2026-10-01] no explanation boxes or tags on the page; the last-updated time stays.
  v.innerHTML = fbShell(`<h2>Around the league</h2>
    <p>${freshness(N.pulled_at)}</p>
    <div class="nwgrid">
    ${N.items.map(i => `<a class="nwc" href="${i.link}" target="_blank" rel="noopener nofollow">
        ${(() => { const art = i.image || fbNewsLogo(i.title); return art
          ? `<div class="nwimg${i.image ? '' : ' crest'}"><img src="${art}" alt="" loading="lazy"
               onerror="this.closest('.nwimg').classList.add('noimg');
                        this.closest('.nwimg').dataset.src='${(i.source||'').replace(/'/g,'')}';
                        this.remove()"></div>`
          : `<div class="nwimg noimg" data-src="${i.source || ''}"></div>`; })()}
        <div class="bd">
          <div class="hl">${i.title}</div>
          <div class="mt">${i.source}${i.published ? ' &middot; ' + ago(i.published) : ''}</div>
          ${i.summary ? `<div class="sm">${i.summary}</div>` : ''}
        </div></a>`).join('')}
    </div>`);
  v.insertAdjacentHTML('beforeend', fbFlagsRecordHtml(await fbFlagsLoad()));
  fbWire();
}


async function renderFootball(){
  const v = $('#fbview');
  /* ⚠️ The SAME <h1> MLB uses, so the two sections share one page
     header rather than each inventing their own. */
  const t = $('#ttl'); if (t) t.textContent = tabName(FBTAB) || 'Football';
  drawTabs();
  setTagline();
  setTools(FBTAB);
  /* 🔴 LOAD THE LOGO DIRECTORY AND THE ODDS BOARD FIRST, once per league.
     ⛔ Loading them inside each tab would make the first paint logo-less
     and then reflow -- and the SCORES cards need the board too, for the
     moneyline under each team. Driving the page caught that: every card
     read "no live odds stored" because the board had only ever been
     fetched by the Odds tab. */
  await Promise.all([fbTeamsLoad(), fbBoardLoad()]);
  if (FBTAB === 'odds') return fbOdds();
  if (FBTAB === 'scores') return fbScores();
  if (FBTAB === 'props') return fbProps();
  if (FBTAB === 'news') return fbNews();
  if (FBTAB === 'picks') return fbPicks();
  if (FBTAB === 'parlays') return fbParlays();
  if (FBTAB === 'record') return fbRecord();
  if (FBTAB !== 'trends'){
    // [Sam, 2026-10-01] no explanation boxes on the page: one plain line.
    const [title] = FB_EMPTY[FBTAB];
    v.innerHTML = fbShell(
      `<div class="msg">${title} &mdash; not built for ${LG_NAME[LEAGUE]} yet.</div>`);
    fbWire(); return;
  }
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  /* 🔴 ASK WHAT EXISTS BEFORE DRAWING THE PICKER, and snap to a season
     that does. `[measured 2026-09-01]` switching College from defence to
     offence on any year before 2025 left the reader on a season with no
     file -- the control said 2023 and the table said nothing.
     [Sam, 2026-10-01] no explanation boxes on the page: the picker itself
     shows the season it moved to. */
  const avail = await fbSeasonsAvailable();
  if (avail.length && avail.indexOf(fbSeason) === -1){
    fbSeason = Math.max.apply(null, avail);
  }
  const doc = await fbLoad(fbSeason);
  const body = $('#fbbody');
  if (!doc){
    /* ⚠️ No doc loaded, so there is nothing to filter the metric list
       against — fbControls falls back to the full list, which is right:
       the picker should still work on a page that has no table yet. */
    v.innerHTML = fbShell(fbControls(avail, null) +
      `<div class="msg">No ${fbSeason} ${fbSide==='off'?'offense':'defense'} table for ${LG_NAME[LEAGUE]} yet.</div>`);
    fbWire(); return;
  }

  /* ══════════════════════════════════════════════════════════════════
     🔴 SAY HOW OLD THIS TABLE IS. Sam, 2026-09-08: *"the trends tab is
     still not updated."* ⛔ HE COULD NOT HAVE KNOWN FROM THE PAGE — it
     drew a full, confident table of numbers built on **2026-09-04** and
     said nothing about the date. ✅ The build age is ALWAYS shown, as the
     tab's last-updated time.
     [Sam, 2026-10-01] no out-of-date alert box on the page. */
  const builtAt = doc.built_at || null;
  let ageNote = '';
  if (builtAt){
    const hrs = (Date.now() - new Date(builtAt).getTime()) / 3600000;
    const when = isNaN(hrs) ? '' :
      hrs < 36 ? `${Math.max(0, Math.round(hrs))}h ago`
               : `${Math.round(hrs / 24)} days ago`;
    ageNote = `<p class="sub"><span class="rec">table built ${when}</span></p>`;
  }

  const D = doc.defences || doc.offences || {};
  /* 🔴🔴 ONLY OFFER A METRIC THE LOADED FILE ACTUALLY CARRIES.
     ⛔ `total_yds` was added to the builder and to this page in the same
        drop, and the two DO NOT ARRIVE TOGETHER: the page ships the
        moment it is uploaded, the table is only rebuilt on the next
        scheduled run. So there is a window -- hours for college, up to a
        week for the NFL -- where the page knows about a column the data
        does not have yet.
     ⚠️ THAT WINDOW IS NOT HYPOTHETICAL. `[2026-09-11, ledger rule 191]`
        A test and the file it asserted on shipped in two commits and the
        intermediate one was red before it ever ran. Same shape.
     ✅ So the picker is DERIVED FROM THE DATA rather than from a
        hard-coded list, and a metric appears the moment the builder
        starts publishing it -- no second upload, no ordering to get
        right, and this stays true for every metric added later. */
  const _probe = Object.values(D).map(t => t[fbPos]).find(Boolean) || {};
  const mets = fbMetricsFor(fbPos).filter(m => _probe[m.k] !== undefined);
  if (!mets.length) mets.push(fbMetricsFor(fbPos)[0]);
  if (!mets.some(m => m.k === fbMetric)) fbMetric = mets[0].k;
  /* 🔴 THE FLOOR COMES FROM THE FILE, NEVER FROM A CONSTANT HERE. It
     moves as the season fills up, and a page that hardcoded 8 would
     silently disagree with the data it is drawing. */
  const floor = doc.min_games_for_rank || FB_MIN_GAMES;
  const rows = [];
  for (const team in D){
    const e = D[team][fbPos];
    if (!e) continue;
    rows.push({ team, games:e.games, v:e[fbMetric],
                rank:e[fbMetric + '_rank'] });
  }
  /* 🔴 RANK AND SCALE ARE COMPUTED OVER EVERY TEAM, AND ONLY THE DISPLAY
     IS FILTERED. ⛔ Ranking within the selection would make "Rk 1" mean
     something different depending on which chips are lit, and the bar
     column says "Vs. league range" -- rescaling it to the SEC while the
     header still says league is exactly the kind of silent relabelling
     rule 66 is about. A filtered SEC row keeps its NATIONAL rank. */
  /* 🔴🔴 THE RANK IS READ FROM THE FILE. IT IS NOT COMPUTED HERE.
     ⛔ WHAT STOOD HERE WAS A SECOND COPY OF THE RANKING, AND IT CARRIED
        THE SAME BUG THE BUILDER HAD: `.sort((a,b) => b.v - a.v)` then
        `i + 1` hands EQUAL VALUES DIFFERENT RANKS, in whatever order the
        objects happened to arrive.
     `[measured 2026-09-11]` **5,613 of the college board's 6,116 ranks
        broke a tie arbitrarily.** 142 defences all allowing 0.0
        interceptions to running backs were ranked 1 through 142.
     ✅ `ranking.py` now ranks ONCE, in the builder, with ties sharing the
        best rank -- and the page reads that. Rule 66: one number per
        fact, the same everywhere.
     ⚠️ A MISSING RANK IS MEANINGFUL AND RENDERS AS A DASH. When every
        team in a column holds the identical value there is nothing to
        rank, so the builder publishes no rank at all rather than an
        invented one. */
  const rankedAll = rows.filter(r => r.games >= floor)
                        .sort((a,b) => b.v - a.v);
  const rankOf = new Map(rows.filter(r => r.rank != null)
                             .map(r => [r.team, r.rank]));
  const hi = rankedAll.length ? rankedAll[0].v : 1;
  const lo = rankedAll.length ? rankedAll[rankedAll.length-1].v : 0;
  /* 🔴 SORT DIRECTION IS THE READER'S, THE RANK IS NOT. Sam, 2026-09-11:
     "allow user to sort the yardage stats by most to least ... i just
     want it to change the order from either the most yards
     produced/allowed from top to bottom or vice versa."
     ⛔ Clicking re-orders the ROWS ONLY. A team ranked 41st still reads
     41st when the table is flipped -- a rank that changed when you
     clicked a header would be a different number wearing the same
     label, which is the same objection the conference filter already
     answers below. */
  const ranked = rankedAll.filter(r => fbConfTeamPass(r.team))
                          .sort((a,b) => (b.v - a.v) * fbSortDir);
  const thin   = rows.filter(r => r.games <  floor && fbConfTeamPass(r.team))
                     .sort((a,b) => (b.v - a.v) * fbSortDir);
  const rng = (hi - lo) || 1;
  const col = t => t > .5 ? '#b9482a' : (t < .5 ? '#1a7060' : '#3b6ea5');

  const metricLabel = (mets.find(m => m.k === fbMetric) || {}).l || 'Value';
  const sortArrow = fbSortDir === 1
    ? '<span style="color:#7c8794;font-size:10px">&#9660;</span>'
    : '<span style="color:#7c8794;font-size:10px">&#9650;</span>';

  /* [Sam, 2026-10-01] no explanation boxes or tags on the page.
     The rank direction rides the header itself: on defence rank 1 ALLOWS
     the most, i.e. the SOFTEST defence, not the best one. Both value
     columns sort and name the SELECTED metric, never a fixed "yards".
     "vs FBS" and the Gm tooltip are gated on the builder's own
     doc.per_game_scope flag (rule 132). */
  v.innerHTML = fbShell(`
    ${fbControls(avail, mets)}
    ${ageNote}
    ${fbConfBar()}
    <table class="fbt"><thead><tr>
      <th class="rk" style="white-space:normal">${
        fbSide==='off' ? 'Rk' : 'Rank (1 = most allowed)'}</th>
      <th>${fbSide==='off'?'Offense':'Defense'}</th>
      <th class="n fbsort" data-fbsort="1" title="Click to flip most/least"
          style="cursor:pointer;user-select:none;white-space:normal">${LEAGUE === 'ncaaf' && doc.per_game_scope
          ? 'Per game vs FBS' : 'Per gm'} ${sortArrow}</th>
      <th class="fbsort" data-fbsort="1" title="Click to flip most/least"
          style="width:32%;cursor:pointer;user-select:none">${metricLabel}
          ${fbSide==='off'?'produced':'allowed'} ${sortArrow}</th>
      <th class="n">Gm</th>
    </tr></thead><tbody>
    ${ranked.map(r => { const t = (r.v-lo)/rng; return `<tr>
        <td class="rk">${rankOf.get(r.team) ?? '&mdash;'}</td>
        <td><span style="display:inline-flex;align-items:center;gap:7px">
          ${fbMark(r.team, 20)}<b>${r.team}</b></span></td>
        <td class="n" style="color:${col(t)}"><b>${r.v.toFixed(1)}</b></td>
        <td><div class="fbbar"><i style="width:${(6+t*94).toFixed(1)}%;background:${col(t)}"></i></div></td>
        <td class="n">${r.games}</td></tr>`; }).join('')}
    ${thin.map(r => `<tr class="fbthin"><td class="rk">&mdash;</td>
        <td><span style="display:inline-flex;align-items:center;gap:6px">
          ${fbMark(r.team, 18)}<span>${r.team}</span></span></td>
        <td class="n">${r.v.toFixed(1)}</td>
        <td></td><td class="n">${r.games}</td></tr>`).join('')}
    ${(!ranked.length && !thin.length && fbConf.size) ? `<tr><td colspan="5"
        style="padding:16px;color:var(--mut)">No team in
        ${[...fbConf].join(', ')} has a ${fbSeason} ${fbPos} row in this table
        yet.</td></tr>` : ''}
    </tbody></table>`);
  fbWire();
}

function fbWire(){
  /* 🔴 GAME LINES IS ROUTED HERE, NOT IN `renderFootball` — that function is
     pinned byte for byte by `test_mlb_untouched.py`. Every football render
     ends in fbWire(), so this catches every path to the tab: a tab click, a
     conference chip, a league switch. ⚠️ The tab's own shells carry
     `data-gl`, so its own fbWire() calls do not re-enter it. */
  if (FBTAB === 'gamelines' && !document.querySelector('#fbview [data-gl]')) { fbGameLinesTab(); return; }
  const sel = (id, fn) => { const el = $('#'+id); if (el) el.addEventListener('change', fn); };
  sel('fb-side',   e => { fbSide = e.target.value; renderFootball(); });
  sel('fb-season', e => { fbSeason = +e.target.value; renderFootball(); });
  sel('fb-pos',    e => { fbPos = e.target.value; renderFootball(); });
  sel('fb-metric', e => { fbMetric = e.target.value; renderFootball(); });
  /* 🔴 WIRED IN fbWire(), WHERE EVERY OTHER FOOTBALL CONTROL IS WIRED.
     ⛔ A control that renders but does nothing is a failure this project
     keeps finding, and the reason the conference chips are wired here
     rather than in the tab that draws them. */
  document.querySelectorAll('#fbview .fbsort').forEach(th =>
    th.addEventListener('click', () => { fbSortDir = -fbSortDir; renderFootball(); }));
  /* 🔴 THE CONFERENCE CHIPS ARE WIRED HERE, NOT IN THE TABS THAT DRAW
     THEM. Every football tab already ends in fbWire(), so a tab that
     renders the bar cannot forget to wire it -- and a bar that renders
     but does nothing is the exact failure this project keeps finding.
     ⚠️ Harmless where no bar exists: the selector matches nothing. */
  fbConfWire(renderFootball);
}

function setLeague(lg){
  /* 🔴🔴 A WEEK NUMBER DOES NOT MEAN THE SAME THING IN THE TWO LEAGUES,
     AND `fbWeek` WAS SURVIVING THE SWITCH.
     `[measured 2026-09-12 by driving the page]` College week 2 is the
     slate in progress and NFL week 2 is NEXT Sunday, so:

       ncaaf -> nfl   NFL Scores opened on WEEK 2, Thursday 17 September,
                      skipping the week-1 Sunday slate that is TOMORROW
       nfl -> ncaaf   College Scores opened on WEEK 1, Saturday 29 AUGUST
                      -- a board two weeks old with 455 finals on it

     ⛔ NEITHER DIRECTION LOOKED BROKEN. Both rendered a full, correct
     table of the wrong week, which is why nothing caught it: there was
     no error, no empty state and no stale banner — just the wrong slate
     under the right heading.
     ⚠️ THE ASYMMETRY THAT HID IT: the SEASON picker already resets
     `fbWeek = null` when it changes, because a season change obviously
     invalidates a week. A LEAGUE change invalidates it just as
     completely and nothing did the same thing.
     ✅ Null means "work it out", and `fbCurrentWeek()` then picks the
     first week holding an unfinished game — per league, from that
     league's own schedule.
     ⛔ Do not "preserve the reader's week across leagues". There is no
     correspondence to preserve; college week 3 is NFL week 1.

     ⚠️ WHAT DELIBERATELY IS NOT RESET, because it was MEASURED rather
     than assumed: `fbMetric` survives and is correct — the Trends
     caller filters the metric list to what the loaded file carries and
     falls back, so college `total_yds` lands on NFL `rush_yds` with a
     matching header. The conference filter survives and is also
     correct — the NFL board ignores college conferences rather than
     emptying. Both were driven before this comment was written. */
  fbWeek = null;
  const cur = LEAGUE === 'mlb' ? TAB : FBTAB;   // the tab the reader is on
  LEAGUE = lg;
  if (lg === 'mlb') TAB = nextTab(cur, lg); else FBTAB = nextTab(cur, lg);
  document.querySelectorAll('.lgnav a[data-lg]').forEach(a =>
    a.classList.toggle('on', a.dataset.lg === lg));
  /* ⚠️ setTagline() runs again inside show()/renderFootball() with the
     tab known; this is just the first paint. */
  setTagline();
  const mlb = lg === 'mlb';
  drawTabs();
  /* 🔴 THE TOOLS BAR STAYS UP FOR FOOTBALL. Hiding it was why the
     football section had no page title and no bet-link state picker,
     and it is a large part of why the two halves of the site did not
     look like the same product.
     ⛔ Only the MLB-SPECIFIC controls are hidden -- the date picker
     (football is weekly, not daily) and the live/final filter (neither
     football feed carries in-game state). The title and the state
     picker are shared, because a bet link needs a state whatever the
     sport. */
  document.querySelector('.tools').style.display = '';
  setTools(mlb ? TAB : FBTAB);
  $('#view').style.display   = mlb ? '' : 'none';
  $('#fbview').style.display = mlb ? 'none' : '';
  // [Sam, 2026-10-01] no stale bar on the page, in either league; the
  // headline ticker stays up in every league (it carries all three).
  if (mlb) show(TAB); else renderFootball();
  if (history.replaceState) history.replaceState(null, '', mlb ? '#' : '#' + lg);
}

document.querySelectorAll('.lgnav a[data-lg]').forEach(a =>
  a.addEventListener('click', () => setLeague(a.dataset.lg)));

document.querySelector('.subnav').addEventListener('click', e => {
  const a = e.target.closest('a[data-tab]'); if (!a) return;
  if (LEAGUE === 'mlb') show(a.dataset.tab); else { FBTAB = a.dataset.tab; renderFootball(); }
});
$('#dt').addEventListener('change', renderScores);
$('#filt').addEventListener('change', renderScores);

(async () => {
  const stSel = $('#st');
  const optz = a => a.map(x => `<option value="${x}">${x}</option>`).join('');
  stSel.innerHTML = '<option value="">Bet links: set state</option>' +
    `<optgroup label="Sportsbooks operate here">${optz(STATES_LIVE)}</optgroup>` +
    `<optgroup label="Other states">${optz(STATES_OTHER)}</optgroup>`;
  stSel.value = betState();
  stSel.addEventListener('change', e => {
    setBetState(e.target.value);
    const again = {odds: renderOdds, props: renderProps};
    if (again[TAB]) again[TAB]();
  });

  $('#dt').value = todayET();
  await Promise.all([loadBoard(), loadSplits()]);
  show('scores');

  /* Fill the ticker once, then refresh it with the news files every 10
     minutes. Failure is silent and the bar simply stays hidden -- a
     broken ticker must never take the rest of the page with it. */
  loadTicker().catch(() => {});
  setInterval(() => loadTicker().catch(() => {}), 600000);
  /* Keep the board honest without a reload.
     The scoreboard is cheap and refreshes often. The odds and props files
     are re-fetched less often -- the collector only rewrites them every
     half hour, so polling harder just burns bandwidth. Re-rendering the
     ACTIVE tab is what retires a game the moment its first pitch passes. */
  /* 🔴 A TIMER MUST NEVER MOVE THE PAGE UNDER SOMEONE'S HANDS.
     Every one of these intervals re-renders the open tab by replacing
     #view wholesale, which resets the scroll to the top. Sam, 2026-08-26:
     "when i am in certain tabs scrolling down a page every minute or so
     im sent back to the top of the page ... this is annoying as hell".
     He is right, and on a 3,000-row props board it makes the tab unusable.

     Two rules now hold for every timed re-render:
       1. NEVER while a box score is open -- ripping the page out from
          under a modal is worse than being one minute stale.
       2. The scroll position is restored afterwards, clamped to the new
          height in case the board got shorter (a game started and its
          rows retired). */
  /* 🔴 THIS MUST AWAIT. My first version called fn() and restored the
     scroll on the next animation frame -- but renderProps, renderPicks and
     renderParlays are ALL `async`: they await a fetch, so #view is still
     the OLD content when the frame fires. The restore landed against the
     old height and the real render then reset the page to the top a
     moment later. It looked fixed in a quick test because a warm cache
     resolves fast enough to win the race, and it kept failing for Sam on
     the two heaviest tabs, which is exactly where the awaits are.
     ⛔ Do not "simplify" this back to a synchronous call. */
  /* 🔴 AWAITING THE RENDER WAS NOT ENOUGH, AND HERE IS WHY IT KEPT
     HAPPENING. Two more causes, both worse than the first:

     1. NOTHING GUARDED RE-ENTRY. The 60-second and 180-second timers both
        fire at t=180, 360, 540... so two renders ran at once. One restored
        the scroll while the other was still replacing #view, and the
        position was lost. That is the "every minute or so, but worse
        sometimes" Sam kept seeing.

     2. IT RE-RENDERED WHETHER OR NOT ANYTHING HAD CHANGED. The 60-second
        timer exists to retire a game the moment its first pitch passes.
        It was rebuilding all 3,000 rows of the props board every minute
        to check. The right move is not to restore the scroll faster --
        it is NOT TO REBUILD THE PAGE when there is nothing new to show.

     So: one tick at a time, and only when the inputs actually moved. */
  let ticking = false, lastSig = '';

  function renderSig(){
    const nStartedIn = a => (a || []).filter(hasStarted).length;
    return [
      TAB, showStarted, PICKKIND,
      (BOARD && BOARD.pulled_at) || '', nStartedIn(BOARD && BOARD.games),
      (PROPS && PROPS.batter_odds_at) || '', nStartedIn(PROPS && PROPS.games),
      CARD_DATE || '',
      ((CARD && CARD.picks) || []).filter(p => p.commence && new Date(p.commence) <= new Date()).length,
    ].join('|');
  }

  async function tick(fn, force){
    if (ticking) return;                             // one at a time
    if (document.querySelector('.ovl')) return;      // modal open, leave it alone
    if (!force && renderSig() === lastSig) return;   // nothing moved
    ticking = true;
    try {
      const y = window.scrollY;
      await fn();                                    // <- the render, finished
      lastSig = renderSig();
      if (y > 0) {
        // Two frames: one for the DOM, one for layout to settle its height.
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo(0, Math.min(y, max));
      }
    } finally { ticking = false; }
  }
  window.__tickSig = renderSig;                      // for the headless test

  setInterval(() => { if (TAB === 'scores') tick(renderScores); }, 45000);

  /* ⏱️ THE SAME HEARTBEAT FOR FOOTBALL. `[2026-09-06]`
     🔴 Sam: "we have to make the scores live... for cfb and nfl."
     ⚠️ THE SAME 45s MLB USES, and the same guard: only while the Scores
     tab is actually open. ⛔ And it stops asking the moment the browser
     is refused (`FB_LIVE_OFF`), so a blocked feed costs ONE request for
     the whole session rather than one every 45 seconds forever. */
  setInterval(() => {
    if (LEAGUE === 'mlb' || FBTAB !== 'scores' || FB_LIVE_OFF) return;
    /* ⛔ THROUGH `fbTick`, NEVER `renderFootball` DIRECTLY. It holds the
       reader's scroll position and skips the redraw entirely when the
       feed has not moved. */
    fbTick();
  }, FB_LIVE_MS);

  /* ⛔ This used to throw away the props cache and re-render every three
     minutes unconditionally. The collector writes board.json hourly now,
     so that was 19 pointless full rebuilds an hour, each one a chance to
     lose the reader's place. It now checks whether the file it just
     fetched is actually new before touching anything. */
  /* 🔴 THE CHANGE SIGNAL IS THE BOARD *OR* THE FRESHNESS REPORT.
     Watching board.pulled_at alone was not enough: under converge a pass
     can rebuild the CARD without the board moving (the card's contract is
     90 min, gamelines' is 90 min, and they do not have to expire on the
     same pass). A reader with the Picks tab open would then sit on the
     old card until something unrelated happened to the odds.
     freshness.json is rewritten by EVERY converge pass, so its built_at
     is the one stamp that moves whenever anything at all moved. */
  let lastPulled = null, lastFresh = null;
  setInterval(async () => {
    if (document.querySelector('.ovl')) return;
    try { await loadBoard(); } catch(e){ return; }
    const pulled = (BOARD && BOARD.pulled_at) || '';
    const built  = (FRESH && FRESH.built_at) || '';
    if (lastPulled === null) { lastPulled = pulled; lastFresh = built; return; }
    if (pulled === lastPulled && built === lastFresh) return;   // nothing moved
    lastPulled = pulled; lastFresh = built;
    PROPS = null; PROJ = null; CARD = null;          // genuinely new data
    const again = {scores: renderScores, odds: renderOdds, trends: renderTrends,
                   props: renderProps, picks: renderPicks, parlays: renderParlays};
    if (again[TAB]) tick(again[TAB], true);
  }, 180000);

  /* Even with no new data, a game crossing its first pitch has to drop off.
     Cheap re-render of whichever board tab is open. */
  setInterval(() => {
    const boards = {odds: renderOdds, trends: renderTrends, props: renderProps,
                    picks: renderPicks, parlays: renderParlays};
    if (boards[TAB]) tick(boards[TAB]);
  }, 60000);
})();
</script>
