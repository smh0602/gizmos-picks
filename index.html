/* 🔴 PARLAYS. ⛔ THIS TAB DOES NOT BUILD PARLAYS, AND THAT IS THE POINT.
   MLB's parlays multiply MODEL probabilities to get a combined number and
   check it against Sam's price bands. Football has no model probability to
   multiply -- multiplying two RECORD rates would assert they are
   independent, which two players in the same game are not, and the result
   would be a Gizmo's number on a market row. ⚠️ It also needs a book that
   MULTIPLIES football props, and whether Hard Rock does is UNVERIFIED.
   ✅ So the tab shows the same board, says what is missing, and stops. */
/* ══════════════════════════════════════════════════════════════════
   SAME-GAME PARLAYS. Sam, 2026-09-11: *"this can include same game
   parlays with player props/game lines. up to the model to decide which
   bets are best"*

   🔴 IT IS ITS OWN TABLE BECAUSE IT HOLDS DIFFERENT NUMBERS, not for
   layout. A cross-game row publishes an "all hit" percentage and a $30
   EV; a same-game row publishes NEITHER, because multiplying two records
   from one game asserts the two are independent and they are not.
   ⛔ PUTTING THEM IN ONE TABLE WOULD MEAN EITHER AN EMPTY COLUMN THAT
   READS AS A MISSING NUMBER, OR A FILLED ONE THAT IS FALSE.

   ⚠️ "PAYS AT MOST" IS NOT A PRICE AND THE HEADER SAYS SO. A book prices
   a correlated slip BELOW the product of its legs, and that discount is
   in no pull this project stores — so the column is an upper bound,
   never quoted as what you will be paid.
   [Sam, 2026-10-01] no explanation boxes or tags on the page.

   ⚠️ "WEAKEST LEG" IS NOT A CHANCE THE PARLAY HITS. It is the lowest of
   the slip's own player records, each measured at that exact line. It is
   the ordering because there is no football model to rank with — four
   were tested and all four lost to a player's own season average. */
function fbSgpTable(title, rows){
  const pn = el('div','panel');
  const bookName = b => ({ hardrockbet: 'Hard Rock', hardrockbet_oh: 'Hard Rock',
    draftkings: 'DraftKings', fanduel: 'FanDuel',
    williamhill_us: 'Caesars', betmgm: 'BetMGM' }[b] || b);
  pn.innerHTML = `<h2>${title}</h2>
      <div style="overflow-x:auto"><table class="pairs">
      <thead><tr><th>Bet</th><th>Game</th><th class="n">Book</th>
        <th class="n">Pays at most</th><th class="n">Weakest leg</th></tr></thead>
      <tbody>${rows.map(x => `
        <tr>
          <td><b>${x.legs.join('</b> + <b>')}</b></td>
          <td class="rec">${x.game || ''}</td>
          <td class="n rec">${bookName(x.book)}</td>
          <td class="n">&le;&nbsp;${x.multiplier.toFixed(2)}x</td>
          <td class="n"><b>${x.weakest_leg}%</b></td>
        </tr>`).join('')}
      </tbody></table></div>`;
  return pn;
}

async function fbParlays(){
  const v = $('#fbview');
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  const C = await fbCardLoad();
  /* 🔴 ~~"No football parlays are built, and that is deliberate."~~
     STRUCK 2026-09-04. Both blockers are gone and neither went quietly.
       THE BOOKS QUESTION was settled by Sam at the sportsbook, not by us:
       "you can combine player props ill verify that for you right now.
       you can. there done."
       THE CORRELATION QUESTION was never policy, it was arithmetic, and
       MLB had already solved it: NO TWO LEGS IN THE SAME GAME ID.
     ⛔ WHAT HAS NOT CHANGED: there is still no football model, so every
     number here is the player's OWN RECORD and the combined figure is
     those records multiplied. [Sam, 2026-10-01] no explanation boxes or
     tags on the page. */
  const PL = (C && C.parlays) || {};
  const TITLES = {'2': 'Two-leg &mdash; pays 1.8x or more',
                  '3': 'Three-leg &mdash; pays 3x or more',
                  '4': 'Four-leg &mdash; pays 3x or more'};
  const head = `<div style="margin-bottom:10px">
      <h2 style="margin:0 0 4px;font-size:16px">Parlays${C && C.date ? ' &mdash; ' + fbDayName(C.date) : ''}</h2>
    </div>`;
  /* ⛔ THE TWO KINDS ARE COUNTED SEPARATELY, and that is not tidiness.
     `[caught 2026-09-11 by rendering the page]` the first form added the
     same-game count into `any`, so on a card with same-game parlays and
     NO cross-game ones the reader saw the same-game tables and no word
     about the others — and the sentence explaining WHY there are none
     (100 combinations outside Sam's bands, the rest in one game) simply
     never drew. ⚠️ An absent explanation reads as an absent feature. */
  let body = '', crossAny = 0;
  ['2','3','4'].forEach(size => {
    const rows = PL[size] || [];
    if (!rows.length) return;
    crossAny += rows.length;
    body += parlayTable(TITLES[size], rows).outerHTML;
  });
  /* 🔴 SAME-GAME PARLAYS, AFTER the cross-game ones and in their own
     tables. ⛔ They are read off `C.sgp`, a SEPARATE key — merging them
     into `C.parlays` would put two different row shapes under one name,
     and the shape difference is the whole point: these carry no joint
     probability and no EV. */
  let sgpBody = '';
  const SG = (C && C.sgp) || {};
  const SGT = {'2': 'Same game, two legs', '3': 'Same game, three legs'};
  ['2','3'].forEach(size => {
    const rows = SG[size] || [];
    if (!rows.length) return;
    sgpBody += fbSgpTable(SGT[size], rows).outerHTML;
  });
  const m = (C && C.parlay_meta) || {};
  // [Sam, 2026-10-01] no explanation boxes or tags on the page.
  /* ⛔ THREE DIFFERENT EMPTINESSES AND THEY MUST NOT SHARE A SENTENCE.
     NO CARD  — nothing has been published for this league yet.
     NO BOARD — a card exists and its day has no games. Correct, not broken.
     NO FIT   — a full board whose prices land in none of Sam's bands.
     Reading the third sentence under the first two is how a working
     product reads as a failing one. */
  /* 🔴 A FOURTH EMPTINESS, AND IT WOULD HAVE SHIPPED A FALSE SENTENCE ON
     NFL OPENING NIGHT. `[found 2026-09-06 by building the NFL card against
     a rehearsal board]` The 2026 NFL season opens with a SINGLE GAME on
     2026-09-09. A parlay's legs must be in DIFFERENT games, so on a
     one-game slate every candidate is rejected by construction —
     `rejected.same_game` was 12,926 and `out_of_band` was ZERO — and the
     reader was about to be told *"it is the payout bands that nothing
     fits today"*, which is a cause the data flatly contradicts (rule
     132). ⛔ THE REASON IS NOW DERIVED FROM `parlay_meta.rejected` AND THE
     GAMES ACTUALLY ON THE CARD, never assumed. */
  const nGames = new Set((C && C.picks || [])
      .map(p => p.game_id).filter(x => x != null)).size;
  const rj = m.rejected || {};
  const outBand = Number(rj.out_of_band || 0);
  const sameGame = Number(rj.same_game || 0);
  const emptyMsg = !C
    ? fbNoCard('parlays', 'msg')
    : (!(C.picks || []).length && C.empty_reason)
      ? `<div class="msg">No parlays across games for ${fbDayName(C.date)} &mdash; there is
         no board to build them from.</div>`
    : nGames < 2
      ? `<div class="msg">No parlays across games for ${fbDayName(C.date)} &mdash; this card's slate is ${
          nGames === 1 ? 'a single game' : 'empty'} and every leg must come from a different game${
          sameGame ? ` (${sameGame.toLocaleString()} combinations shared a game)` : ''}.</div>`
    : (outBand === 0 && sameGame > 0)
      ? `<div class="msg">No parlays across games on this card &mdash; ${sameGame.toLocaleString()}
         combinations had two legs in the same game${Number(rj.mixed_book || 0)
           ? ` and ${Number(rj.mixed_book).toLocaleString()} needed two sportsbooks` : ''}.</div>`
      : `<div class="msg">No parlay on this card lands inside the payout bands.</div>`;
  // [Sam, 2026-10-01] each emptiness is one plain line with its computed cause; no box, no tag.
  /* ⛔ THE CROSS-GAME EXPLANATION DRAWS EVEN WHEN SAME-GAME PARLAYS DO.
     The two answer different questions and a reader who sees only one
     kind is owed the reason the other is missing. ⚠️ The "no card" and
     "no board" states are about the WHOLE tab, so on those nothing else
     renders at all. */
  const noBoard = !C || (!(C.picks || []).length && C.empty_reason);
  v.innerHTML = fbShell(head
      + (noBoard ? emptyMsg
                 : (crossAny ? body : emptyMsg) + sgpBody));
  fbWire();
}

/* 🔴 TRACK RECORD. The empty state is CORRECT and stays until football
   picks have been published AND graded. ⛔ An empty record table is not a
   defect; a record table with nothing in it that implies a result is. */
/* 🔴 THE FOOTBALL RECORD LOADER. One file per league, written by
   `record_fb.py`. ⛔ It may not exist -- before the first graded card
   there is nothing to write, and that is not an error. */
const FBREC = {};
async function fbRecordLoad(){
  if (FBREC[LEAGUE] !== undefined) return FBREC[LEAGUE];
  try { FBREC[LEAGUE] = await jget(`${LG_DATA[LEAGUE]}/latest/record.json`); }
  catch(e){ FBREC[LEAGUE] = null; }
  return FBREC[LEAGUE];
}

/* 🔴🔴 THE PER-ROW DETAIL, KEYED BY LEAGUE. ⛔ MLB's `loadRecordDetail()`
   caches in ONE module-level `RECDETAIL` and hard-codes `data/latest/`.
   Copied verbatim that shape serves NFL's picks under the college tab the
   moment you switch leagues — SILENTLY, AND LOOKING CORRECT, which is the
   worst kind of wrong this page can be.
   ⚠️ THE PATH COMES FROM `record.json`'s own `detail_file` where it
   exists. `record_fb.py` already computes it, and a second copy of a path
   is a second thing to drift (rule 132). The literal is the fallback for
   a record written before that field existed.
   ⛔ A FAILURE IS NOT CACHED. The assignment only happens on success, so a
   file that appears later is picked up rather than remembered as absent. */
const FBDETAIL = {};
async function fbDetailLoad(lg, rec){
  /* ⚠️ THE KEY IS NAMED because it is the thing that must not be shared.
     `const key = 'one'` here IS the MLB defect, and it is the mutation
     `test_fb_record.py` declares against this function. */
  const key = lg;
  if (FBDETAIL[key] !== undefined) return FBDETAIL[key];
  const path = (rec && rec.detail_file) || `${LG_DATA[lg]}/latest/record-detail.json.gz`;
  FBDETAIL[key] = await jgetGz(path);
  return FBDETAIL[key];
}

/* One card's rows, opened under its day. ⚠️ Published order, not losers
   first — the board was published in confidence order, so that is the
   order it is reviewed in. */
function fbDayDetailHtml(rows){
  if (!rows || !rows.length)
    return '<div class="msg">No rows stored for that card.</div>';
  const body = rows.map(r => {
    const res = r.won == null ? ['v', 'UNSETTLED'] : r.won ? ['w', 'HIT'] : ['l', 'MISS'];
    /* ⚠️ THE DENOMINATOR THE ROW WAS RATED ON, carried onto the graded row
       by `record_fb.py` — `hits of n_games` in `logs_season`. It is what
       the CONF number means on a RECORD board, and printing the number
       without it invites it to be read as a model output. */
    const rec = (r.hits != null && r.n_games)
      ? `${r.hits} of ${r.n_games}${r.logs_season ? ' · ' + r.logs_season : ''}` : '';
    return `<tr>
      <td><b>${r.player}</b> <span class="rec">${r.game || ''}</span></td>
      <td>${r.side === 'over' ? 'Over' : 'Under'} ${r.line} ${r.market_label || r.market}</td>
      <td class="n">${r.confidence != null ? r.confidence + '%' : '&mdash;'}${
        rec ? `<br><span class="rec" style="font-size:10px">${rec}</span>` : ''}</td>
      <td class="n">${r.price != null ? sgn(r.price) : '&mdash;'}</td>
      <td class="n">${r.actual == null ? '&mdash;' : r.actual}</td>
      <td><span class="res ${res[0]}">${res[1]}</span></td></tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table class="ddtab">
      <thead><tr><th>Player</th><th>Pick</th><th class="n">Conf</th>
        <th class="n">Price</th><th class="n">Actual</th><th>Result</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

/* 🔴 THE SAME BANDS MLB DRAWS, THROUGH THE SAME `bandRow()`. Sam saw the
   bare table and the bars side by side on 2026-09-16 and asked for MLB's
   exactly: a bar, a marker for the claimed rate, the gap in points and a
   one-word verdict.
   🔴🔴 `stated`, NOT `predicted`, AND THE MAPPING HAPPENS HERE. MLB calls
   `bandRow` with `said` taken from its OWN `predicted` key; football's
   `record.json` names
   that figure `stated`. ⛔ Copied verbatim it publishes bars claiming 0% —
   the identical mismatch `card_fb.py` was bitten by on 2026-09-16, one
   file over.
   ⛔ AND `bandRow` ITSELF IS NOT TOUCHED. It is shared and MLB depends on
   it; teaching it about `stated` would be editing MLB through the back
   door, which the freeze forbids as surely as editing the card.
   ⚠️ `hit: null` ON AN EMPTY BUCKET, never 0. `bandRow` draws "No sample"
   for null and a bar sitting at zero for 0 — a bucket nobody bet is not a
   bucket that lost. */
function fbCalBlock(cal, label){
  /* ⚠️ A LABELLED METHOD WITH NOTHING GRADED SAYS SO. Unlabelled, an empty
     list still draws nothing — that is the old call shape. */
  const head = `<h3 style="margin:18px 0 8px;font-size:14px">Was the record right?${
    label ? ` <span class="sub" style="font-weight:400">&mdash; ${label}</span>` : ''}</h3>`;
  if (!cal || !cal.length)
    return label ? `${head}<div class="fb-cal-empty" style="margin:0 0 8px;font-size:12.5px;color:var(--mut)">No graded
      picks under the ${label} yet.</div>` : '';
  /* ⚠️ FOOTBALL PASSES ITS OWN WORDING. The figure is the mean of the
     players' own records at those lines, so nobody "said" it. */
  const band = c => bandRow({ name: c.bucket, n: c.n, said: c.stated, hit: c.n ? c.pct : null }, 'the record claimed');
  return `${head}
    ${cal.map(band).join('')}
    <div class="legend">
      <span><i style="background:var(--accent2)"></i>Beat the claim</span>
      <span><i style="background:#d9534f"></i>Fell short of it</span>
      <span><i style="background:#14181f;width:3px;border-radius:0"></i>What the record claimed</span>
    </div>`;
}

/* 🔴🔴 ONE LABELLED TABLE PER CARD METHOD, NEVER POOLED. `[Sam, 2026-09-24]`
   `record.json` keeps each method's buckets apart in
   `calibration_by_method`; `calibration` alone is only the CURRENT
   method's, and the day the new method went live it was EMPTY — so the tab
   drew no football bands at all while every graded row sat beside it.
   ✅ The current method is drawn first and ALWAYS, saying so when nothing
   under it is graded yet; every other method follows under its own name.
   ⛔ An older record with no `calibration_by_method` is read as the one
   method it names — never guessed into two. */
const FB_METHOD_BEFORE = '2025-only';
function fbCalMethods(R){
  if (!R) return '';
  const cur = R.card_method_current || FB_METHOD_BEFORE;
  const by = R.calibration_by_method || { [cur]: R.calibration || [] };
  const label = m => m === cur ? 'current method'
    : (m === FB_METHOD_BEFORE ? '2025-only method' : `earlier method (${m})`);
  const order = [cur, ...Object.keys(by).filter(m => m !== cur)];
  return order.map(m => fbCalBlock(by[m] || [], label(m))).join('');
}

/* 🔴 EVERY GRADED DAY IS CLICKABLE, the same as MLB's. Sam, 2026-08-26:
   he wants to open a date and see which props hit and which missed.
   ⛔ A DAY WITH NOTHING GRADED IS NOT CLICKABLE — there is nothing behind
   it, and a caret that opens an empty box reads as a broken page rather
   than as an honest empty state. */
function fbDayRows(days, rec){
  if (!days || !days.length)
    return `<tr><td colspan="5" class="sub" style="text-align:center;padding:14px">
         ${(rec && rec.record_from)
           ? `Nothing graded since ${rec.record_from}.`
           : 'No football day has been graded yet.'}</td></tr>`;
  return days.slice().reverse().map(d => {
    const open = d.n > 0;
    return `<tr class="${open ? 'dayrow' : ''}"${open ? ` data-date="${d.date}"` : ''}${
        open ? ' title="Click to see every row from this card"' : ''}>
      <td>${d.date}${open ? ' <span class="caret">&#9656;</span>' : ''}</td>
      <td class="n">${d.n ? `${d.w}/${d.n}` : '&mdash;'}</td>
      <td class="n">${d.n ? `${(100*d.w/d.n).toFixed(1)}%` : '&mdash;'}</td>
      <td class="n sub">${d.carded}</td>
      <td class="n sub">${(d.voids || 0) + (d.unresolved || 0)}</td></tr>`
      + (open ? `<tr class="daydetail" id="fbdd-${d.date}" hidden><td colspan="5"></td></tr>` : '');
  }).join('');
}

/* ⚠️ SCOPED TO `#fbview`. MLB wires `document.querySelectorAll('tr.dayrow')`
   unscoped; a second unscoped sweep would double-bind whichever tab drew
   last. ⛔ The detail file is fetched ONCE per league and cached — inlining
   it would push the record file past the size where a tab that only needs
   totals to draw has to download every row of the season. */
function fbWireDayRows(lg, rec){
  document.querySelectorAll('#fbview tr.dayrow').forEach(tr => {
    tr.addEventListener('click', async () => {
      const date = tr.dataset.date;
      const box = document.querySelector('#fbdd-' + date);
      if (!box) return;
      if (!box.hidden){ box.hidden = true; tr.classList.remove('open'); return; }
      tr.classList.add('open');
      box.hidden = false;
      const cell = box.querySelector('td');
      if (cell.dataset.loaded) return;
      cell.innerHTML = '<div class="msg">Loading&hellip;</div>';
      try {
        const D = await fbDetailLoad(lg, rec);
        cell.innerHTML = fbDayDetailHtml(((D || {}).days || {})[date]);
        cell.dataset.loaded = '1';
      } catch(e){
        /* ⛔ DEGRADES TO ONE PLAIN LINE, NEVER A BROKEN TAB. Before the
           first graded card there is no detail file and that is not an
           error. */
        cell.innerHTML = '<p class="plain">No detail file yet.</p>';
      }
    });
  });
}

const fbPct = t => (t && t.n) ? `${t.pct.toFixed(1)}%` : '&mdash;';
const fbWL  = t => (t && t.n) ? `${t.w}/${t.n}` : '0/0';

async function fbRecord(){
  const v = $('#fbview');
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  const [C, R, W] = await Promise.all([fbCardLoad(), fbRecordLoad(), winnersLoad(LEAGUE)]);
  const n = C && C.picks ? C.picks.length : 0;
  const O = (R && R.overall) || null;
  const graded = O && O.n;

  /* 🔴 THE SAME FOUR STAT BOXES MLB SHOWS, and the same two tables --
     drawn EMPTY rather than replaced by a paragraph. Sam, 2026-09-03:
     "i literallt want eveyrhtug to look exaclty the same the only
     difference is that its filled with nfl data".
     ⚠️ Every figure reads em-dash, never 0% -- "nothing graded" and
     "graded 0%" are different facts, and that distinction is the reason
     this tab could sit empty for two days without lying. */
  const hero = `<div class="tr-hero">
      <div class="tr-box"><div class="k">Board</div>
        <div class="v">${graded ? O.pct.toFixed(1) + '%' : '&mdash;'}<span
          style="font-size:18px;color:var(--mut)">${graded ? '' : '/0'}</span></div>
        <div class="s">${graded ? `${O.w} of ${O.n} graded`
                                : 'nothing graded yet'}</div></div>
      <div class="tr-box"><div class="k">${LEAGUE === 'nfl' ? 'NFL rows' : 'College rows'}</div>
        <div class="v">${graded ? O.w : '&mdash;'}</div>
        <div class="s">${fbWL(O)}</div></div>
      <div class="tr-box"><div class="k">On the board today</div>
        <div class="v">${n}</div><div class="s">${n ? 'gradeable after kickoff' : 'no card yet'}</div></div>
      <div class="tr-box"><div class="k">Cards graded</div>
        <div class="v">${R ? (R.days_graded || 0) : 0}</div>
        <div class="s">football only</div></div>
    </div>`;

  /* ⚠️ THE MARKET LIST COMES FROM THE RECORD WHEN THERE IS ONE, and from
     a fixed list only when there is not. ⛔ A hardcoded list would hide a
     market the board started carrying, which is exactly how a table goes
     quietly wrong. */
  const NAMES = {player_pass_yds:'Passing yards', player_pass_tds:'Passing TDs',
                 player_rush_yds:'Rushing yards', player_reception_yds:'Receiving yards',
                 player_receptions:'Receptions', player_anytime_td:'Anytime TD'};
  const MKfallback = LEAGUE === 'nfl'
    ? ['player_pass_yds','player_pass_tds','player_rush_yds',
       'player_reception_yds','player_receptions','player_anytime_td']
    : ['player_pass_yds','player_rush_yds','player_reception_yds',
       'player_receptions','player_anytime_td'];
  const BM = (R && R.by_market) || {};
  const mkKeys = Object.keys(BM).length ? Object.keys(BM).sort() : MKfallback;
  const mkRows = mkKeys.map(k => {
    const t = BM[k];
    return `<tr><td>${NAMES[k] || k}</td>
      <td class="n">${t ? fbWL(t) : '&mdash;'}</td>
      <td class="n">${t ? fbPct(t) : '&mdash;'}</td></tr>`;
  }).join('');

  const days = (R && R.by_day) || [];
  const dayRows = fbDayRows(days, R);

  /* 🔴 CALIBRATION, AND THE WORD "MODEL" APPEARS NOWHERE IN IT. The
     bucket is the player's OWN RECORD at that line -- ledger rule 55.
     ~~a bare table headed Stated / Said / Actual / Rows / Gap~~ —
     **REPLACED 2026-09-16**: the same data now renders through MLB's own
     `bandRow()`, which Sam asked for after seeing both side by side, and
     nothing here says "predicted". [Sam, 2026-10-01] no explanation boxes
     or tags on the page. */
  const calBlock = fbCalMethods(R);

  // [Sam, 2026-10-01] no reset note, intro or footnotes on the page; record.json keeps their fields.
  v.innerHTML = fbShell(`<h2>${LG_NAME[LEAGUE]} record</h2>
    ${R ? `<p><span class="rec">graded ${freshness(R.built_at)}</span></p>` : ''}
    ${hero}
    ${winnersRecordLine(W)}
    <table class="ob" style="margin-top:14px">
      <thead><tr><th>Market</th><th class="n">Record</th><th class="n">Hit&nbsp;rate</th></tr></thead>
      <tbody>${mkRows}</tbody></table>
    ${calBlock}
    <h3 style="margin:18px 0 8px;font-size:14px">By day</h3>
    <table class="ob">
      <thead><tr><th>Date</th><th class="n">Record</th><th class="n">Hit&nbsp;rate</th>
        <th class="n">Carded</th><th class="n">Unsettled</th></tr></thead>
      <tbody>${dayRows}</tbody></table>`);
  /* ⚠️ WIRED AFTER THE MARKUP IS IN THE DOM, not before — the rows do
     not exist until `fbShell` has been assigned above. */
  fbWireDayRows(LEAGUE, R);
  // [Sam, 2026-10-01] no explanation boxes or tags on the page.
  fbWire();
}


/* ══════════════════════════════════════════════════════════════════
   FOOTBALL TEAM LOGOS — the MLB `mark()` treatment, for football.

   Sam, 2026-09-03: *"including team logos in the scores and matchups
   page, team logos for odds, same for trends tab ... basically the same
   exact layout for all tabs that the mlb ones have"*.

   🔴 SAME FALLBACK CONTRACT AS `mark()`: if the image 404s it is replaced
   with the text abbreviation, so a bad logo URL is cosmetic and can never
   leave a hole in a table. ⛔ Do not "simplify" that away.
   ⚠️ The directory is keyed by BOTH full name and abbreviation, because
   the odds board says "Seattle Seahawks" and the schedule says "SEA" --
   one lookup has to serve both tabs or they drift apart.
   ══════════════════════════════════════════════════════════════════ */
const FBTEAMS = {};

/* 🔴 THE NFL DIRECTORY IS EMBEDDED, NOT FETCHED, AND THAT IS THE FIX FOR
   A REAL BUG I SHIPPED. The first version fetched `teams.json` for both
   leagues -- but nothing ever GENERATED those files, so every request
   404'd, every lookup missed and every logo fell back to text. Sam saw a
   page with no logos on it.
   ⛔ THE PROJECT'S OWN RULE: a fix is not done until the artifact exists.
   A renderer that depends on a file nobody creates is not a feature.
   ✅ The NFL is 32 teams whose abbreviations do not change, so embedding
   removes the dependency entirely -- it cannot 404, and it needs no
   collector run to start working.
   ⚠️ COLLEGE IS DIFFERENT and still fetched: 138 schools, realignment
   every year, and CFBD ships the real logo URLs. Guessing 138 URLs would
   be worse than fetching them. */
const NFL_LOGOS = {
  ARI:'Arizona Cardinals', ATL:'Atlanta Falcons', BAL:'Baltimore Ravens',
  BUF:'Buffalo Bills', CAR:'Carolina Panthers', CHI:'Chicago Bears',
  CIN:'Cincinnati Bengals', CLE:'Cleveland Browns', DAL:'Dallas Cowboys',
  DEN:'Denver Broncos', DET:'Detroit Lions', GB:'Green Bay Packers',
  HOU:'Houston Texans', IND:'Indianapolis Colts', JAX:'Jacksonville Jaguars',
  KC:'Kansas City Chiefs', LV:'Las Vegas Raiders', LAC:'Los Angeles Chargers',
  LA:'Los Angeles Rams', MIA:'Miami Dolphins', MIN:'Minnesota Vikings',
  NE:'New England Patriots', NO:'New Orleans Saints', NYG:'New York Giants',
  NYJ:'New York Jets', PHI:'Philadelphia Eagles', PIT:'Pittsburgh Steelers',
  SF:'San Francisco 49ers', SEA:'Seattle Seahawks', TB:'Tampa Bay Buccaneers',
  TEN:'Tennessee Titans', WAS:'Washington Commanders'
};
function nflDirectory(){
  const d = {};
  Object.entries(NFL_LOGOS).forEach(([ab_, full]) => {
    const lo = ab_.toLowerCase();
    const e = {abbr: ab_, name: full,
               logo: `https://a.espncdn.com/i/teamlogos/nfl/500/${lo}.png`,
               // ⚠️ ESPN serves the same marks under a second path. If the
               // first 404s the image retries here before falling back to
               // text -- see fbMark.
               logo_alt: `https://a.espncdn.com/i/teamlogos/nfl/500-dark/${lo}.png`};
    d[ab_] = e; d[full] = e;      // schedule says "SEA", the board says the full name
  });
  return d;
}

async function fbTeamsLoad(){
  if (FBTEAMS[LEAGUE] !== undefined) return FBTEAMS[LEAGUE];
  if (LEAGUE === 'nfl'){ FBTEAMS[LEAGUE] = nflDirectory(); return FBTEAMS[LEAGUE]; }
  try {
    const d = await jget(`${LG_DATA[LEAGUE]}/latest/teams.json`);
    FBTEAMS[LEAGUE] = d.teams || {};
  } catch(e){ FBTEAMS[LEAGUE] = {}; }
  return FBTEAMS[LEAGUE];
}


/* ══════════════════════════════════════════════════════════════════
   RESOLVE AN ODDS-BOARD TEAM NAME TO OUR TEAM DIRECTORY.

   🔴 WHY THIS EXISTS. `teams.json` is keyed by CFBD's SCHOOL name
   ("Akron", "App State"); the odds board carries the sportsbook's name
   WITH THE MASCOT ("Akron Zips", "Appalachian State Mountaineers").
   ⛔ MEASURED 2026-09-03 ON THE LIVE BOARD: a direct dictionary lookup
   hit **0 of 322** team names. That is exactly why college logos showed
   on Scores and Trends -- which use SCHEDULE names and match exactly --
   and were missing on Odds.

   ✅ This is the same rule `_match_team` uses in the collector, ported:
   exact hit first, then longest-candidate-first prefix walk, with the
   guards that stop a prefix eating a different school.
   ⚠️ Memoised, because Odds re-resolves the same names on every render.
   ══════════════════════════════════════════════════════════════════ */
const FB_TNORM = {};   // league -> {normalisedSchoolName: entry}
const FB_TCACHE = {};  // league -> {feedName: entry|null}

function fbNorm(x){
  return String(x || '')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')   // fold accents
    .toLowerCase().replace(/[^a-z0-9]/g, '');
}

/* ⛔ A WORD THAT CONTINUES A SCHOOL NAME. If the leftover after our
   name starts with one of these, the feed is naming a DIFFERENT school:
   "Washington" + "State Cougars" is not Washington. */
const FB_CONTINUES = new Set(['state','am','tech','southern','northern',
  'eastern','western','central','international','atlantic','christian',
  'poly','dominion','carolina','illinois','michigan','florida','texas',
  'kentucky','methodist','chicago','st','saint','a']);

/* ⛔ CFBD AND THE ODDS FEED DISAGREE ON THREE SCHOOL NAMES, and the
   difference is not a mascot so prefix matching cannot bridge it. The
   SAME three the collector pins in FEED_ALIASES -- derived by listing
   every unmatched name on a real board and checking each against the
   schedule's own classification. ⚠️ Keep this in step with collect.py;
   two copies of a fact is two things to drift. */
const FB_ALIASES = {
  appalachianstate: 'App State',
  southernmississippi: 'Southern Miss',
  samhoustonstate: 'Sam Houston',
  // CFBD says "Massachusetts"; the odds feed says "UMass Minutemen".
  umass: 'Massachusetts'
};

function fbResolve(name){
  if (!name) return null;
  const lg = LEAGUE;
  FB_TCACHE[lg] = FB_TCACHE[lg] || {};
  if (name in FB_TCACHE[lg]) return FB_TCACHE[lg][name];
  const dir = FBTEAMS[lg] || {};
  let idx = FB_TNORM[lg];
  if (!idx){
    idx = FB_TNORM[lg] = {};
    Object.keys(dir).forEach(k => { idx[fbNorm(k)] = dir[k]; });
  }
  const n = fbNorm(name);
  let hit = idx[n] || null;
  if (!hit){
    // a known feed disagreement, checked BEFORE the prefix walk so an
    // alias can never be beaten by a coincidental prefix
    for (const k in FB_ALIASES){
      if (n === k || n.indexOf(k) === 0){
        const e = idx[fbNorm(FB_ALIASES[k])];
        if (e){ hit = e; break; }
      }
    }
  }
  if (!hit){
    const words = String(name).split(/\s+/).filter(Boolean);
    // longest candidate first, so "Ohio State" is tried before "Ohio"
    const cands = Object.keys(idx).sort((a, b) => b.length - a.length);
    for (const cand of cands){
      let acc = '', taken = 0;
      for (let i = 0; i < words.length; i++){
        acc += fbNorm(words[i]); taken = i + 1;
        if (acc === cand) break;
        if (acc.length > cand.length){ taken = 0; break; }
      }
      if (!taken || acc !== cand) continue;
      const rest = words.slice(taken);
      if (!rest.length){ hit = idx[cand]; break; }
      // ⛔ 3+ leftover words is a different school, not a mascot.
      if (rest.length > 2) continue;
      // ⛔ a mascot never carries an ampersand; a school qualifier does.
      if (rest.some(w => w.indexOf('&') > -1)) continue;
      if (FB_CONTINUES.has(fbNorm(rest[0]))) continue;
      hit = idx[cand]; break;
    }
  }
  FB_TCACHE[lg][name] = hit;
  return hit;
}

/* A short label for a football team. ⛔ NOT `ab()` -- that renders
   mascots, so "Wake Forest Demon Deacons" became "DEA". */
/* ══════════════════════════════════════════════════════════════════
   THE CONFERENCE FILTER — COLLEGE ONLY, MULTI-SELECT.
   Sam, 2026-09-04: a conference filter, CFB only, multi-select, across
   Scores, Trends, Player Props, Gizmo's Picks and Odds.

   🔴 IT RESOLVES NAMES THROUGH `fbResolve`, THE SAME FUNCTION THE LOGOS
   USE, AND NEVER ITS OWN MATCHER. `teams.json` is keyed by CFBD's school
   name ("Akron"); the odds board carries the sportsbook's name with the
   mascot ("Akron Zips"). ⛔ A direct lookup hit **0 of 322** on the live
   board — that is exactly why the logos needed a resolver, and a second
   matcher here would reproduce the bug in a new place (rule 66).

   ⚠️ EMPTY MEANS ALL. A filter that starts with nothing selected and
   therefore shows nothing reads as a broken page, and the user has no way
   to know they did it to themselves.

   ⛔ A ROW SURVIVES IF **EITHER** SIDE IS IN A SELECTED CONFERENCE. A
   game is between two teams; asking for the SEC should show SEC teams
   playing anybody, which is what a person means by "filter to the SEC".
   ══════════════════════════════════════════════════════════════════ */
let fbConf = new Set();

function fbConfOf(name){
  const e = fbResolve(name);
  return (e && e.conference) || null;
}

/* Every conference present in the directory, alphabetical. ⚠️ ASKED, NOT
   HARDCODED — realignment moves schools every August and a typed list
   would go stale in a way nobody notices until a tab is empty. */
function fbConfList(){
  const dir = FBTEAMS[LEAGUE] || {};
  const seen = new Set();
  Object.keys(dir).forEach(k => {
    const c = dir[k] && dir[k].conference;
    if (c) seen.add(c);
  });
  return [...seen].sort();
}

/* ⛔ ONE SELECTION PREDICATE, USED BY BOTH SHAPES OF ROW. Trends rows are
   a single team; every other tab's row is a game. ⚠️ Writing a second
   matcher for the team case is how the two would drift apart -- so the
   game case is DEFINED as "either side passes the team test", and there
   is exactly one place a conference is compared. */
function fbConfTeamPass(name){
  if (LEAGUE !== 'ncaaf' || !fbConf.size) return true;
  const c = fbConfOf(name);
  return !!(c && fbConf.has(c));
}

/* ⛔ TRUE when the row should be SHOWN. Nothing selected -> everything. */
function fbConfPass(away, home){
  if (LEAGUE !== 'ncaaf' || !fbConf.size) return true;
  return fbConfTeamPass(away) || fbConfTeamPass(home);
}

/* The chip row. ⚠️ Chips rather than a <select multiple>: a multi-select
   on a phone is a system dialog most people cannot work out, and this has
   to be usable on the device Sam actually checks the site on. */
function fbConfBar(){
  if (LEAGUE !== 'ncaaf') return '';
  const list = fbConfList();
  if (!list.length) return '';
  return `<div class="confbar" style="display:flex;flex-wrap:wrap;gap:6px;
            align-items:center;margin:0 0 10px">
      <span style="font-size:11px;opacity:.6;margin-right:2px">Conference</span>
      <a href="#" data-conf="*" class="cchip${fbConf.size ? '' : ' on'}">All</a>
      ${list.map(c => `<a href="#" data-conf="${c.replace(/"/g,'&quot;')}"
          class="cchip${fbConf.has(c) ? ' on' : ''}">${c}</a>`).join('')}
    </div>`;
}

/* ⛔ WIRED ONCE, BY THE SAME `fbWire` EVERY TAB ALREADY CALLS. A tab that
   renders the bar and forgets to wire it is a filter that silently does
   nothing — the failure mode this project keeps meeting. */
function fbConfWire(rerender){
  document.querySelectorAll('#fbview .cchip').forEach(a => {
    a.addEventListener('click', ev => {
      ev.preventDefault();
      const c = a.dataset.conf;
      if (c === '*') fbConf.clear();
      else if (fbConf.has(c)) fbConf.delete(c);
      else fbConf.add(c);
      /* ⚠️ THROUGH THE SCROLL KEEPER. A conference chip rebuilds the whole
         view, and being thrown to the top after every click is what made
         the filter unpleasant to use. */
      fbKeepScroll(rerender);
    });
  });
}

function fbAb(name){
  const t = fbResolve(name);
  if (t && t.abbr) return t.abbr;
  const w = String(name || '').trim().split(/\s+/);
  return (w[0] || '').slice(0, 4).toUpperCase();
}

/* 🔴 TRY A SECOND URL BEFORE GIVING UP. I cannot verify from this
   sandbox that a logo URL resolves -- outbound image requests are
   blocked here, MLB's own logos included -- so a single guessed pattern
   that turns out wrong means a page with no logos on it, which is
   exactly what shipped. ⛔ Chaining a fallback makes a wrong guess
   self-correct instead of going blank.
   ⚠️ The final fallback is still the abbreviation, so the worst case is
   the same as having no logo -- never a broken image icon. */
function fbMark(name, size){
  const t = fbResolve(name);
  const s = size || 22;
  const a = fbAb(name);
  if (!(t && t.logo)) return `<span class="lg-fb">${a}</span>`;
  /* ⚠️ The retry URL and the text fallback travel on DATA ATTRIBUTES and
     the handler is a NAMED FUNCTION. ⛔ Building the handler by nesting
     template literals produced invalid JavaScript and took every football
     tab down -- caught by driving the page, not by reading the diff. */
  return `<img class="lg" style="width:${s}px;height:${s}px;object-fit:contain"
       src="${t.logo}" alt="${a}" loading="lazy"
       data-alt="${t.logo_alt || ''}" data-ab="${a}"
       onerror="fbLogoFail(this)">`;
}

/* 🔴 TRY A SECOND URL BEFORE GIVING UP, THEN FALL BACK TO TEXT.
   I cannot verify from this sandbox that a logo URL resolves -- outbound
   image requests are blocked here, MLB's own logos included -- so a
   single guessed pattern that turns out wrong means a page with no logos
   on it, which is exactly what shipped. Chaining makes a wrong guess
   self-correct; the worst case is still just the abbreviation, never a
   broken-image icon. */
function fbLogoFail(img){
  const alt = img.dataset.alt;
  if (alt && !img.dataset.tried){ img.dataset.tried = '1'; img.src = alt; return; }
  const sp = document.createElement('span');
  sp.className = 'lg-fb';
  sp.textContent = img.dataset.ab || '';
  img.replaceWith(sp);
}


/* ⛔ ~~function fbTeam(name, size){ ... }~~ DELETED 2026-09-14, the second
   renderer nobody called (rule 130). One token reference in the whole
   file: its own definition. ✅ Every football row builds its name and
