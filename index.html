   and on how many games, and the ranking itself waits for Sam to say
   which cut he wants. ➡️ Flagged, not guessed. */
function fbDosFacts(s){
  const f = [];
  const li = (k, v) => f.push(`<li>${k} <b>${v}</b></li>`);
  const num = v => v == null ? null : v;
  if (s.n === 9 && s.teams){
    /* 🔴 SIGNAL 9, DESCRIPTIVE `[Sam, 2026-09-24]`: what left each team. */
    for (const [t, e] of Object.entries(s.teams)){
      if (e.returning_usage){
        const r = e.returning_usage;
        li(`${t} returning`, `${r.receivingUsage ?? '—'}% receiving · ${r.rushingUsage ?? '—'}% rushing`);
        continue;
      }
      const g = c => (e[c] && e[c].share != null) ? `${e[c].share}%` : '—';
      li(`${t} vacated`, `targets ${g('tgt')} · air yards ${g('ay')} · carries ${g('car')}${
        e.i10 ? ` · inside-10 ${g('i10')}` : ''}`);
      if (e.off_roster_targets != null) li(`${t} targets gone from the roster`, `${e.off_roster_targets}%`);
      if (e.arrivals_changed_teams != null) li(`${t} arrivals from other teams`, e.arrivals_changed_teams);
      /* [2026-10-01] the departures lived only in the section's prose. */
      const gone = (e.departed || []).map(d => d && d.player).filter(Boolean);
      if (gone.length) li(`${t} departed`, gone.join(', '));
    }
    return f.length ? `<ul class="dosf">${f.join('')}</ul>` : '';
  }
  if (s.n === 1){
    /* ⚠️ THE BOARD'S OWN FIGURES AS THE DOSSIER STORED THEM — a
       point-in-time reading, which is the whole nature of this artifact.
       ⛔ Nothing here is recomputed; if these differ from the row above
       it is because the board moved after the card was built, and that
       is a fact worth seeing rather than one worth hiding. */
    const L = s.live || {};
    if (L.total != null) li('Total', L.total);
    if (L.run_line != null)
      li('Spread', `${L.run_line > 0 ? '+' : ''}${L.run_line}`
         + (L.run_line_team ? ` ${L.run_line_team}` : ''));
    /* ══════════════════════════════════════════════════════════════
       🔴🔴 ~~`li('Books priced', L.n_books)`~~ — THAT LABEL PUT "Books
       priced 0" DIRECTLY BESIDE A TOTAL OF 67.5 THAT HARD ROCK WAS
       SHOWING. `[found in review of the panel, 2026-09-17]`
       ⛔ `n_books` IS `len(vigs)` IN `collect.py` AND `vigs` COMES FROM
       THE MONEYLINE DE-VIG, so it counts books showing a two-sided
       MONEYLINE — not books pricing the game. MEASURED on the live
       college board: 15 of 90 games have an empty `best_ml` AND
       `n_books == 0`, the same 15, and all 15 still carry a total and a
       spread. The data was right; the word was wrong.
       ⚠️ THE ROW ABOVE ALREADY KNEW THIS — `fbOddsTable` has carried a
       comment saying `n_books` counts moneyline books since 2026-09-01,
       and it degrades to "no moneyline posted" on a zero. This label
       took the field without its meaning.
       ➡️ THE CLASS: A FIELD NAME NARROWER THAN IT READS IS HARMLESS
       UNTIL SOMETHING DISPLAYS IT. `n_books` had been correct and
       privately understood for weeks; putting it on the page beside the
       thing it does not count is what created the defect. Same family
       as `fixed_drive` — the authoritative-sounding name was not the
       one the value was keyed to.
       ⛔ THE COUNT IS NOT SUPPRESSED. A game we hold no moneyline for
       is a real and useful fact about a mismatch this size, and hiding
       it would make these 15 look like the other 75.
       [Sam, 2026-10-01] no explanation boxes or tags on the page: no
       warning sentence under a zero; the label says what it counts.
       ══════════════════════════════════════════════════════════════ */
    if (L.n_books != null) li('Books with a moneyline', L.n_books);
    /* ══════════════════════════════════════════════════════════════
       🔴 THE FIRST-HALF TOTAL IS ONE BOOK'S LINE, AND THE VALUE SAYS SO.
       `[Sam, 2026-09-18]` The live pull asks ONE market in ONE region,
       and `us2` is the region Hard Rock lives in. ⛔ Every other price
       in this section is the best of five books; this one is not
       shopped at all.
       ⛔ SO IT DOES NOT GET THE BARE `li()` THE SHOPPED PRICES GET. A
       reader who sees "First-half total 21.5" in the same style as
       "Total 45.5" has been told it was shopped the same way, which is
       false. The book is named on the value itself.
       [Sam, 2026-10-01] no explanation boxes or tags on the page: no
       caveat bullet under the value, and the builder's absent-half and
       missing-market sentences are not printed (they stay in the file).
       ══════════════════════════════════════════════════════════════ */
    const H = s.first_half;
    if (H && H.total != null)
      li('First-half total', `${H.total} <span class="donebook">`
         + `${H.book || 'one book'} only</span>`);
    const c = s.closing;
    if (c && c.closing_spread != null) li('Closing spread', c.closing_spread);
    if (c && c.closing_total  != null) li('Closing total',  c.closing_total);
  }
  if (s.n === 2 && (s.meetings || []).length)
    s.meetings.forEach(m => li(`${m.date}`,
      `${m.away} ${m.away_score} &ndash; ${m.home_score} ${m.home}`));
  if (s.n === 3 && s.by_team)
    Object.keys(s.by_team).forEach(t => {
      const v = s.by_team[t] || {};
      li(t, `${num(v.player_rows)} player game${v.player_rows === 1 ? '' : 's'}`
           + ` across ${num(v.prior_seasons_with_this_week)} earlier season`
           + (v.prior_seasons_with_this_week === 1 ? '' : 's'));
    });
  if (s.n === 4){
    if (s.through_week != null) li('Through week', s.through_week);
    /* ⚠️ THE NAMES AND POSITIONS THE BUILDER STORED, in its own order
       (it sorted them by trailing snap share). ⛔ Not re-sorted here —
       a second ordering is a second copy of the selection rule. */
    if (s.by_team) Object.keys(s.by_team).forEach(t => {
      const pl = s.by_team[t] || {};
      const names = Object.keys(pl).map(n => `${n} (${(pl[n] || {}).pos || ''})`);
      if (names.length) li(t, names.join(' &middot; '));
    });
  }
  /* ══════════════════════════════════════════════════════════════
     🔴 §5 SHOWS SAM'S FOUR AND NOTHING ELSE.
     `[Sam, 2026-09-18: "for player props i only want qb,rb,wr,te"]`
     ⛔ ~~`Object.keys(d).forEach`~~ — that iterated WHATEVER THE FILE
     HELD. It gave the right answer only because
     `allowed-by-position-2026.json.gz` happens to hold exactly those
     four today, while `PROP_POS` in cfb.py AND nfl.py is
     `{QB, RB, WR, TE, FB}` — five. The first fullback row to appear
     would have put a fifth position on the page with nobody deciding.
     ✅ It now walks `s.positions`, the list the BUILDER declared, so
     the page cannot show a position that was not chosen.
     ⛔ AND A POSITION WE HOLD NOTHING FOR REFUSES BY NAME — not a zero,
     not a blank, not an omission. Same shape as an UNAVAILABLE section
     one level up.
     ══════════════════════════════════════════════════════════════ */
  if (s.n === 5 && (s.by_defence || s.not_held)){
    const held = s.by_defence || {};
    const gone = s.not_held || {};
    /* teams in a stable order, both sides, whichever half holds them */
    const teams = Array.from(new Set(
      Object.keys(held).concat(Object.keys(gone))));
    /* ⛔ THE DECLARED LIST, NEVER THE DATA'S KEYS. No fallback to
       Object.keys here: if `positions` is absent the section is from an
       older build and showing nothing is correct, because showing the
       file's own keys is exactly the behaviour being removed. */
    const order = s.positions || [];
    teams.forEach(t => {
      order.forEach(pos => {
        const row = (held[t] || {})[pos];
        if (row){
          const g = row.games;
          li(`${t} vs ${pos}`, `ranked over ${num(g)} game${g === 1 ? '' : 's'}`);
        } else {
          const r = (gone[t] || {})[pos];
          /* ⛔ THE BUILDER'S OWN SENTENCE, VERBATIM (rule 132). */
          if (r && r.why) f.push(`<li>${r.why}</li>`);
        }
      });
    });
    /* [Sam, 2026-10-01] a position this page leaves out is not announced. */
  }
  if (s.n === 6 && s.by_team)
    Object.keys(s.by_team).forEach(t => {
      const v = s.by_team[t] || {};
      li(t, `${v.minutes} a game over ${num(v.games)} game`
           + (v.games === 1 ? '' : 's'));
    });
  /* 🔴 SIGNAL 7 IS PLAYERS RULED OUT, PER TEAM, WITH THEIR NAMES.
     `[Sam, 2026-09-23]` ~~'Players carrying a flag'~~ counted the injury
     flag on stat rows, and a player who is out has no stat row — so it
     only ever showed "questionable and played". The builder now sends
     each team's latest reported week of out / doubtful / IR / inactive.
     ⛔ College sends no `by_team` and an UNAVAILABLE `why` instead, which
     renders above as the sentence saying it is NFL-only. */
  if (s.n === 7 && s.by_team){
    const h = x => String(x).replace(/[&<>"]/g,
      c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    Object.keys(s.by_team).forEach(t => {
      const v = s.by_team[t] || {};
      if (v.week == null){ li(h(t), 'no players ruled out on record'); return; }
      const names = (v.players || []).map(h).join(', ');
      li(h(t), `${num(v.out)} ruled out for week ${v.week}` + (names ? `: ${names}` : ''));
    });
  }
  if (s.n === 8){
    if (s.venue)   li('Where', s.venue);
    if (s.roof)    li('Roof', s.roof === 'outdoors' ? 'open to the sky' : s.roof);
    if (s.surface) li('Surface', s.surface.replace(/_/g, ' '));
    if (s.weather && s.weather.temp != null) li('Temperature', s.weather.temp + '&deg;');
    if (s.weather && s.weather.wind != null) li('Wind', s.weather.wind + ' mph');
  }
  return f.length ? `<ul class="df">${f.join('')}</ul>` : '';
}

function fbDosSection(s){
  const gap = s.state !== 'OK';
  /* ⛔ `s.why` VERBATIM. Not summarised, not reworded, not truncated.
     [Sam, 2026-10-01] only a section with nothing to show prints it, as
     its one-line empty state; a section that answers shows its facts. */
  return `<div class="dossec${gap ? ' gap' : ''}">
      <div class="dn">${s.name}</div>
      ${gap ? `<p class="dw">${s.why || ''}</p>` : ''}
      ${fbDosFacts(s)}
    </div>`;
}

/* 16 of the 90 college games on the board carry an opponent the season
   files do not cover. ⛔ The name is NEVER a blank: the board always has
   it and the builder carries it through as `away_name`/`home_name`.
   [Sam, 2026-10-01] no flag on the header; that side's checks render as
   gaps. */
function fbDossierHtml(x){
  if (!x) return '<p class="plain">No signals stored for this game yet.</p>';
  /* ⚠️ CALLED, NOT PASSED. `.map(fbDosSection)` reads identically and
     `jsblock.calls()` cannot see it — and "who calls it" is the only
     question that catches a renderer that is defined and never reached
     (rule 130). ⛔ A guard blinded by a style choice is a guard. */
  const secs = (x.sections || []).map(s => fbDosSection(s)).join('');
  return `<div class="doshd">${x.away_name || ''} at ${x.home_name || ''}</div>
    <div class="dosg">${secs}</div>`;
}

/* ⚠️ SCOPED TO `#fbview`, like `fbWireDayRows`. An unscoped sweep would
   double-bind whichever football tab drew last — and MLB wires its own
   `tr.dayrow` unscoped, so a shared class name here would collide with
   MLB the moment both were on the page. `tr.dosrow` is football's alone.
   ⛔ ONE OPEN AT A TIME and collapsed by default, the same as the
   `fbdd-<date>` rows Sam asked for. */
function fbWireDossierRows(lg){
  document.querySelectorAll('#fbview tr.dosrow').forEach(tr => {
    tr.addEventListener('click', async () => {
      const id = tr.dataset.bid;
      const box = document.querySelector('#fbdos-' + id);
      if (!box) return;
      if (!box.hidden){ box.hidden = true; tr.classList.remove('open'); return; }
      document.querySelectorAll('#fbview tr.dosdetail').forEach(o => { o.hidden = true; });
      document.querySelectorAll('#fbview tr.dosrow.open').forEach(o => o.classList.remove('open'));
      tr.classList.add('open');
      box.hidden = false;
      const cell = box.querySelector('td');
      if (cell.dataset.loaded) return;
      cell.innerHTML = '<div class="msg" style="padding:18px 0">Loading&hellip;</div>';
      const D = await fbDossierLoad(lg);
      if (!D){
        /* No file before a league's first `card-fb` arm: one plain line,
           never a broken tab [Sam, 2026-10-01]. */
        cell.innerHTML = '<p class="plain">No signals stored for this game yet.</p>';
        return;
      }
      cell.innerHTML = fbDossierHtml(fbDossierBy(D).get(id));
      cell.dataset.loaded = '1';
    });
  });
}

function fbOddsTable(list){
  const row = g => {
    const a = g.away, h = g.home;
    const ma = (g.best_ml||{})[a], mh = (g.best_ml||{})[h];
    /* 🔴 ET, EXPLICITLY -- the same as fbKickTime (Scores) and fbProps.
       Without the timeZone this renders in the VIEWER'S local zone while
       the other two football tabs force ET, so the SAME KICKOFF read
       6:00 PM on Odds and 7:00 PM on Scores for a Central-time reader.
       Rule 66: one number per fact, the same everywhere on the site.
       MLB is left alone -- all three of its tabs use local time, so it is
       internally consistent; changing it is a separate decision. */
    const t = new Date(g.commence).toLocaleTimeString([], {hour:'numeric',
      minute:'2-digit', timeZone:'America/New_York'}) + ' ET';
    /* 🔴 LOGO + NAME, the way an MLB odds row reads. The logo falls back
       to the team's abbreviation if the image 404s, so a bad URL is
       cosmetic and never leaves a hole in the table. */
    const nm = x => `<span class="nm" style="font-weight:600;display:inline-flex;
      align-items:center;gap:6px">${fbMark(x, 20)}<span>${x}</span></span>`;
    const price = m => { const u = betLink(m && m.link); return u
      ? `<a class="cell best" href="${u}" target="_blank" rel="noopener nofollow">${sgn(m.price)} &rarr;</a>`
      : `<span class="cell best">${m ? sgn(m.price) : '&mdash;'}</span>`; };
    /* ⚠️ `run_line` is the BASEBALL field name and it carries the
       spread. The field is not renamed -- the collector writes one
       schema for both sports -- but the LABEL must be the football
       word, or the page is quoting a run line on a football game. */
    const sprA = ((g.best_spread||{})[a]||{}).pt != null ? sgn(g.best_spread[a].pt)
               : (g.run_line != null ? sgn(g.run_line) : '');
    const sprH = ((g.best_spread||{})[h]||{}).pt != null ? sgn(g.best_spread[h].pt)
               : (g.run_line != null ? sgn(-g.run_line) : '');
    /* 🔴 THE ROW OPENS SAM'S EIGHT SIGNALS. ⛔ Keyed on the BOARD'S OWN
       `g.id`, which is the one key the dossier now carries as
       `board_id` — never the team names and never the kickoff. */
    return `<tr class="dosrow" data-bid="${g.id}"
        title="Click for the eight checks on this game">
      <td class="gm"><div class="gt">${t}</div>
        <div class="stack">${nm(a)}${nm(h)}</div>
        <div class="gt" style="margin-top:2px">the eight checks
          <span class="caret">&#9656;</span></div></td>
      <td><div class="stack">
        <span class="cell">${g.win_pct[a] != null ? g.win_pct[a] + '%' : '&mdash;'}</span>
        <span class="cell">${g.win_pct[h] != null ? g.win_pct[h] + '%' : '&mdash;'}</span>
      </div></td>
      <td><div class="stack">${price(ma)}${price(mh)}</div></td>
      <td><div class="stack">
        <span class="cell plain">${ma ? bookName(ma.book) : ''}</span>
        <span class="cell plain">${mh ? bookName(mh.book) : ''}</span>
      </div></td>
      <td><div class="stack">
        ${priceCell((g.best_total||{}).Over,  g.total != null ? 'O' + g.total : '')}
        ${priceCell((g.best_total||{}).Under, g.total != null ? 'U' + g.total : '')}
      </div></td>
      <td><div class="stack">
        ${priceCell((g.best_spread||{})[a], sprA)}
        ${priceCell((g.best_spread||{})[h], sprH)}
      </div></td>
      <td><div class="stack">
        <span class="cell">${g.team_total[a] ?? '&mdash;'}</span>
        <span class="cell">${g.team_total[h] ?? '&mdash;'}</span>
      </div></td>
      <td>${(() => {
        /* 🔴 `n_books` COUNTS MONEYLINE BOOKS, NOT BOOKS. `[measured
           2026-09-01]` 22 of 103 college games have NO moneyline at all
           -- no book takes a -50000 favourite -- while still carrying a
           DraftKings spread and total. Printing "0 books" beside live
           prices reads as "no book has this game", which is false.
           ⛔ MLB never exposed this because every MLB game gets a
           moneyline, so the label was never wrong there. It is wrong on
           a FIFTH of a college slate. */
        if (g.n_books) return `<div class="big" style="font-size:13px;color:var(--mut)">${
          g.vig_pct ?? '&mdash;'}%</div><div class="sub">${g.n_books} books</div>`;
        const other = (g.best_total && Object.keys(g.best_total).length)
                   || (g.best_spread && Object.keys(g.best_spread).length);
        return other
          ? `<div class="big" style="font-size:13px;color:var(--mut)">&mdash;</div>`
          : `<div class="big" style="font-size:13px;color:var(--mut)">&mdash;</div>`;
      })()}</td>
    </tr>
    <tr class="dosdetail" id="fbdos-${g.id}" hidden>
      <td colspan="8"></td></tr>`;
  };
  return `<div class="obwrap"><table class="ob">
      <thead><tr>
        <th class="gm">Game</th><th>Win&nbsp;%</th><th>Best&nbsp;price</th><th>Where</th>
        <th>Total</th><th>Spread</th><th>Implied<br>points</th><th>Vig</th>
      </tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>`;
}

async function fbOdds(){
  const v = $('#fbview');
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  const B = await fbBoardLoad();
  if (!B || !(B.games||[]).length){
    /* ⛔ AN EMPTY BOARD IS NOT AN ERROR: one plain line, no schedule
       sentence [Sam, 2026-10-01]. */
    v.innerHTML = fbShell(`<div class="msg">No ${LG_NAME[LEAGUE]} odds stored yet.</div>`);
    fbWire(); return;
  }
  const {list: _oList, nStarted, allDone} = splitStarted(B.games);
  /* ⛔ THE CONFERENCE FILTER IS APPLIED HERE, ON THE GAME LIST, so every
     count and every date block below already reflects it. Filtering at
     render time instead would leave the headers claiming games the reader
     cannot see. */
  const list = _oList.filter(g => fbConfPass(g.away, g.home));
  const byDate = {};
  /* 🔴 GROUP BY ET DATE, NOT UTC. A Saturday 8pm ET kickoff is 00:00Z
     Sunday, and slicing the UTC string files it under the wrong day --
     which on a college Saturday would split the slate in half. */
  list.forEach(g => (byDate[etDate(g.commence)] ||= []).push(g));
  const blocks = Object.keys(byDate).sort().map(d => {
    const games = byDate[d].slice().sort((x,y) => x.commence < y.commence ? -1 : 1);
    const dd = new Date(d + 'T12:00:00Z');
    return `<h3 style="margin:24px 0 9px;font-size:14px">
        ${dd.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})}
        <span class="rec">${games.length} game${games.length===1?'':'s'}</span></h3>
      ${fbOddsTable(games)}`;
  }).join('');
  v.innerHTML = fbShell(`<div style="margin-bottom:6px">
      <h2 style="margin:0 0 4px;font-size:16px">Odds</h2>
      <p style="color:var(--mut);margin:0">${freshness(B.pulled_at)}</p>
    </div>
    ${fbConfBar()}
    ${startedToggle(nStarted, 'fb-ob-started', allDone)}
    ${blocks || `<div class="msg">${fbConf.size && _oList.length
      ? `No board game involves ${[...fbConf].join(', ')}.`
      : 'No games on the board.'}</div>`}`);
  fbWire();
  /* 🔴 WIRED HERE, AFTER THE innerHTML THAT DREW THE ROWS. `#fbview` is
     rebuilt from scratch by every football renderer, so a listener bound
     before the write is bound to a detached row — ledger rule 197: the
     game-lines section existed, was wired, and simply never drew, and
     that was found by LOADING the page, not by reading it. */
  fbWireDossierRows(LEAGUE);
  const t = $('#fb-ob-started');
  if (t) t.addEventListener('click', () => { showStarted = !showStarted; fbOdds(); });
}

/* ══════════════════════════════════════════════════════════════════
   FOOTBALL SCORES & MATCHUPS.

   ⚠️ WHAT THIS IS AND IS NOT. It is the SCHEDULE plus FINAL SCORES from
   CFBD `/games` and nflverse `games.csv.gz`. ⛔ It is NOT the live
   in-game state MLB has from statsapi -- no drive, no clock, no score
   that moves while you watch. Saying "live" would be a claim neither
   source backs.

   🔴 TWO TIME FORMATS, AND GETTING THIS WRONG PUTS GAMES ON THE WRONG
   DAY. `[measured 2026-09-02]` CFBD returns ISO-with-Z
   ("2026-08-27T22:00:00.000Z"); nflverse returns a LOCAL date and time
   with NO ZONE ("2026-09-09T20:20"). ⛔ Parsing the second as UTC would
   shift every Sunday 1pm kickoff into Monday for anyone east of London,
   and treating the first as local would do the reverse.
   ✅ So a zoned stamp is converted to ET; an unzoned one is taken AS
   WRITTEN, because that is what the feed means.

   🔴 AND COLLEGE IS NOT ONE DIVISION. `/games` returns 3,679 games for
   2026 across 73 conferences -- down to Division II. ⛔ Filtering by a
   conference list would go stale at the next realignment, which is the
   same reason the Power 4 set is read from data. ✅ The feed's own
   `classification` decides, and the control says what it is showing.
   ══════════════════════════════════════════════════════════════════ */
const FBSCHED = {};
let fbDiv = 'fbs';     // college only: 'fbs' | 'all'
let fbWeek = null;

async function fbSchedLoad(season){
  const k = LEAGUE + '|' + season;
  if (FBSCHED[k] !== undefined) return FBSCHED[k];
  try { FBSCHED[k] = await jgetGz(`${LG_DATA[LEAGUE]}/latest/schedule-${season}.json.gz`); }
  catch(e){ FBSCHED[k] = null; }
  return FBSCHED[k];
}

/* ET date for a kickoff, honouring whether the feed gave a zone.
   ⛔ Never invents an offset. */
function fbKickDate(s){
  if (!s) return '';
  return /[Zz]|[+\-]\d\d:?\d\d$/.test(s) ? etDate(s) : s.slice(0, 10);
}
function fbKickTime(s){
  if (!s) return '';
  /* 🔴 EVERY TIME ON THIS TAB IS EASTERN, AND THAT IS A DECISION.
     The date heading is grouped on the ET date, so rendering the time in
     the VIEWER's zone would let the two disagree for anyone outside ET --
     a 7:30pm ET Thursday game reading "11:30 PM" under a Thursday
     heading. ⛔ Internally inconsistent is worse than either choice.
     ⚠️ AND THE TWO FEEDS ALREADY AGREE ONCE THIS IS DONE: nflverse
     `gametime` is measured to be Eastern already -- `[2026-09-02]` its
     three most common values across 272 games are 13:00 (149), 16:25
     (37) and 20:15 (33), which are the classic ET early, late and
     primetime slots and nothing else. So converting CFBD's zoned stamp
     to ET puts both leagues on one clock.
     `[Sam, 2026-10-01]` The "All times Eastern" note is gone, so the
     time carries " ET" itself. */
  if (/[Zz]|[+\-]\d\d:?\d\d$/.test(s))
    return new Date(s).toLocaleTimeString([], {hour:'numeric', minute:'2-digit',
                                               timeZone: 'America/New_York'}) + ' ET';
  const t = s.slice(11, 16);
  if (!t) return '';
  /* ⚠️ Unzoned = nflverse, already Eastern. Rendered as written. */
  const [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')} ${ap} ET`;
}

/* 🔴 SCORES OWNS ITS OWN SEASON. ⛔ IT USED TO SHARE `fbSeason` WITH
   TRENDS, AND THE TWO TABS DO NOT HAVE THE SAME SEASONS.
   `[measured 2026-09-04 by driving the page]` Trends renders first when
   you pick a league, and its newest NFL table is **2025** because 2026
   has no box scores yet -- so it set `fbSeason = 2025`, and Scores
   inherited it. `fbCurrentWeek` then picks the last week of an all-final
   season, which is the **Super Bowl**.
   ⛔ SO, FIVE DAYS BEFORE KICKOFF, NFL -> SCORES OPENED ON LAST
   FEBRUARY'S SUPER BOWL. College was worse: mid-season, with games this
   weekend, it opened on a **2025 bowl game (week 16)**.
   ⚠️ ONE VARIABLE CANNOT SERVE TWO TABS WHOSE DATA ARRIVES ON DIFFERENT
   SCHEDULES. A schedule exists months before a box-score table does --
   that is the whole reason `fbSeasonsAvailableSched` is separate from
   `fbSeasonsAvailable`, and the season variable had not been split to
   match. */
let fbScSeason = null;

/* ══════════════════════════════════════════════════════════════════════
   🔴 LIVE FOOTBALL SCORES — FETCHED BY THE BROWSER, EXACTLY LIKE MLB
   ══════════════════════════════════════════════════════════════════════
   Sam, 2026-09-06: "we have to make the scores live, we have to find a
   way to make cfb and nfl scores and matchups live."

   ⚠️ THE MLB TAB HAS ALWAYS DONE THIS. It polls `statsapi.mlb.com`
   straight from the page every 45 seconds -- no cron, no stored file, no
   commit. ✅ This is the same shape pointed at ESPN's public scoreboard,
   which is free and needs no key.

   🔴 WHY THIS IS A PAGE CHANGE AND NOT A COLLECTOR CHANGE. Collecting
   scores server-side would make "live" mean "however often GitHub runs
   a job" -- a scheduler that cannot go below five minutes and DROPS most
   of what it is asked to run (19 of 21 on one measured day). ⛔ A
   scoreboard that is up to half an hour stale is not a live scoreboard.

   ✅ WHAT IS ALREADY MEASURED, from the probe Sam ran on 2026-09-06:
     - reachable, free, HTTP 200, no key
     - every field this code reads was present in both leagues
     - 5 college games in progress ALL carried a clock, a period and both
       scores
     - 🔴 ESPN's event id IS our stored college game id -- 25 of 25 --
       and for the NFL our schedule now carries nflverse's own `espn`
       column, which holds exactly those ids (272 of 272 rows of 2026).

   ⛔ WHAT IS *NOT* KNOWN, AND IS HANDLED RATHER THAN ASSUMED:
     1. WHETHER THE BROWSER IS ALLOWED TO FETCH IT. A server request
        sends no `Origin`, so the probe could not settle CORS. **This
        code does not need the answer in advance: it tries once, and if
        the browser refuses it falls back to exactly today's tab.**
     2. HOW MANY OF OUR GAMES ESPN RETURNS. The first probe saw 25 events
        on a day our schedule held 206 college games. ⛔ So a game ESPN
        does NOT return is left EXACTLY as it is today -- never blanked,
        never marked "not started".
   `[Sam, 2026-10-01]` No explanation boxes on the page: the tab no longer
   prints a note about either.
   ══════════════════════════════════════════════════════════════════════ */
const FB_LIVE_PATH = { ncaaf: 'football/college-football', nfl: 'football/nfl' };
/* 🔴 ESPN'S SCOREBOARD SENDS A QUARTER OF THE SLATE UNLESS YOU ASK FOR
   THE DIVISIONS BY NAME. `[measured live in a browser, 2026-09-06]`

       college  ?limit=400              25 events   <- what shipped
       college  ?groups=80 (FBS)        99
       college  ?groups=81 (FCS)       159
       NFL      ?limit=400              16
       NFL      ?groups=80               0          ⛔ NEVER send it here

   ⚠️ THE NFL ROW IS WHY THIS IS PER LEAGUE AND NOT A CONSTANT. `groups`
   is a college concept; sending it to the NFL endpoint returns an empty
   scoreboard, which would have turned the NFL tab's live layer off while
   reporting nothing wrong.

   ✅ AND THE UNION IS EXACTLY THE TAB'S OWN VIEW, BOTH DIRECTIONS. For
   Saturday 2026-09-05: groups 80 ∪ 81 returned 103 events and the
   Division I view of our stored schedule holds 103 games — 103 in
   common, 0 ESPN sent that we do not show, 0 we show that ESPN did not
   send. That is the coverage question the probe left open, answered
   against the PRODUCT'S denominator rather than ESPN's (rule 122). */
const FB_LIVE_GROUPS = { ncaaf: ['80', '81'], nfl: [null] };
const FB_LIVE_BASE = 'https://site.api.espn.com/apis/site/v2/sports';
/* ⚠️ 45s IS MLB'S OWN INTERVAL, not a new number. One value, one meaning. */
const FB_LIVE_MS = 45000;

let FB_LIVE = null;        /* {byId, events, at} for the current league   */
let FB_LIVE_OFF = false;   /* ⛔ set after ONE failure — see below        */

/* 🔴 ONE FAILURE TURNS IT OFF FOR THE SESSION, AND THAT IS DELIBERATE.
   If the browser is not allowed to reach ESPN, every poll would throw
   the same error every 45 seconds for as long as the tab is open --
   console noise that hides real problems, and a request storm aimed at
   somebody else's server. ⛔ One attempt, then stop. */
/* ══════════════════════════════════════════════════════════════════════
   🔴 THE LIVE LAYER ONLY EVER SAW ESPN'S **CURRENT WEEK**, AND I HAD
   WRITTEN IT DOWN AS "TODAY".
   ══════════════════════════════════════════════════════════════════════
   Sam, 2026-09-08: *"the cfb scores arent updating, its not live and they
   havent even udpated from the games on 9/7."*

   ⛔ BOTH HALVES HAD THE SAME CAUSE AND IT WAS NOT CORS. Measured in a
   real browser at this origin on 2026-09-08:

       scoreboard?groups=80              -> dates 09-11, 09-12, 09-13
       scoreboard?groups=80&dates=20260906 -> 6 events, 6 FINAL
       scoreboard?groups=80&dates=20260907 -> 1 event,  1 FINAL

   **A bare scoreboard request returns the week ESPN is currently on.** On
   2026-09-05 that WAS the reader's week, which is why the 103-of-103
   coverage check passed and why nothing looked wrong. Three days later
   the same code answers for NEXT weekend and has nothing to say about the
   days the reader is looking at. ⚠️ A verification that can only be run
   on the day it passes is not a verification (ledger rule).

   ⛔ AND THE STORED FALLBACK WAS ALSO EMPTY, for an unrelated reason:
   CFBD has been returning **429 on every endpoint** since 09-06, so
   `schedule-2026.json.gz` had not been rebuilt in two days. Two
   independent faults presenting as one symptom.

   ✅ SO THE TAB NO LONGER DEPENDS ON CFBD FOR WHAT IT DRAWS. The polled
   query is UNCHANGED — same URL, same 45s, same proven behaviour — and a
   SECOND, CACHED layer asks ESPN for the specific ET days the selected
   week contains. Merged by ESPN's own event id, which is our stored id
   (measured 25 of 25), so a merge is a union and not a reconciliation.

   ⚠️ PER DAY, NOT PER RANGE — MEASURED. `dates=20260905-20260907`
   returned only 09-05 and 09-06: ESPN resolves a range to the WEEK the
   range starts in and silently drops the rest. A single `dates=YYYYMMDD`
   was exact both times it was checked. ⛔ Do not "simplify" this into one
   range request; it will look like it works and lose the last day.
   ══════════════════════════════════════════════════════════════════════ */
function fbLiveParse(events){
  const byId = {};
  (events || []).forEach(e => {
    try {
      const c  = (e.competitions || [])[0] || {};
      const st = c.status || {};
      const ty = st.type || {};
      const cs = c.competitors || [];
      const side = h => cs.find(x => x.homeAway === (h ? 'home' : 'away')) || {};
      const H = side(true), A = side(false);
      const num = v => (v === null || v === undefined || v === '') ? null : Number(v);
      byId[String(e.id)] = {
        state:  ty.state || null,
        detail: ty.shortDetail || null,
        clock:  st.displayClock || null,
        period: st.period == null ? null : Number(st.period),
        home:   num(H.score),
        away:   num(A.score),
      };
    } catch (_e) { /* one odd event must not lose the rest */ }
  });
  return byId;
}

/* The per-day layer. Keyed by "season|week" so it is fetched ONCE per
   selection and never by the 45s poll — past days do not change, and
   polling them would be a request storm aimed at somebody else's
   server for no new information. */
let FB_DAY = null, FB_DAY_KEY = null;

async function fbDayLoad(days, key){
  if (FB_LIVE_OFF) return;               /* already refused once */
  if (key === FB_DAY_KEY) return;        /* same selection, already have it */
  const path = FB_LIVE_PATH[LEAGUE];
  if (!path || !days || !days.length) { FB_DAY = null; FB_DAY_KEY = key; return; }
  /* ⛔ A CAP, because a season picker could otherwise ask for 100 days. */
  const use = days.slice(0, 8);
  try {
    const qs = [];
    use.forEach(d => (FB_LIVE_GROUPS[LEAGUE] || [null]).forEach(g =>
      qs.push(`${FB_LIVE_BASE}/${path}/scoreboard?limit=400&dates=${d}`
              + (g ? '&groups=' + g : ''))));
    const rs = await Promise.all(qs.map(u => fetch(u, { cache: 'no-store' })));
    const oks = rs.filter(r => r.ok);
    if (!oks.length) { FB_DAY = null; FB_DAY_KEY = key; return; }
    const ds = await Promise.all(oks.map(r => r.json()));
    FB_DAY = fbLiveParse(ds.reduce((a, x) => a.concat(x.events || []), []));
    FB_DAY_KEY = key;
  } catch (_e) {
    /* ⚠️ NOT a reason to turn the whole live layer off — the polled
       query may still be working. One quiet miss, the stored file
       still renders. */
    FB_DAY = null; FB_DAY_KEY = key;
  }
}

async function fbLiveLoad(){
  if (FB_LIVE_OFF) return null;
  const path = FB_LIVE_PATH[LEAGUE];
  if (!path) return null;
  try {
    /* ⚠️ ONE REQUEST PER DIVISION, IN PARALLEL, MERGED BY EVENT ID. The
       ids are ESPN's own and cannot collide, so a merge is a union and
       not a reconciliation. */
    const qs = (FB_LIVE_GROUPS[LEAGUE] || [null]).map(g =>
      `${FB_LIVE_BASE}/${path}/scoreboard?limit=400${g ? '&groups=' + g : ''}`);
    const rs = await Promise.all(qs.map(u => fetch(u, { cache: 'no-store' })));
    /* ⛔ IF ANY ONE OF THEM IS REFUSED THE BROWSER REFUSED ALL OF THEM —
       CORS is decided per origin, not per query string. A bad STATUS on
       one division is different: keep what did arrive. */
    const oks = rs.filter(r => r.ok);
    if (!oks.length) throw new Error('HTTP ' + rs.map(r => r.status).join('/'));
    const ds = await Promise.all(oks.map(r => r.json()));
    const d = { events: ds.reduce((a, x) => a.concat(x.events || []), []) };
    const byId = fbLiveParse(d.events);
    FB_LIVE = { byId, events: (d.events || []).length, at: new Date() };
    return FB_LIVE;
  } catch (e) {
    /* `[Sam, 2026-10-01]` Off for the session; the page prints no note. */
    FB_LIVE_OFF = true;
    FB_LIVE = null;
    return null;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ⛔ A TIMER MUST NEVER MOVE THE PAGE UNDER SOMEONE'S HANDS.
   ══════════════════════════════════════════════════════════════════════
   🔴 Sam, 2026-09-06: *"some of the tabs in cfb refresh on there own and
   direct me back to the top of the page, this has to be fixed because
   its annoying."*

   ⚠️ MLB HAS SOLVED THIS SINCE AUGUST and football never inherited it.
   `tick()` is single-flight, skips while a modal is open, **re-renders
   only when something actually MOVED**, and restores the scroll position
   across two animation frames. ⛔ The football re-render did none of it —
   not from the live poll I added, and not from the season, week,
   division or conference controls, every one of which rebuilds
   `#fbview` from scratch.

   ✅ ONE WRAPPER, USED BY ALL OF THEM. A re-render that cannot hold your
   place is a re-render that punishes you for reading. */
let fbTicking = false, fbSig = null;

async function fbKeepScroll(fn){
  const y = window.scrollY;
  await fn();
  if (y > 0){
    /* Two frames: one for the DOM, one for layout to settle its height —
       the same reason MLB's tick() waits twice. */
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    window.scrollTo(0, Math.min(y, max));
  }
}

/* What the feed says RIGHT NOW, as one string. ⛔ If it has not changed
   there is nothing to redraw, and redrawing anyway is what moves the
   page under the reader. */
function fbLiveSig(){
  if (!FB_LIVE) return 'none';
  return Object.keys(FB_LIVE.byId).sort().map(k => {
    const v = FB_LIVE.byId[k];
    return `${k}:${v.state}:${v.clock}:${v.away}-${v.home}`;
  }).join('|');
}

async function fbTick(){
  if (fbTicking) return;                              // one at a time
  if (document.querySelector('.ovl')) return;         // a modal is open
  fbTicking = true;
  try {
    await fbLiveLoad();
    const sig = fbLiveSig();
    if (sig === fbSig) return;                        // ⛔ nothing moved
    fbSig = sig;
    await fbKeepScroll(renderFootball);
  } finally { fbTicking = false; }
}

/* The live view of ONE stored game, or null if the feed does not have it.
   ⛔ KEYED ON THE ID, NEVER ON A TEAM NAME (ledger rule 54). */
function fbLiveOf(g){
  const key = g.espn || g.id;
  if (!key) return null;
  const k = String(key);
  /* ⛔ PRECEDENCE: the POLLED layer wins. It is seconds old; the day
     cache is a snapshot taken when the week was selected. For a game in
     progress those two disagree, and the fresher one is right. */
  if (FB_LIVE && FB_LIVE.byId[k]) return FB_LIVE.byId[k];
  if (FB_DAY && FB_DAY[k]) return FB_DAY[k];
  return null;
}

/* 🔴 WHICH NUMBER WINS, AND WHY. One number per fact (rule 66).
     - IN PROGRESS  -> the feed. Our file has nothing to say yet.
     - FINAL in our own file -> OURS. It is the score the Track Record
       grades against, and two surfaces disagreeing about a final is the
       exact defect rule 66 exists to stop.
     - FINAL only in the feed -> the feed, so a Saturday-night final shows
       immediately instead of waiting for the next schedule rebuild.
   ⚠️ AND A DISAGREEMENT IS SHOWN, NOT SWALLOWED. If both call it final
   and the scores differ, the stored one renders and the row says the feed
   disagrees -- silently picking one would hide a real data problem. */
function fbMerge(g){
  const L = fbLiveOf(g);
  const ours = (g.final && g.home_score != null && g.away_score != null);
  if (!L) return { home: g.home_score, away: g.away_score, final: !!g.final,
                   live: false, covered: false, conflict: false };
  if (L.state === 'in')
    return { home: L.home, away: L.away, final: false, live: true,
             covered: true, conflict: false,
             clock: L.clock, period: L.period, detail: L.detail };
  if (L.state === 'post'){
    const conflict = ours && L.home != null && L.away != null &&
                     (L.home !== g.home_score || L.away !== g.away_score);
    return ours
      ? { home: g.home_score, away: g.away_score, final: true, live: false,
          covered: true, conflict: conflict,
          theirs: conflict ? `${L.away}-${L.home}` : null }
      : { home: L.home, away: L.away, final: true, live: false,
          covered: true, conflict: false, fromFeed: true };
  }
  /* `pre` — the feed knows the game and it has not kicked off. */
  return { home: g.home_score, away: g.away_score, final: !!g.final,
           live: false, covered: true, conflict: false };
}

async function fbScores(){
  const v = $('#fbview');
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  const avail = await fbSeasonsAvailableSched();
  /* ⚠️ Default to the newest season that has a SCHEDULE, and only on
     first use -- once the reader picks a season it is theirs to keep. */
  if (fbScSeason === null || (avail.length && avail.indexOf(fbScSeason) === -1))
    fbScSeason = avail.length ? Math.max.apply(null, avail) : fbSeason;
  const doc = await fbSchedLoad(fbScSeason);
  if (!doc || !(doc.games || []).length){
    v.innerHTML = fbShell(`<div class="msg">No ${LG_NAME[LEAGUE]} schedule stored for ${fbScSeason}.</div>`);
    fbWire(); return;
  }

  /* ⏱️ THE LIVE FEED. ⛔ Only for the NEWEST season we hold — polling a
     live scoreboard while the reader is looking at 2025 is a request
     that cannot tell them anything.
     ⚠️ AND THE TEST IS THE DATA, NOT A CALENDAR RULE. "A football season
     is named for the year it starts" already lives in `freshness.py` and
     in the workflow's bash, pinned to each other by a test. ⛔ A THIRD
     copy here would be a third thing to drift; the newest season we have
     a schedule for answers the same question with no new rule. */
  const liveSeason = avail.length ? Math.max.apply(null, avail) : fbScSeason;
  if (fbScSeason === liveSeason) await fbLiveLoad();

  let games = doc.games.slice();
  const hasClass = games.some(g => g.home_class);
  if (LEAGUE === 'ncaaf' && hasClass){
    /* 🔴 DIVISION II AND III NEVER APPEAR. Sam, 2026-09-02: "no we are
       not doing d2 only d1." CFBD returns every level it covers -- 3,679
       games across 73 conferences for 2026 -- and the lower divisions
       are noise on this product.

       🔴 AND "BOTH SIDES FBS" WAS WRONG, WHICH HE CAUGHT. An FBS team
       playing an FCS opponent is an FBS GAME -- Ohio State's week-1
       opponent is very often FCS, and requiring both sides would have
       HIDDEN IT. ⛔ The reader looking for that game would have found
       nothing and concluded the tab was broken.
       ✅ So the FBS view keeps a game if EITHER side is FBS. */
    /* ✅ THE RULE IS "AT LEAST ONE SIDE", NOT "BOTH". Sam, 2026-09-02:
       "if a d1 school is playing a d2 school thats fine ... but i dont
       want d2 vs d2 or d2 v d3 matchups, were only focusing on d1
       matchups."
       ⛔ A "both sides" test drops the very games a reader is looking
       for -- an FBS team's early-season FCS opponent under the FBS view,
       and an FCS team's D2 opponent under the Division I view. What gets
       dropped is a game with NO qualifying team on either side. */
    const D1 = new Set(['fbs', 'fcs']);
    games = games.filter(g => {
      const h = (g.home_class || '').toLowerCase();
      const a = (g.away_class || '').toLowerCase();
      return fbDiv === 'fbs' ? (h === 'fbs' || a === 'fbs')
                             : (D1.has(h) || D1.has(a));
    });

  const weeks = [...new Set(games.map(g => g.week).filter(w => w != null))]

  if (fbScSeason === liveSeason){

           + String(e.getUTCMonth() + 1).padStart(2, '0')

                                  .map(g => et(g.start))
                                  .filter(Boolean))].sort();
    await fbDayLoad(days, `${LEAGUE}|${fbScSeason}|${fbWeek}`);

     rows in it you see. */

      <h2 style="margin:0 0 4px;font-size:16px">Scores &amp; Matchups</h2>

        in ${fbScSeason}${LEAGUE==='ncaaf' && hasClass

      ? `None of the <b>${nWeek}</b> games in week ${fbWeek} involve

  fbWire();

  /* 🔴 THE CARDS ARE APPENDED AS NODES, NOT INTERPOLATED AS HTML, because

     string would render them dead -- the MLB tab has the same
     constraint, which is why gameCard() returns an element too. */
  Object.keys(byDate).forEach(d => {
    const host = v.querySelector(`.fbcards[data-day="${CSS.escape(d)}"]`);
    if (!host) return;
    byDate[d].slice()
      .sort((a, b) => (a.start || '') < (b.start || '') ? -1 : 1)
      .forEach(g => host.append(fbGameCard(g)));
  });
  const sel = (id, fn) => { const el = $('#'+id); if (el) el.addEventListener('change', fn); };
  /* ⚠️ EVERY ONE OF THESE REBUILDS `#fbview`, so every one of them has to
     hold the reader's place. Changing the week and being thrown to the
     top of the page is the same annoyance as a timer doing it. */
  sel('fb-sc-season', e => { fbScSeason = +e.target.value; fbWeek = null;
                             fbKeepScroll(fbScores); });
  sel('fb-sc-week',   e => { fbWeek = +e.target.value; fbKeepScroll(fbScores); });
  sel('fb-sc-div',    e => { fbDiv = e.target.value; fbKeepScroll(fbScores); });
}

/* Which seasons have a SCHEDULE file. ⚠️ Separate from the trends
   probe: a season can have a schedule and no box-score tables, which is
   exactly what September looks like. */
const FBSCHEDHAVE = {};
async function fbSeasonsAvailableSched(){
  if (FBSCHEDHAVE[LEAGUE]) return FBSCHEDHAVE[LEAGUE];
  const got = await Promise.all(FB_SEASONS.map(async y => {
    try {
      const r = await fetch(`${LG_DATA[LEAGUE]}/latest/schedule-${y}.json.gz`,
                            {method: 'HEAD'});
      return r.ok ? y : null;
    } catch(e){ return null; }
  }));
  FBSCHEDHAVE[LEAGUE] = got.filter(y => y !== null);
  return FBSCHEDHAVE[LEAGUE];
}

/* 🔴 LAND ON THE WEEK A READER WANTS, not week 1 in December. The first
   week that still has an unplayed game; failing that, the last week. */
function fbCurrentWeek(games, weeks){
  for (const w of weeks) if (games.some(g => g.week === w && !g.final)) return w;
  return weeks[weeks.length - 1];
}

/* ══════════════════════════════════════════════════════════════════
   FOOTBALL PLAYER PROPS.

   🔵 EVERY NUMBER HERE IS MARKET. ⛔ AND ON FOOTBALL THAT IS NOT A
   TEMPORARY STATE: three pre-registered specifications -- T46, T47,
   T50 -- each lost to a player's own season average on held-out weeks,
   and every input we hold has been tested. So there is no football
   MODEL number to attach to a row, and this tab shows a line, a price
   and where to get it. That is the honest product.

   ⛔ NO PLAYER GAME-LOG COLUMN, ON PURPOSE. Attaching a player's own
   trailing numbers means matching a sportsbook's spelling to our
   database -- the Max Muncy problem, worse in college where a roster
   turns over 45% a year -- and 2026 logs do not exist yet. It is added
   when there are logs to join AND the match is proven by a gate.
   ══════════════════════════════════════════════════════════════════ */
/* The projections map from the published football card, so the Player
   Props tab can show the same number the Gizmo's Picks tab shows.
   ⛔ ONE WRITER: card_fb.py computes it, this only formats it. */
let FBPROJ = null;
const FBPROPS = {};
let fbMkt = 'all';
/* MLB keeps game/market/side in one object; football now does too. */
const fbPf = {game:'all', market:'all', side:'all'};

async function fbPropsLoad(){
  if (FBPROPS[LEAGUE] !== undefined) return FBPROPS[LEAGUE];
  try { FBPROPS[LEAGUE] = await jgetGz(`${LG_DATA[LEAGUE]}/latest/props.json.gz`); }
  catch(e){ FBPROPS[LEAGUE] = null; }
  return FBPROPS[LEAGUE];
}

async function fbProps(){
  const v = $('#fbview');
  v.innerHTML = fbShell('<div class="msg">Loading&hellip;</div>');
  fbWire();
  const B = await fbPropsLoad();
  /* ⚠️ LOADED BEFORE THE ROWS ARE BUILT, and a failure is not an error:
     on a day with no published card there are simply no projections, and
     the tab renders exactly as it did before. */
  try { FBPROJ = ((await fbCardLoad()) || {}).projections || {}; }
  catch(e){ FBPROJ = {}; }
  if (!B || !(B.games || []).length){
    /* `[Sam, 2026-10-01]` One plain line. The pull-schedule sentence that
       stood here ("Thursday evening, then Sunday morning") is gone. */
    v.innerHTML = fbShell(`<div class="msg">No ${LG_NAME[LEAGUE]} player props stored yet.</div>`);
    fbWire(); return;
  }

  /* 🔴 THE SAME LAYOUT AS THE MLB PROPS TAB, not a table.
     Sam, 2026-09-03: "i literallt want eveyrhtug to look exaclty the
     same the only difference is that its filled with nfl data".
     Three filters, a game header per matchup, then one `.prow` per line
     with the player, the bet, the price + book + Bet button, the
     evidence, and the market number on the right -- MLB's own classes,
     so both sports go through one stylesheet.
     ⛔ NO HEADSHOT COLUMN: MLB has player ids and a photo host; football
     has neither, and a permanently blank circle on every row is worse
     than not having the column. */
  const {list: games, nStarted, allDone} = splitStarted(
    B.games.map(g => ({...g, commence: g.commence})));
  const shown = games.filter(g => (fbPf.game === 'all' || g.id === fbPf.game)
                                  && fbConfPass(g.away, g.home));

  const mkts = [...new Set(B.games.flatMap(g => g.props.map(p => p.market)))];
  const label = {};
  B.games.forEach(g => g.props.forEach(p => { label[p.market] = p.label; }));
  if (fbPf.market !== 'all' && mkts.indexOf(fbPf.market) === -1) fbPf.market = 'all';

  const gopts = ['<option value="all">All games</option>'].concat(
    games.map(g => `<option value="${g.id}"${g.id===fbPf.game?' selected':''}>${
      fbAb(g.away)} @ ${fbAb(g.home)} — ${fbKickTime(g.commence) || ''}</option>`)).join('');

  const priceCell = sd => {
    if (!sd || sd.price == null) return '';
    const u = betLink(sd.link);
    return `<div class="v2">${sgn(sd.price)}</div>${bookChip(sd.book)}
      ${u ? `<a class="betbtn" href="${u}" target="_blank" rel="noopener nofollow">Bet &rarr;</a>` : ''}`;
  };

  /* One row per SIDE, exactly as MLB does -- an Over and an Under are two
     different bets at two different prices and each needs its own button. */
  const rowHtml = (p, side, sd) => {
    const word = side === 'over' ? 'Over' : side === 'under' ? 'Under' : 'Yes';
    const ln = p.line == null ? '' : ' ' + p.line;
    /* ⛔ NO HEADSHOT SLOT. MLB has player ids and a photo host; football
       has neither, and an empty grey circle on every row is worse than
       not having the column -- it reads as an image that failed. */
    /* 🔴 THE PROJECTION, JOINED FROM THE PUBLISHED CARD.
       Exactly how the MLB props tab does it: the number lives on
       the card so there is ONE writer, and this tab formats it
       through the SAME projChip. A miss renders nothing -- an
       absent projection means the market was never measured or he
       has too few games, and it never means guess.
       ⚠️ Keyed by NAME because football has no player ids. That is
       safe only because both files are built by this repo from the
       same snapshot, so the strings are identical by construction
       (50 of 50 on the live board) rather than by name matching.
       `[Sam, 2026-10-01]` `.ev2` stays as the row's empty spacer; the
       sentence it held is gone (no explanations on the page). */
    return `<div class="prow fbprow">
      <div class="who">
        <div class="nm2">${p.player}</div>
        <div class="tm2">${p.label || ''}</div>
      </div>
      <div class="bet">
        <div class="ln">${word}${ln}</div>
        <div class="mk">${p.unit || p.label || ''}</div>
        ${(() => { const j = (FBPROJ || {})[
             `${p.player}|${p.market}|${side}|${p.line}`];
           return j ? projChip(j.v, j.u, j.b, j.n) : ''; })()}
      </div>
      <div class="pr2">${priceCell(sd)}</div>
      <div class="ev2"></div>
      <div class="imp">${sd && sd.n_books
        ? `<b>${sd.n_books}</b>book${sd.n_books > 1 ? 's' : ''}`
        : '&mdash;'}</div>
    </div>`;
  };

  let body = '', total = 0;
  (allDone ? games : shown).forEach(g => {
    const list = (g.props || []).filter(p =>
      fbPf.market === 'all' || p.market === fbPf.market);
    if (!list.length) return;
    let rows = '';
    list.forEach(p => {
      const sides = p.sides || {};
      ['over', 'under', 'yes'].forEach(k => {
        if (!sides[k]) return;
        if (fbPf.side !== 'all' && k !== 'yes' && k !== fbPf.side) return;
        rows += rowHtml(p, k, sides[k]); total++;
      });
    });
    if (!rows) return;
    body += `<div class="ghead">
        ${fbMark(g.away, 20)} ${fbAb(g.away)} <span style="color:var(--line)">@</span>
        ${fbMark(g.home, 20)} ${fbAb(g.home)}
        <span class="tt2">${fbKickTime(g.commence) || ''} &middot; ${list.length} props</span>
      </div>${rows}`;
  });

  v.innerHTML = fbShell(`
    ${fbConfBar()}
    <div class="pfilt">
      <select id="fb-pf-game">${gopts}</select>
      <select id="fb-pf-mkt">
        <option value="all"${fbPf.market==='all'?' selected':''}>All markets</option>
        ${mkts.map(m => `<option value="${m}"${m===fbPf.market?' selected':''}>${label[m]}</option>`).join('')}
      </select>
      <select id="fb-pf-side">
        <option value="all"${fbPf.side==='all'?' selected':''}>Both sides</option>
        <option value="over"${fbPf.side==='over'?' selected':''}>Over</option>
        <option value="under"${fbPf.side==='under'?' selected':''}>Under</option>
      </select>
      <span class="stamp">${total.toLocaleString()} props &middot; ${freshness(B.pulled_at)}</span>
    </div>
    ${startedToggle(nStarted, 'fb-pr-started', allDone)}
    ${body || `<div class="msg">${fbConf.size && !shown.length && games.length
      ? `None of the <b>${games.length}</b> games with props involve
         ${[...fbConf].join(', ')}.`
      : 'No lines in this market.'}</div>`}`);
  fbWire();
  const on = (id, fn) => { const e = $('#' + id); if (e) e.addEventListener('change', fn); };
  on('fb-pf-game', e => { fbPf.game = e.target.value; fbProps(); });
  on('fb-pf-mkt',  e => { fbPf.market = e.target.value; fbProps(); });
  on('fb-pf-side', e => { fbPf.side = e.target.value; fbProps(); });
  const t = $('#fb-pr-started');
  if (t) t.addEventListener('click', () => { showStarted = !showStarted; fbProps(); });
}
