# ══════════════════════════════════════════════════════════════════════
# PR TESTS — THE WHOLE SUITE, ON EVERY PULL REQUEST, BEFORE SAM MERGES.
# `[added 2026-09-22]`
# ⛔ UNTIL THIS FILE, THE ONLY PLACE THE SUITE RAN WAS INSIDE `collect.yml`,
# i.e. AFTER a change was already on `main` and already running on the
# live site. Sam, 2026-09-22, on moving the work to Claude Code: "it did end
# up causing alot of failed recurring runs, i would like to avoid that".
# ✅ So a Claude Code session works on a BRANCH and opens a PR; this job
# runs the same suite on it; Sam merges only on a green check.
# ⛔ NO SCHEDULE BLOCK, ON PURPOSE. GitHub runs scheduled jobs as the
# user who last changed a cron block (CLAUDE.md). A file with no cron
# cannot move that attribution, so an agent may safely edit this one.
# ⚠️ The loop below is copied from collect.yml's Tests step, not
# reinvented — test_pr_tests.py fails if the two ever disagree.
# ⛔ READ-ONLY: it writes nothing, pushes nothing, opens nothing.
# ✅ `[2026-09-24]` It also runs browser.yml's render tests, on both
# images, so a PR learns about a broken page (or a Playwright install
# that no longer works on a new Ubuntu) BEFORE merge, not after.
# ══════════════════════════════════════════════════════════════════════
name: pr-tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # 🔴 THE SUITE RUNS ON THE IMAGE WE USE AND THE ONE WE ARE MOVING TO.
    # `[2026-09-24]` GitHub moves `ubuntu-latest` to Ubuntu 26.04 from
    # 2026-10-19. Every workflow is PINNED to ubuntu-24.04 (a floating
    # label fails test_runner_image.py), and this matrix is how we learn,
    # on every PR, whether it is safe to move them to 26.04.
    # ⚠️ The 24.04 row keeps the check's old name, `tests`, so nothing
    #    that already waits on that name has to change.
    name: tests${{ matrix.os != 'ubuntu-24.04' && format(' ({0})', matrix.os) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          # 🔴 THIS STEP NAMED ONE TEST FILE AND THE REPO HELD SIX.
          # `[measured 2026-09-01]` test_cfb.py, test_p4.py,
          # test_regions.py and test_board_match.js were all in the repo,
          # all passing, and NONE of them had ever gated anything. They
          # were written to protect the Power 4 name matcher, the props
          # region pricing and the CFB parsers -- three of the places
          # this project has actually been burned.
          # ⛔ A TEST THAT NEVER RUNS IS WORSE THAN NO TEST: it is a
          # false sense of cover, and it rots silently.
          # ✅ So DISCOVER them. Same rule as budget.py -- never put a
          # list anywhere you cannot auto-update. A new test_*.py is
          # picked up by existing here, with no workflow edit.
          rc=0
          found=0
          # 🔴 THE FAILING NAMES ARE RECORDED, NOT ONLY ANNOTATED.
          # `::error::` reaches the run page and nowhere else, and the run
          # page is the thing nobody is watching at 3am. The names go into
          # an output so "Tell Sam the tests are failing" can put them in
          # an ISSUE, which emails. `[added after test_board_match.js went
          # red on 47 consecutive runs and the only alarm was Sam
          # happening to look — ledger rule 261]`
          failed=""
          # 🔴🔴 EVERY FILE GETS A CLOCK, AND A TIMEOUT IS ITS OWN VERDICT.
          # `[added 2026-09-15 — ledger rule 272]`
          # ⛔ THIS LOOP HAD NO TIMEOUT AND THE JOB'S IS **350 MINUTES**.
          # One hanging file would have burned nearly six hours of runner
          # time and been CANCELLED — no `::error::`, no name in
          # `failed=`, nothing in the issue. The one failure mode that
          # produces no evidence at all.
          # ⚠️ AND IT ALREADY MISLED ME. I recorded that two files "hang
          # because the proxy blocks ESPN and CollegeFootballData" —
          # **both claims were false.** Measured 2026-09-15: all 71 files
          # pass in 308s total; `test_box_live.py` simply takes 115s and
          # I had been killing it at 45. ⛔ A timeout I chose is not a
          # fact about the code, and "it hung" is not a diagnosis.
          # ✅ 600s = 5.2x the slowest measured file. Generous on purpose:
          # CLAUDE.md — a guard that fires on correct code is the other
          # failure, not a safe one.
          PER_FILE=600
          # 🔴🔴 ONE FILE NEEDS A DIFFERENT CLOCK, AND THE CLOCK WAS THE
          #    THING ASKING THE WRONG QUESTION — NOT THE CHECK.
          # `[measured 2026-09-19, isolated]` `test_vacuity.py` applies
          # 141 declared mutations, runs the declaring test under each,
          # and restores the tree: **18m16s, exit 0, 40 of 40 checks**.
          # Against a 600s clock it can only ever be killed, and it has
          # been — `collect.yml` has not had a green run since
          # 2026-09-17T23:27 and this one line is why.
          # ⛔ THE 600 WAS NOT WRONG WHEN IT WAS WRITTEN. The comment
          #    above derives it as "5.2x the slowest measured file", and
          #    the slowest file then was `test_box_live.py` at 115s. A
          #    sweep is not that shape. `CLAUDE.md`: a check may change
          #    when it asks the WRONG QUESTION — and "did this finish
          #    inside 5x the slowest UNIT test" is the wrong question to
          #    ask a mutation sweep.
          # ⛔ THE SWEEP ITSELF IS UNTOUCHED — not shortened, not
          #    sampled, not skipped. 2400s is 2.2x its measured cost,
          #    the same margin 600 gave the file it was fitted to.
          # ⚠️ AND NO BUDGET MAY BE LOWERED. `test_suite_clock.py` drives
          #    this function and fails if any file's clock drops below
          #    the default, so this cannot become a way to let a slow
          #    file off.
          budget_for() {   # $1 = file
            case "$1" in
              test_vacuity.py) echo 2400 ;;
              *)               echo "$PER_FILE" ;;
            esac
          }
          run_one() {   # $1 = runner, $2 = file
            local s=$(date +%s) trc=0 lim
            lim=$(budget_for "$2")
            timeout -k 15 "$lim" "$1" "$2" || trc=$?
            local d=$(( $(date +%s) - s ))
            if [ "$trc" = "124" ] || [ "$trc" = "137" ]; then
              # 🔴 "NEVER ANSWERED" IS NOT "FAILED". A red assertion tells
              # you what is wrong; a timeout tells you only that nothing
              # came back, and conflating them sends the reader hunting
              # for a bug that may not exist.
              rc=1; failed="$failed $2(TIMEOUT)"
              echo "::error::$2 TIMED OUT after ${lim}s — it did not fail, it never answered"
            elif [ "$trc" != "0" ]; then
              rc=1; failed="$failed $2"
              echo "::error::$2 FAILED"
            fi
            echo "   ${d}s"
          }
          for t in test_*.py; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "── $t"
            run_one python "$t"
          done
          for t in test_*.js; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "── $t"
            run_one node "$t"
          done
          echo "ran $found test file(s)"
          echo "failed=$(echo $failed | tr ' ' ',')"
          # ⚠️ ZERO TEST FILES IS A FAILURE, NOT A PASS. A glob that
          # matches nothing is exactly how a suite disappears unnoticed.
          if [ "$found" -lt 4 ]; then
            echo "::error::only $found test file(s) found — the suite has shrunk"
            rc=1
          fi
          echo "rc=$rc"
          exit $rc

      - name: The tests must not have modified the tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test step modified the working tree"
            git status --porcelain
            git diff | head -200
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════
  # 🔴 BROWSER.YML'S RENDER TESTS, ON BOTH IMAGES. `[added 2026-09-24]`
  # ⚠️ `playwright install --with-deps` installs Ubuntu PACKAGES by name,
  # and package names change between Ubuntu releases — it is the step most
  # likely to break on 26.04. browser.yml has a cron block, so it cannot be
  # pointed at 26.04 to find out without Sam's hand; this job can.
  # ⛔ THE STEPS BELOW ARE browser.yml's, LINE FOR LINE — test_runner_image.py
  #    fails if they drift (rule 117: a copy breaks in the file you did not
  #    edit). It runs on PRs only: browser.yml still owns push + schedule.
  # ══════════════════════════════════════════════════════════════════════
  render:
    name: render${{ matrix.os != 'ubuntu-24.04' && format(' ({0})', matrix.os) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ⚠️ `--with-deps` PULLS THE SYSTEM LIBRARIES CHROMIUM NEEDS. Without
      # it the browser installs and then fails to launch, which reads as a
      # test failure rather than a setup one.
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      # 🔴 THE BROWSER MUST ACTUALLY BE THERE. If the install silently
      # half-worked, every gated check would `note()` its skip again and
      # this whole workflow would go green having tested nothing — the
      # exact failure it exists to end.
      - name: Prove the browser is available
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.set_content("<h1 id=x>ok</h1>")
              assert pg.inner_text("#x") == "ok"
              b.close()
          print("browser OK")
          PY

      - name: Render tests
        run: |
          rc=0
          ran=0
          for t in test_box_live.py test_box_score.py test_live_scores.py \
                   test_nfl_opener.py test_league_switch.py; do
            [ -e "$t" ] || continue
            ran=$((ran+1))
            echo "── $t"
            python "$t" || { rc=1; echo "::error::$t FAILED"; }
          done
          echo "ran $ran render test file(s)"
          # ⛔ ZERO FILES IS A FAILURE, NOT A PASS — a glob that matches
          # nothing is how a suite disappears unnoticed. Same rule as the
          # collector's own Tests step.
          if [ "$ran" -lt 5 ]; then
            echo "::error::only $ran render file(s) found — the set has shrunk"
            rc=1
          fi
          exit $rc

      # 🔴 AND THE SKIP ITSELF IS NOW A FAILURE, HERE ONLY. In this
      # workflow a browser is guaranteed, so a file reporting "NO BROWSER
      # HERE" means the install broke — and reporting that as a pass is
      # precisely the silence this file was written to remove.
      # ⚠️ `collect.yml` keeps the note-and-continue behaviour, because
      # there the absence is correct (rule 133).
      - name: A skipped render check is a failure in THIS workflow
        if: always()
        run: |
          out=$(for t in test_box_live.py test_box_score.py \
                         test_live_scores.py test_nfl_opener.py \
                         test_league_switch.py; do
                  [ -e "$t" ] && python "$t" 2>&1
                done | grep -c "NO BROWSER HERE" || true)
          if [ "$out" != "0" ]; then
            echo "::error::$out file(s) reported NO BROWSER — the install did not take"
            exit 1
          fi
          echo "every render file had a browser"
