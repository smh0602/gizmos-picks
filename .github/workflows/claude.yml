# Lets Claude change this repository's CODE without a human uploading files.
#
# HOW IT WORKS: comment "@claude <what you want>" on any issue or pull
# request in this repo. This workflow wakes up, Claude reads the repo,
# makes the change, and pushes it. From a phone, from anywhere.
#
# WHAT IT DOES NOT CHANGE: the collector. collect.py, card.py and the
# schedules in collect.yml already run unattended and are untouched by
# this file. This exists only so the CODE can be edited without a laptop.
#
# Only users with WRITE access to this repo can trigger it, and bot
# accounts are rejected outright. That check is the action's own, and it
# is what stops a stranger commenting "@claude delete everything".
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    # Don't start a runner for every comment in the repo -- only ones that
    # actually mention @claude.
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    # ⚠️ PINNED, NOT `ubuntu-latest` `[2026-09-24]`: GitHub moves -latest to
    # Ubuntu 26.04 from 2026-10-19. test_runner_image.py fails on a floating label.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ⚠️ PYTHON IS PINNED HERE, NOT TAKEN FROM THE IMAGE `[2026-09-24]`: the
      # agent runs the suite and verify_card.py, and the image's own `python`
      # is 3.12 on ubuntu-24.04 but 3.14 on ubuntu-26.04.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 🔬 EXPERIMENTAL, AND IT MAY SIMPLY NOT WORK — STATED RATHER
          #    THAN ASSUMED.
          #
          # The watchdog in `collect.yml` opens its issue with the default
          # `GITHUB_TOKEN`, so the actor is `github-actions[bot]`. The
          # action rejects bot actors unless they are named here, which is
          # the seam that would otherwise stop a detected fault from ever
          # reaching Claude.
          #
          # ⚠️ BUT THERE IS AN OPEN UPSTREAM BUG (anthropics/
          # claude-code-action#900): `checkHumanActor` calls the users API
          # BEFORE it consults `allowed_bots`, and that call 404s for a
          # bot account — so this line may be ignored entirely depending
          # on the action version. ⛔ It is added because it costs one
          # line and FAILS CLOSED (Claude simply does not respond), NOT
          # because it is known to work.
          #
          # ✅ THE ROUTE THAT DEFINITELY WORKS IS SAM REPLYING `@claude`
          #    TO THE WATCHDOG'S ISSUE FROM HIS PHONE. He has write
          #    access, which is exactly what this check is looking for.
          allowed_bots: "github-actions[bot]"
          # 🔴🔴 THE SAME DEFECT THAT MADE TIER 3 INCAPABLE FOR ITS
          # ENTIRE LIFE. `[found 2026-09-15 by checking the CLASS after
          # fixing the instance — ledger rule 275]`
          #
          # ⛔ Run #8 of `self-repair` logged `permission_denials_count: 3`
          # against `is_error: false`: the agent asked to do three things,
          # was denied all three, and reported SUCCESS. **This file had
          # the identical `claude_args` with no allowlist**, so every
          # `@claude` mention would have behaved the same way — spend
          # Sam's subscription, change nothing, look fine.
          #
          # ➡️ Sam's standing rule: *"everything we do for cfb we do for
          # nfl and vice versa."* The same applies to two agent
          # invocations with one defect between them.
          claude_args: |
            --max-turns 40
            --allowedTools Read,Glob,Grep,Write,Edit,Bash
