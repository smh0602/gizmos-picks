name: collect
# 🔴🔴 THE RUN SAYS WHICH CRON FIRED IT. `[added 2026-09-15 — ledger rule 271]`
# ⛔ WITHOUT THIS, TWO CRONS IN ONE HOUR ARE INDISTINGUISHABLE. The
# `ncaaf` 19:0x question sat open for six days for exactly this reason:
# `4 19 * * *` and `18 19 * * *` both land in the 19:00Z hour, GitHub
# delays both by 11-15 minutes, and NOTHING in the API says which run
# came from which cron. A commit message names the MODE, not the cron.
# ✅ `run-name:` is read back as `name` in `gh run list` — free, no
# commit, and it is recorded even when the run FAILS BEFORE COMMITTING
# or has nothing to commit, which a git-log trailer never would be.
run-name: ${{ github.event.schedule && format('collect [cron {0}]', github.event.schedule) || format('collect [{0}]', github.event_name) }}

# Times are UTC. The MLB slate runs roughly 16:00Z (noon ET) to 05:00Z.
#
# GitHub bills each job rounded UP to the nearest minute, so pull count
# matters as much as pull cost. The repo is public, so Actions minutes are
# free -- but the SCHEDULE is not unlimited in practice. This file ran 29
# cron entries and GitHub stopped firing every one of them for 21 hours on
# 2026-08-26/27 while manual dispatch kept working. Cause never confirmed
# from the repo side; the response was to stop asking the scheduler for so
# much. A mode is now a LIST, and one cron does a whole time block.
#
# 🔴 THE COUNT BELOW IS ASSERTED BY `test_cron_wiring.py`, NOT REMEMBERED.
# ~~the count is 16.~~ STRUCK 2026-09-11 -- IT WAS 16 WHEN IT WAS WRITTEN
# AND THE FILE GREW TO FORTY WITHOUT IT. The comment justifying the 29 ->
# 16 reduction was itself a claim about the schedule, and nobody measured
# it for two weeks (ledger rule 160, which was written about this exact
# failure shape in a DIFFERENT comment in this same file).
# ⛔ DO NOT HAND-EDIT THE NUMBER TO SILENCE A RED RUN. Count the entries,
#    and if forty is too many, cut crons -- that was the whole point of
#    the 8/26 reduction.
#
# CRON COUNT: 43
#
# Scheduled workflows on GitHub can be delayed several minutes under load.
# That is fine at 30-minute granularity; do not tighten this without
# checking both the credit budget and the Actions minutes budget.

on:
  schedule:
    # ══════════════════════════════════════════════════════════════════
    # SAM'S SCHEDULE — 2026-08-28. Times below are UTC; ET is UTC-4.
    # ══════════════════════════════════════════════════════════════════
    #   6:00am ET   Trends + Track Record   (grade last night's slate)
    #   7:00am ET   Odds + Player Props
    #  10:00am ET   Gizmo's Picks + Parlays
    #   4:00pm ET   Odds + Player Props
    #   News        unchanged, 3x daily
    #   Scores      live in the browser, 45s, free
    #
    # 🔴 THESE CRONS ARE NOT WHAT MAKES THOSE TIMES HAPPEN, AND THAT IS
    # THE POINT. `[measured 2026-08-28 from this repo's commit log]`
    # GitHub dropped 19 of 21 daily runs on 8/27 and 17 of 21 on 8/26. A
    # cron AT 7am is a cron that sometimes does not fire, which is the
    # failure this whole design replaces.
    #
    # ✅ What makes the times happen: each artifact declares a DUE TIME
    # in `freshness.py`, and every run -- whichever cron fired, or a push
    # -- builds whatever is past due. The crons below are just chances to
    # land. Miss one and the next run catches up; the page says it was
    # late; nothing is ever skipped.
    #
    # ⚠️ Minutes off :00 -- the most congested slot on GitHub's scheduler.
    # Each fires a few minutes AFTER its deadline so the deadline has
    # actually passed when the run surveys.
    - cron: "4 10 * * *"     #  6:04am ET — grading
    - cron: "4 11 * * *"     #  7:04am ET — odds + props (full, both regions)
    - cron: "4 14 * * *"     # 10:04am ET — the card
    - cron: "4 20 * * *"     #  4:04pm ET — odds + props (Hard Rock)
    - cron: "5 13,19,1 * * *" # news, unchanged

    # ══ THE BACKSTOP ══
    # Every 3 hours. If one of the four above is dropped, this lands and
    # builds whatever is overdue. Combined with the heartbeat loop (a
    # landed run converges every 15 min for ~5 hours), the schedule has
    # to fail repeatedly and consecutively before a deadline is missed by
    # more than an hour.
    - cron: "9 */3 * * *"

    # ══ FOOTBALL ══
    # 🔴 ZERO football odds have ever been collected. These are the first.
    # ⚠️ Props bill PER GAME, so CFB runs the Power 4 gate in collect.py --
    # an unfiltered NCAAF Saturday is ~70 events and ~700 credits.
    # 💰 Priced before shipping, at ~25 P4 games and 16 NFL games:
    #    CFB Sat props  5 x 2 x 25 = 250   ·  NFL Sun props 6 x 2 x 16 = 192
    #    gamelines 6 per call, flat -- 4 calls a day is 24.
    #    MLB currently runs 240-317/day against a 600 cap.
    # ⛔ ONE props pull per game day to start. A second would put a
    # Saturday at ~740 and over the cap.
    # ⛔ ~~THE FIVE ENTRIES THAT USED TO LIVE HERE~~ REMOVED 2026-09-04.
    # `20 15 * * 6` CFB props+lines · `20 */6 * * 4,5,6` CFB line movement
    # `25 15 * * 0` NFL props+lines · `25 22 * * 4` TNF
    # `25 */6 * * 0,1,4` NFL line movement
    # 🔴 NOT ONE OF THEM HAD A ROUTING ARM, so every one fell through to
    # `*) LEAGUE=mlb` and **collected BASEBALL under a football comment.**
    # The two `*/6` entries alone fired four times a day on three days
    # each -- roughly 24 MLB runs a week that nobody asked for, each one
    # cancelling the heartbeat loop it landed on top of.
    # ✅ Every job they claimed to do is in Sam's schedule below, routed:
    # college props Tue-Sat twice daily, NFL props twice daily, and odds
    # twice a day for both leagues.

    # ══ THE WEEK-BY-WEEK TRENDS REFRESH ══
    # 🔴 NOTHING REBUILT THE CURRENT SEASON. The back-fill only ever ran
    # by hand, so the trends board would have frozen on 2025 while 2026
    # was being played. Sam, 2026-09-01: "when these games start week by
    # week, day by day we need to be updating the trends tab showing
    # accurate stats on a week by week basis."
    # ⚠️ TIMED AFTER THE SLATE IS FINAL, not during it -- college plays
    # into Saturday night, the NFL into Monday night.
    # 💰 FREE. Both back-fills read published stat files, not the odds API.
    - cron: "35 14 * * 0"       # Sun 10:35am ET — rebuild CFB, after Saturday
    # 🔴 SCORES, ON THE DAY THE SPORT IS PLAYED.
    # `[measured 2026-09-05, the first Saturday of the season]` the college
    # Scores tab showed 76 FBS games with NO SCORE AT ALL, including games
    # that finished the night before -- because the scores live in the
    # schedule file and the schedule rode this SUNDAY rebuild. `cfb.py`
    # said so in as many words: "NO NEW CRON -- rides the Sunday rebuild
    # that already runs." ⛔ That decision is the defect: a weekly refresh
    # means the Scores tab is wrong for the whole day college football
    # actually happens.
    # 💰 FREE -- CFBD, never the Odds API -- and `fb-scores` rebuilds ONLY
    # the current season's schedule, never the back-fill.
    # ⚠️ Saturday's late games run past midnight UTC, so Sunday morning is
    # covered too. The weekly rebuild above is unchanged.
    # 🔴🔴 A DAILY PASS, BECAUSE THE GAME-DAY CRONS BELOW ARE WEEKEND-SHAPED
    # AND THE SPORT IS NOT. `[measured 2026-09-08]` the college schedule
    # file had not been rebuilt since 2026-09-06 16:50Z — TWO DAYS — and
    # the Scores tab showed 6 games on 9/6 and 1 on 9/7 with NO SCORE.
    # ⛔ Every `fb-scores` cron below is Sat/Sun/Mon/Thu-shaped, and the
    # `scores` deadline it answers to was Sat 21:30 + Sun 09:30 ONLY — so
    # a Tuesday or Wednesday slate had no deadline, converge saw nothing
    # stale, and every verifier went green on a two-day-old tab.
    # ⚠️ COLLEGE PLAYS 304 GAMES OFF SATURDAY (Mon 1 · Tue 19 · Wed 15 ·
    # Thu 143 · Fri 116 · Sun 10) and the NFL 44 off Sunday. Rule 137.
    # ✅ 4:04am ET every day: after even a Hawai'i 11:59pm ET kickoff has
    # finished (measured — it ends ~3:29am), and before the 7:02am odds
    # pull, the 8:30am props and the 9:00am card all read it.
    - cron: "4 8 * * *"         # BOTH  4:04am ET  Scores       (daily)
    - cron: "40 */2 * * 6"      # CFB every 2h Saturday   — scores
    - cron: "40 1,3,5,13 * * 0" # CFB Sat night + Sun am  — scores
    # 🔴 THE SAME GAP IN THE NFL, arriving on Sunday: its schedule rides
    # the TUESDAY rebuild, so a Sunday slate would sit scoreless for two
    # days. ⚠️ NFL plays Thu, Sun and Mon.
    - cron: "45 */2 * * 0"      # NFL every 2h Sunday     — scores
    - cron: "45 1,3,5 * * 1"    # NFL Sun night           — scores
    - cron: "45 1,3,23 * * 2"   # NFL Mon night + MNF     — scores
    - cron: "45 1,3,23 * * 5"   # NFL Thu night           — scores
    # ══ THE LIVE PROBE — ON A SCHEDULE, BECAUSE ASKING SAM TO RUN IT WAS
    #    THE WRONG ANSWER TWICE ══
    # 🔴 SAM, 2026-09-06: *"i shouldnt have to do manual runs... the only
    # manual uploads i should be doing is setting up recurring actions."*
    # ⛔ He is right, and the first two dispatches were mine to schedule.
    # ⚠️ THE TIMES ARE THE WHOLE POINT: a probe that runs when nothing is
    # in progress CORRECTLY REFUSES to answer, and answers nothing twice
    # a week. These fire while the ball is actually in the air.
    # 💰 FREE. ESPN's public scoreboard, no key, no quota. It writes
    # `data/<lg>/latest/live-probe.json` and touches nothing else.
    - cron: "50 16 * * 6"       # CFB Sat 12:50pm ET — the noon window
    - cron: "50 20 * * 6"       # CFB Sat  4:50pm ET — the biggest slate
    - cron: "50 0 * * 0"        # CFB Sat  8:50pm ET — the night games
    - cron: "50 17 * * 0"       # NFL Sun  1:50pm ET — the early window
    - cron: "50 20 * * 0"       # NFL Sun  4:50pm ET — the late window
    - cron: "50 1 * * 2"        # NFL Mon  9:50pm ET — MNF
    - cron: "50 1 * * 5"        # NFL Thu  9:50pm ET — TNF
    # ⛔ ~~`35 15 * * 2` Tue 11:35am ET rebuild NFL~~ REMOVED 2026-09-04:
    # unrouted, so it ran MLB. The NFL rebuild is `6 16 * * 2` below,
    # which IS routed and carries SEASON=CUR.

    # ══ FOOTBALL — SAM'S SCHEDULE, 2026-09-04. HIS TIMES ARE ET. ══
    # ⚠️ Minutes are nudged off :00/:30 -- the most congested slots on
    # GitHub's scheduler, where runs get dropped. THE HOUR IS HIS.
    # 🔴 THESE MUST STAY IN STEP WITH `FB_TIMES` IN `freshness.py`.
    # A contract that disagrees with the schedule reports lateness no run
    # can clear, and a banner nobody can fix is a banner everybody
    # ignores. ⛔ Change one, change the other.
    # ── COLLEGE ──────────────────────────────────────────────────────
    # 🔴 `4 11 * * *` WAS ALSO MLB's 7:04am ODDS+PROPS CRON. GitHub fires
    # one event per cron STRING, and the case block below matches the
    # FIRST arm -- so the college arm won and **MLB's 7am paid pull simply
    # stopped happening.** Only converge and the 3-hourly backstop were
    # repairing it. Moved to :02. ⛔ NEVER REUSE A CRON STRING ACROSS
    # LEAGUES; `test_cron_wiring.py` now refuses one.
    - cron: "2 11 * * *"        # CFB  7:02am ET  Odds
    - cron: "4 19 * * *"        # CFB  3:00pm ET  Odds
    # 🔴 EVERY DAY, NOT Tue-Sat. `[2026-09-06]` The old `2-6` set left
    # SUNDAY AND MONDAY with no props pull and no card build — so on a
    # Sunday with a real slate the board went 22 hours old, the card still
    # showed Saturday's games, and NOTHING WENT RED, because the contract
    # had no Sunday deadline to miss.
    # 💰 The cost scales with the slate (markets x regions x GAMES), and a
    # day with no game inside the window buys nothing at all.
    - cron: "34 12 * * *"       # CFB  8:30am ET  Player Props (daily)
    # 🔴🔴 ~~"6 19 * * *"~~ MOVED TO :26 ON 2026-09-14, AND THE REASON IS
    #    MEASURED, NOT STYLISTIC. `[7 days, 1,029 collector commits]` This
    #    cron and the Odds cron at `4 19` are TWO MINUTES APART and the
    #    18:00-21:00Z band produced **exactly ONE `collect[ncaaf]` run per
    #    day, 7 days out of 7** — 19:16, 19:19, 19:17, 19:15, 19:16,
    #    19:15, 19:15. Every run commits `freshness.json`, so one commit
    #    is one run: **one of the two arms was dropped every single day.**
    # ⚠️ IT WAS INVISIBLE, AND THAT IS THE WORSE HALF. Converge rebuilds
    #    whatever is overdue, so whichever arm landed repaired BOTH modes
    #    and nothing on the page ever revealed it. ⛔ A cron that never
    #    fires and costs nothing observable is a cron nobody will ever
    #    find by looking at the product.
    # ⛔ WHICH OF THE TWO DIED COULD NOT BE DETERMINED from the repo —
    #    both are `LEAGUE=ncaaf`, both land inside the measured lag band
    #    (p50 12.3 min, p90 16.6), and at 19:0x both modes are past due.
    #    **Recorded as unresolved rather than guessed**, and fixed by
    #    separating them, which works whichever one it was.
    # ⚠️ 14 MINUTES, AND THE CEILING IS NOT MINE TO CHOOSE. My first
    #    attempt used :26 — 22 minutes, to clear the measured lag spread
    #    (7.5 to 22.7 min) — and `test_fb_freshness.py` went red: the
    #    props deadline is 15:00 ET and rule 112 requires a build within
    #    TWENTY minutes of every deadline, or it is a deadline nothing
    #    can meet. ⛔ The contract wins; the separation fits inside it.
    # ✅ 14 minutes still clears the measured p50 lag of 12.3 min, so the
    #    two runs arrive distinguishably apart rather than in the same
    #    minute. 3:18pm ET satisfies Sam's "3pm" props slot, and the
    #    morning pull (8:30am) is untouched.
    - cron: "18 19 * * *"       # CFB  3:18pm ET  Player Props (daily)
    - cron: "4 13 * * *"        # CFB  9:00am ET  Gizmo's Picks (daily)
    - cron: "34 13 * * *"       # CFB  9:30am ET  Parlays       (daily)
    - cron: "4 12 * * 2"        # CFB  8:00am ET  Track Record  (Tue)
    # ⚠️ TRENDS DAILY FOR COLLEGE. It was Monday-only by Sam's own
    # schedule and it was not broken — but CFBD publishes daily and the
    # rebuild is free, so there is no reason for the tab to be six days
    # stale. ⛔ NFL stays weekly: nflverse publishes weekly, so a daily
    # NFL deadline would be one nothing could satisfy (rule 112).
    # 🔴 3:00am ET, NOT NOON. Sam, 2026-09-06: *"i want the trends tab to
    # updated everyday for college football at 3am — late enough to
    # updates games from the previous day and early enough to provide
    # stats for the next day."*
    # ⛔ THE OLD NOON CRON (16:04 UTC) IS DELETED, NOT COMMENTED OUT.
    # ⚠️ Deliberately not quoted here: `test_trends_schedule.py` asserts
    # the old cron is ABSENT by searching this file, so writing it into a
    # struck comment would fail a check that is right (rule: strip
    # comments, or do not write the string).
    # NOON WAS MINE AND IT WAS THE WRONG END OF THE DAY: it landed AFTER
    # the 8:30am props pull and the 9:00am card, so the morning board read
    # a table built the day before.
    - cron: "4 7 * * *"         # CFB  3:04am ET  Trends        (daily)
    # ══════════════════════════════════════════════════════════════════
    # 💰 THE ONLY PAID PROBE, AND IT IS SINGLE DIGITS. `[Sam, 2026-09-11:
    # "probe it"]` He asked for halftime team totals; the cost could not
    # be answered from the repo and the two candidate answers differ by
    # ELEVEN TIMES (bulk endpoint ~+480/month, per-event ~+1,160 measured
    # and +12,720 at the ceiling).
    # ⛔ 2 credits for the bulk ask, 2 more ONLY if that comes back empty.
    # ⚠️ ONE CRON PER LEAGUE, NEVER A DUAL-LEAGUE ARM: `test_multileague.py`
    # FAILS on a paid mode routed to two leagues, because the per-league
    # cost would be counted once. That guard exists and this obeys it.
    # ⚠️ TIMED WHEN THE BOARD IS LIVE. A halftime market absent at 3am is
    # evidence about 3am; asked while a slate is up, an empty answer means
    # something. ⛔ And it is a CRON, never a hand-dispatch (rule 125).
    - cron: "12 16 * * 6"       # CFB  Sat 12:12pm ET  Halftime probe
    - cron: "12 16 * * 0"       # NFL  Sun 12:12pm ET  Halftime probe
    # 🔴 NEWS EVERY HOUR. `[Sam: "news should be updating every hour i see
    # that it is 5 hours old, unacceptable"]` ⛔ With one 8am deadline a
    # five-hour-old file was INSIDE contract, so nothing was wrong
    # anywhere and the tab was still stale. It is free.
    # ⚠️ ONE CRON, BOTH LEAGUES — the dual-league routing means this is a
    # single run an hour, not two.
    - cron: "20 * * * *"        # BOTH  news, hourly
    - cron: "6 12 * * *"        # CFB  8:00am ET  News + card
    # (the Sunday rebuild is the `35 14 * * 0` entry in the block above --
    #  it was listed twice, which is one event and one wasted line)
    # ── NFL ──────────────────────────────────────────────────────────
    # 🔴 ~~"shared minute is fine: one cron, one league"~~ THAT COMMENT WAS
    # WRONG AND IT WAS MINE. `6 12 * * *` was ALSO the CFB 8am news cron,
    # and the college arm matched first, so **the NFL 8am odds pull never
    # ran once.** One cron string is one event, whatever the comments say.
    - cron: "7 12 * * *"        # NFL  8:07am ET  Odds
    - cron: "6 18 * * *"        # NFL  2:00pm ET  Odds
    # 🔴 ~~THE LONDON GAMES. Six 2026 NFL games kick off at 5:30am ET on a
    # Sunday, before the first pull of the day, so they are never priced.
    # the entry was `8 8 * * 0`, NFL 4:08am ET Player Props, Sundays~~
    # ⚠️ Written WITHOUT the `- cron:` prefix on purpose: every tool
    # here finds crons by regex, and a struck one that still matches
    # is counted as live. It was, for one run, and read 33 of 32.
    # ⛔ **STRUCK 2026-09-04, THE SAME DAY IT WAS ADDED. THE GAP WAS MINE,
    # NOT THE SCHEDULE'S.** `test_props_window.py` stamped `tzinfo=utc` on
    # both leagues' kickoffs -- right for college, whose CFBD `startDate`
    # really is UTC, and **four hours wrong for the NFL**, whose nflverse
    # `start` is a LOCAL EASTERN wall clock with no zone.
    # ⚠️ THE LONDON GAMES KICK AT 9:30am ET, NOT 5:30am, and the ordinary
    # Sunday 7:08am pull reaches them with 2.4 hours to spare. Re-measured
    # with the times parsed correctly: **272/272 = 100% WITHOUT this
    # cron.** It bought nothing and cost a pull every Sunday.
    # ✅ The parsing now lives in `freshness.kickoffs_utc`, one function
    # for the contract and the check, so they cannot disagree again.
    - cron: "8 11 * * *"        # NFL  7:00am ET  Player Props
    - cron: "8 15 * * *"        # NFL 11:00am ET  Player Props
    - cron: "34 11 * * *"       # NFL  7:30am ET  Gizmo's Picks
    - cron: "34 15 * * *"       # NFL 11:30am ET  Gizmo's Picks
    - cron: "6 13 * * *"        # NFL  9:00am ET  Parlays
    - cron: "6 16 * * 2"        # NFL 12:00pm ET  Trends + Track Record (Tue)
    # ══════════════════════════════════════════════════════════════════
    # 🔴 AND A DAILY ONE ALONGSIDE IT. `[measured 2026-09-12]` `cfb-probe`
    # rebuilds the college trends table DAILY at 3:04am ET and `nfl-logs`
    # rebuilt the NFL one ONCE A WEEK, so IDENTICAL BUILDER CODE reached
    # the two tables up to SIX DAYS APART. Sam's standing rule is that
    # everything done for CFB is done for NFL; that had been true of the
    # code and false of the schedule (ledger rule 224).
    #   ⛔ The visible cost of the gap: `total_yds` shipped in both
    #      builders and appeared on the college picker the next morning.
    #      The NFL picker was still missing it — and `total_td` — four
    #      days later.
    # 💰 FREE. nflverse publishes flat files on GitHub: no key, no
    #    credits. `budget.py` prices `nfl-logs` at zero and still does.
    # ⛔ THE TUESDAY CRON STAYS. This ADDS chances to land; it does not
    #    move the one the freshness deadline is anchored to.
    # ⛔ AND THE CONTRACT IS UNTOUCHED. `freshness.py` keeps the NFL
    #    trends deadline at Tue 12:00 ET, because nflverse publishes
    #    weekly and a DAILY DEADLINE would be one nothing could satisfy
    #    (rule 112). A cron is a chance to land; a deadline is a promise.
    #    Running more often cannot make anything late.
    # ⚠️ A run on a day the source has nothing new is not wasted and not
    #    an error: `nfl-logs` reports `not yet` per season and exits 0.
    - cron: "14 7 * * *"        # NFL  3:14am ET  Trends (daily)
    - cron: "8 12 * * *"        # NFL  8:00am ET  News

  push:
    branches: [main]
    # 🔴 ~~AN ALLOW-LIST OF SEVEN FILES~~ REPLACED 2026-09-04 WITH AN
    # IGNORE-LIST, BECAUSE THE ALLOW-LIST WAS SILENTLY WRONG FOR MOST OF
    # THE REPO. `[measured]` **30 of the 35 code and test files at the
    # root triggered NOTHING** -- among them `card_fb.py` (the entire
    # football board), `cfb.py`, `nfl.py`, `verify_board.py`,
    # `verify_record.py`, `card_gate.py`, and **every single test file.**
    # ⛔ SO A TEST-ONLY UPLOAD GOT NO CI AT ALL. `test_cron_wiring.py` was
    # pushed and no run started -- not green, not red, nothing -- which is
    # rule 67 in a new costume: a test that never runs is worse than no
    # test, and here it was the CI trigger rather than the test list that
    # skipped it. A `card_fb.py` fix landed the same way and the live
    # college board did not rebuild.
    # ⚠️ AN ALLOW-LIST HAS TO BE EDITED EVERY TIME A FILE IS ADDED, AND
    # NOBODY EVER DOES. An ignore-list is right by default and only has to
    # name the things that must NOT trigger.
    # ⛔ `data/**` AND `picks/**` ARE THE LOOP GUARD: the collector commits
    # to exactly those two directories and nothing else, so its own
    # commits cannot retrigger the workflow. Do not remove them.
    # ✅ A side benefit that matters: editing `card-accepted.txt` now
    # starts a run immediately, so a decision recorded there takes effect
    # at once instead of waiting for the next cron.
    paths-ignore:
      - "data/**"
      - "picks/**"
      - "**.md"

  workflow_dispatch:
    inputs:
      season:
        # 🔴 ~~default: "2025"~~ STRUCK 2026-09-06 — A STALE CONSTANT, and
        # Sam is the one who spotted it ("why would we workflow run for
        # 2025"). It was right while the 2026 NFL season had 272 games
        # and ZERO finals, so anything derived from finished games could
        # only be measured against 2025. ⛔ After week 1 it becomes
        # SILENTLY WRONG: a hand-run `nfl-logs` left on the default would
        # rebuild LAST season's logs and succeed.
        # ✅ `CUR` is resolved on the runner, the same way every routed
        # cron already does it -- a football season is named for the year
        # it STARTS, so anything before August belongs to the previous
        # year. A date written into a form goes stale in January and
        # nothing announces it.
        description: "season year, for nfl-logs (CUR = this season)"
        required: false
        default: "CUR"
      league:
        description: "mlb | nfl | ncaaf"
        required: false
        default: mlb
      mode:
        # ⚠️ LEAVE THIS AS `converge` unless you know why you are changing
        # it. `converge` builds everything past its deadline, which is
        # almost always what a hand-run is for. Naming a single mode still
        # converges the rest as well -- add `converge-off` after it to run
        # that one mode ALONE (used for nfl-logs).
        description: "converge (default — build everything overdue) | or: card | record | gamelines | props-pitcher | props-batter | results | pitchers | hitters | lineups | news | news-probe | card-fb | fb-scores | fb-record | live-probe | nfl-logs converge-off"
        required: true
        default: converge

# One queue PER MODE, not one queue for everything.
# ⚠️ GitHub keeps a single pending run per concurrency group and CANCELS
# older pending ones. With a shared group, running three jobs by hand
# silently killed whatever scheduled pull was waiting behind them --
# which is the other half of why the board went stale.
# 🔴 ONE GROUP PER LEAGUE, AND THE NEWEST RUN WINS.
# The heartbeat loop holds a job open for hours, so the old per-schedule
# group would queue every later cron behind it and GitHub would cancel
# the pending ones anyway. cancel-in-progress means a freshly landed run
# REPLACES the loop that is already holding the line -- which is exactly
# what you want, because the new one starts by converging too.
# 🔴 ~~`group: collect-${{ github.event.inputs.league || 'mlb' }}`~~ STRUCK
# 2026-09-04. **`github.event.inputs` EXISTS ONLY ON `workflow_dispatch`.**
# On every SCHEDULED run it is empty, so the group was `collect-mlb` for
# ALL of them -- MLB and football alike -- and `cancel-in-progress` meant
# **any cron could kill a football pull mid-flight.** The comment above
# said "ONE GROUP PER LEAGUE"; the expression could not deliver it,
# because the league is decided in a later STEP from
# `github.event.schedule`, not from an input.
# ⛔ THAT ONLY BECAME EXPENSIVE TODAY: football runs now converge, so they
# SPEND, and a cancelled run can lose a pull that was already paid for.
# ✅ THE RULE NOW: MLB's own crons and every push share `collect-mlb`, so
# the heartbeat loop is still replaced by the newest run. **Every other
# scheduled run -- all of football -- gets a group of its own and is
# never cancelled by anything.**
# ⚠️ THE LIST BELOW IS MLB'S CRONS, WHICH ARE EXACTLY THE ONES WITH NO
# ROUTING ARM (they fall through to `*) LEAGUE=mlb`). `test_cron_wiring.py`
# asserts the two sets are identical, so this cannot drift.
concurrency:
  group: collect-${{ github.event.inputs.league || (github.event.schedule && !contains(fromJSON('["4 10 * * *","4 11 * * *","4 14 * * *","4 20 * * *","5 13,19,1 * * *","9 */3 * * *"]'), github.event.schedule) && github.event.schedule) || 'mlb' }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # ⚠️ Under GitHub's 6-hour ceiling with room to spare. The loop stops
    # itself at LOOP_MINUTES; this is the backstop if it ever does not.
    timeout-minutes: 350
    permissions:
      contents: write
      # 📣 THE WATCHDOG OPENS, UPDATES AND CLOSES ONE ISSUE. ⛔ Without
      # this the alert half is silently a no-op — `gh issue create` fails
      # with 403 and `continue-on-error` swallows it, which would be a
      # watchdog that looks installed and tells nobody anything.
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ══════════════════════════════════════════════════════════════
      # THE TESTS RUN HERE, BEFORE ANY CREDIT IS SPENT
      # ══════════════════════════════════════════════════════════════
      # 🔴 A TEST SUITE THAT LIVES ON SAM'S LAPTOP IS A TEST SUITE THAT
      # NEVER RUNS. Both of these have already caught real defects --
      # the nightly phantom props pull at the UTC day boundary, and a
      # deleted `push:` trigger that would have made every upload silent.
      # Neither would have been caught by a human reading the diff.
      #
      # ⛔ ON A PUSH THIS BLOCKS. Someone just changed code; if the
      # freshness logic is broken, the plan it produces is not to be
      # trusted with money, so nothing is collected.
      # ✅ ON A SCHEDULE IT DOES NOT BLOCK. The data still needs to
      # arrive, and a failing test must not take the site down with it --
      # the failure is recorded and turns the run red at the end.
      - name: Tests
        id: tests
        continue-on-error: ${{ github.event_name != 'push' }}
        run: |
          # 🔴 THIS STEP NAMED ONE TEST FILE AND THE REPO HELD SIX.
          # `[measured 2026-09-01]` test_cfb.py, test_p4.py,
          # test_regions.py and test_board_match.js were all in the repo,
          # all passing, and NONE of them had ever gated anything. They
          # were written to protect the Power 4 name matcher, the props
          # region pricing and the CFB parsers -- three of the places
          # this project has actually been burned.
          # ⛔ A TEST THAT NEVER RUNS IS WORSE THAN NO TEST: it is a
          # false sense of cover, and it rots silently.
          # ✅ So DISCOVER them. Same rule as budget.py -- never put a
          # list anywhere you cannot auto-update. A new test_*.py is
          # picked up by existing here, with no workflow edit.
          rc=0
          found=0
          # 🔴 THE FAILING NAMES ARE RECORDED, NOT ONLY ANNOTATED.
          # `::error::` reaches the run page and nowhere else, and the run
          # page is the thing nobody is watching at 3am. The names go into
          # an output so "Tell Sam the tests are failing" can put them in
          # an ISSUE, which emails. `[added after test_board_match.js went
          # red on 47 consecutive runs and the only alarm was Sam
          # happening to look — ledger rule 261]`
          failed=""
          # 🔴🔴 EVERY FILE GETS A CLOCK, AND A TIMEOUT IS ITS OWN VERDICT.
          # `[added 2026-09-15 — ledger rule 272]`
          # ⛔ THIS LOOP HAD NO TIMEOUT AND THE JOB'S IS **350 MINUTES**.
          # One hanging file would have burned nearly six hours of runner
          # time and been CANCELLED — no `::error::`, no name in
          # `failed=`, nothing in the issue. The one failure mode that
          # produces no evidence at all.
          # ⚠️ AND IT ALREADY MISLED ME. I recorded that two files "hang
          # because the proxy blocks ESPN and CollegeFootballData" —
          # **both claims were false.** Measured 2026-09-15: all 71 files
          # pass in 308s total; `test_box_live.py` simply takes 115s and
          # I had been killing it at 45. ⛔ A timeout I chose is not a
          # fact about the code, and "it hung" is not a diagnosis.
          # ✅ 600s = 5.2x the slowest measured file. Generous on purpose:
          # CLAUDE.md — a guard that fires on correct code is the other
          # failure, not a safe one.
          PER_FILE=600
          # 🔴🔴 ONE FILE NEEDS A DIFFERENT CLOCK, AND THE CLOCK WAS THE
          #    THING ASKING THE WRONG QUESTION — NOT THE CHECK.
          # `[measured 2026-09-19, isolated]` `test_vacuity.py` applies
          # 141 declared mutations, runs the declaring test under each,
          # and restores the tree: **18m16s, exit 0, 40 of 40 checks**.
          # Against a 600s clock it can only ever be killed, and it has
          # been — `collect.yml` has not had a green run since
          # 2026-09-17T23:27 and this one line is why.
          # ⛔ THE 600 WAS NOT WRONG WHEN IT WAS WRITTEN. The comment
          #    above derives it as "5.2x the slowest measured file", and
          #    the slowest file then was `test_box_live.py` at 115s. A
          #    sweep is not that shape. `CLAUDE.md`: a check may change
          #    when it asks the WRONG QUESTION — and "did this finish
          #    inside 5x the slowest UNIT test" is the wrong question to
          #    ask a mutation sweep.
          # ⛔ THE SWEEP ITSELF IS UNTOUCHED — not shortened, not
          #    sampled, not skipped. 2400s is 2.2x its measured cost,
          #    the same margin 600 gave the file it was fitted to.
          # ⚠️ AND NO BUDGET MAY BE LOWERED. `test_suite_clock.py` drives
          #    this function and fails if any file's clock drops below
          #    the default, so this cannot become a way to let a slow
          #    file off.
          budget_for() {   # $1 = file
            case "$1" in
              test_vacuity.py) echo 2400 ;;
              *)               echo "$PER_FILE" ;;
            esac
          }
          run_one() {   # $1 = runner, $2 = file
            local s=$(date +%s) trc=0 lim
            lim=$(budget_for "$2")
            timeout -k 15 "$lim" "$1" "$2" || trc=$?
            local d=$(( $(date +%s) - s ))
            if [ "$trc" = "124" ] || [ "$trc" = "137" ]; then
              # 🔴 "NEVER ANSWERED" IS NOT "FAILED". A red assertion tells
              # you what is wrong; a timeout tells you only that nothing
              # came back, and conflating them sends the reader hunting
              # for a bug that may not exist.
              rc=1; failed="$failed $2(TIMEOUT)"
              echo "::error::$2 TIMED OUT after ${lim}s — it did not fail, it never answered"
            elif [ "$trc" != "0" ]; then
              rc=1; failed="$failed $2"
              echo "::error::$2 FAILED"
            fi
            echo "   ${d}s"
          }
          for t in test_*.py; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "── $t"
            run_one python "$t"
          done
          for t in test_*.js; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "── $t"
            run_one node "$t"
          done
          echo "ran $found test file(s)"
          echo "failed=$(echo $failed | tr ' ' ',')" >> "$GITHUB_OUTPUT"
          # ⚠️ ZERO TEST FILES IS A FAILURE, NOT A PASS. A glob that
          # matches nothing is exactly how a suite disappears unnoticed.
          if [ "$found" -lt 4 ]; then
            echo "::error::only $found test file(s) found — the suite has shrunk"
            rc=1
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 THE TESTS MUST NOT HAVE MODIFIED THE TREE.
      # ══════════════════════════════════════════════════════════════
      # ⛔ NO CONDITION ON THIS STEP, DELIBERATELY. The Tests step is
      # `continue-on-error`, so this is reached whether the suite passed
      # or failed — and `if: always()` would be WRONG here, because a red
      # test on a CLEAN tree must still let the collector run. That is
      # the existing deliberate design and this does not change it.
      # ⛔ AND IT IS NOT `continue-on-error`. This is the one place in
      # this workflow where stopping is right: every step below writes to
      # `data/` and pushes.
      - name: The tests must not have modified the tree
        run: |
          # 🔴🔴 A TEST THAT REWRITES SOURCE AND IS KILLED LEAVES IT REWRITTEN.
          # `[measured 2026-09-18]` test_vacuity.py runs the real mutation
          # sweep; SIGTERM does not run its `finally`; the 600s timeout fires on
          # it every run. A kill at 90s left `cfb.py` modified, and every step
          # below this one builds and COMMITS data.
          # ⛔ `git add data/ picks/` does not protect against this — the
          # mutated .py is correctly not committed, and the WRONG DATA IT
          # PRODUCES is exactly what the allowlist permits.
          # ⛔ AND DO NOT "CLEAN UP" WITH `git checkout -- .` AND CARRY ON.
          # A tree a test rewrote is a tree whose test RESULT is also
          # suspect, and silently reverting is how the evidence disappears.
          # ✅ Fail here, before a single converge pass, and name the files.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test step modified the working tree — refusing to collect"
            git status --porcelain
            git diff | head -200
            exit 1
          fi
          echo "tree clean after tests"

      - name: Decide what this run collects
        id: mode
        run: |
          # 🔴 THERE IS NO LONGER A SCHEDULE-TO-MODE TABLE, AND ITS
          # ABSENCE IS THE FIX. That table was the cron-owns-artifact
          # design: every entry claimed one job, so a dropped entry meant
          # a permanently missing file. `converge` asks the CONTRACT what
          # is late instead of asking the clock what it is time for.
          # ══════════════════════════════════════════════════════════
          # 🔴 FOOTBALL RUNS ON ITS OWN CRONS. Until now every scheduled
          # run hardcoded `mlb`, so NOTHING has ever collected football.
          # ⛔ ZERO football odds have ever been pulled -- and odds
          # history cannot be bought back at any price (the T25 lesson),
          # so every weekend missed is gone permanently.
          #
          # ⚠️ THE DEFAULT IS `mlb` AND EVERY UNRECOGNISED SCHEDULE FALLS
          # THROUGH TO IT. That is deliberate and it is the safety
          # property: if this case block is wrong, or a cron string is
          # edited and no longer matches, the run behaves EXACTLY as it
          # does today. ⛔ A football routing bug must never be able to
          # stop MLB collecting.
          # ══════════════════════════════════════════════════════════
          LEAGUE="${{ github.event.inputs.league }}"
          MODES="${{ github.event.inputs.mode }}"
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$LEAGUE" ]; then
            case "${{ github.event.schedule }}" in
              # ── CFB ────────────────────────────────────────────────
              "2 11 * * *")       LEAGUE=ncaaf; MODES="gamelines" ;;
              "4 19 * * *")       LEAGUE=ncaaf; MODES="gamelines" ;;
              "34 12 * * *")      LEAGUE=ncaaf; MODES="props-player" ;;
              "18 19 * * *")      LEAGUE=ncaaf; MODES="props-player" ;;
              "4 13 * * *")       LEAGUE="ncaaf nfl"; MODES="card-fb" ;;
              "34 13 * * *")      LEAGUE="ncaaf nfl"; MODES="card-fb" ;;
              "4 12 * * 2")       LEAGUE="ncaaf nfl"; MODES="card-fb" ;;
              "4 7 * * *")        LEAGUE=ncaaf; MODES="cfb-probe";  SEASON=CUR ;;
              "12 16 * * 6")      LEAGUE=ncaaf; MODES="halftime-probe" ;;
              "12 16 * * 0")      LEAGUE=nfl;   MODES="halftime-probe" ;;
              # ⏱️ THE HOURLY NEWS RUN, BOTH LEAGUES IN ONE JOB.
              # ⚠️ `news` only; it must not drag a card build into every
              # hour of the day. The card has its own deadlines.
              "20 * * * *")       LEAGUE="ncaaf nfl"; MODES="news" ;;
              "6 12 * * *")       LEAGUE="ncaaf nfl"; MODES="news card-fb" ;;
              "35 14 * * 0")      LEAGUE=ncaaf; MODES="cfb-probe cfb-teams"; SEASON=CUR ;;
              "4 8 * * *")        LEAGUE="ncaaf nfl"; MODES="fb-scores" ;;
              "40 */2 * * 6")     LEAGUE="ncaaf nfl"; MODES="fb-scores" ;;
              "40 1,3,5,13 * * 0") LEAGUE="ncaaf nfl"; MODES="fb-scores" ;;
              "45 */2 * * 0")     LEAGUE="nfl ncaaf"; MODES="fb-scores" ;;
              "45 1,3,5 * * 1")   LEAGUE="nfl ncaaf"; MODES="fb-scores" ;;
              "45 1,3,23 * * 2")  LEAGUE="nfl ncaaf"; MODES="fb-scores" ;;
              "45 1,3,23 * * 5")  LEAGUE="nfl ncaaf"; MODES="fb-scores" ;;
              # ── THE LIVE PROBE, WHILE GAMES ARE ACTUALLY ON ────────
              # ⛔ EVERY ONE OF THESE NEEDS ITS ARM. Five football crons
              # once sat here with NO arm at all and fell through to
              # `*) LEAGUE=mlb` -- collecting BASEBALL under a football
              # comment, four times a day.
              # 🔴 BOTH LEAGUES ON EVERY ONE. Sam, 2026-09-06: *"if any of
              # these runs can be done for nfl and cfb its expected we do
              # that so we can kill two birds with one stone."*
              # ✅ IT IS FREE AND IT IS NOT PADDING: the probe answers
              # FOUR questions and only ONE of them -- does the feed carry
              # a moving clock -- needs that league to be playing. The
              # join and the COVERAGE COUNT are measurable on a slate of
              # scheduled games, so a Saturday run measures the NFL's join
              # too, and the probe SAYS "not answered" for live state
              # rather than pretending.
              # ⚠️ THE HOUR STILL BELONGS TO THE SPORT IT IS NAMED FOR --
              # that is which league will have something IN PROGRESS.
              "50 16 * * 6")      LEAGUE="ncaaf nfl"; MODES="live-probe" ;;
              "50 20 * * 6")      LEAGUE="ncaaf nfl"; MODES="live-probe" ;;
              "50 0 * * 0")       LEAGUE="ncaaf nfl"; MODES="live-probe" ;;
              "50 17 * * 0")      LEAGUE="nfl ncaaf"; MODES="live-probe" ;;
              "50 20 * * 0")      LEAGUE="nfl ncaaf"; MODES="live-probe" ;;
              "50 1 * * 2")       LEAGUE="nfl ncaaf"; MODES="live-probe" ;;
              "50 1 * * 5")       LEAGUE="nfl ncaaf"; MODES="live-probe" ;;
              # ── NFL ────────────────────────────────────────────────
              "7 12 * * *")       LEAGUE=nfl;   MODES="gamelines" ;;
              "6 18 * * *")       LEAGUE=nfl;   MODES="gamelines" ;;
              "8 11 * * *")       LEAGUE=nfl;   MODES="props-player" ;;
              "8 15 * * *")       LEAGUE=nfl;   MODES="props-player" ;;
              "34 11 * * *")      LEAGUE="nfl ncaaf"; MODES="card-fb" ;;
              "34 15 * * *")      LEAGUE="nfl ncaaf"; MODES="card-fb" ;;
              "6 13 * * *")       LEAGUE="nfl ncaaf"; MODES="card-fb" ;;
              "6 16 * * 2")       LEAGUE=nfl;   MODES="nfl-logs";  SEASON=CUR ;;
              "14 7 * * *")       LEAGUE=nfl;   MODES="nfl-logs";  SEASON=CUR ;;
              "8 12 * * *")       LEAGUE="nfl ncaaf"; MODES="news card-fb" ;;
              *)                  LEAGUE=mlb ;;
            esac
          fi
          # 🔴 `CUR` RESOLVES ON THE RUNNER, NOT IN A CRON STRING. A
          # season written into the schedule is a season that goes stale
          # in January and nothing announces it.
          # ⚠️ A football season is named for the year it STARTS, so
          # anything before August belongs to the previous year.
          # 🔴🔴 A FOOTBALL RUN WITH NO EXPLICIT SEASON MEANS *THIS*
          # SEASON, NOT A LITERAL 2025. `[found in production 2026-09-06,
          # run 534]` Only the arms that name a season-scoped mode set
          # `SEASON=CUR`; every other arm left it empty and the default
          # below handed the collector **2025**. That is fine until
          # CONVERGE repairs a season-scoped mode on one of those runs —
          # and that is exactly what happened: GitHub dropped the 16:04
          # college Trends cron (the one arm that DOES pass CUR), the
          # 18:20 hourly NEWS run converged `cfb-probe` to repair it, and
          # the back-fill ran against **2025**, failed its own opp_elo
          # guard, and left `allowed-by-position-2026.json.gz` untouched
          # and 153 minutes late. ⛔ THE RUN WOULD HAVE GONE RED EVERY
          # HOUR AND NEVER REPAIRED THE TAB.
          # ⚠️ SCOPED TO FOOTBALL ON PURPOSE. The "before August means the
          # previous year" rule is a FOOTBALL rule; MLB's season is named
          # for the year it ends in, so this must not silently redefine
          # MLB's default. MLB keeps exactly the behaviour it has.
          # ➡️ Ledger rule 112, in the workflow's own default: a date
          # written into a fallback goes stale and nothing announces it.
          if [ "$LEAGUE" != "mlb" ] && [ -z "$SEASON" ]; then SEASON=CUR; fi
          if [ "$SEASON" = "CUR" ]; then
            Y=$(date -u +%Y); M=$(date -u +%m)
            [ "$M" -lt 8 ] && Y=$((Y - 1))
            SEASON="$Y"
          fi
          echo "season=${SEASON:-2025}" >> "$GITHUB_OUTPUT"
          echo "league=${LEAGUE:-mlb}" >> "$GITHUB_OUTPUT"
          if [ "$LEAGUE" != "mlb" ] && [ -n "$MODES" ] \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            # 🔴 FOOTBALL CONVERGES NOW. ~~`converge-off`~~ REMOVED
            # 2026-09-04: it was right while football had no freshness
            # contract, and it outlived that by one day.
            # ⛔ WHAT IT COST, MEASURED THE DAY IT WAS FOUND: the college
            # card was built at 8:51am against a 9:00am deadline, GitHub
            # dropped BOTH 9am card crons, and nothing rebuilt it for the
            # rest of the day -- while the contract sat there correctly
            # reporting it 6.5 hours late. A contract nothing acts on is
            # a comment.
            # ⚠️ STILL NOT A HEARTBEAT: `loop_minutes=0`, so the job runs
            # ONE pass and exits. Holding a football job open for five
            # hours would let `cancel-in-progress` kill the MLB loop.
            # ✅ NO `converge` WORD IS APPENDED, because it would be a
            # second converge: `collect.py` already routes every explicit
            # mode through `converge(explicit=...)`, which runs the mode
            # the cron asked for AND repairs whatever else is past due.
            echo "mode=$MODES" >> "$GITHUB_OUTPUT"
            echo "loop_minutes=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'converge' }}" >> "$GITHUB_OUTPUT"
            # A hand-dispatched job is a one-shot: no heartbeat loop, so
            # a person debugging is not left with a 6-hour job running.
            echo "loop_minutes=0" >> "$GITHUB_OUTPUT"
          else
            echo "mode=converge" >> "$GITHUB_OUTPUT"
            # push -> one pass; schedule -> hold the line for 5.5 hours.
            if [ "${{ github.event_name }}" = "push" ]; then
              # One pass, no heartbeat: an upload brings the site current
              # immediately and then gets out of the way. The scheduled
              # runs hold the line afterwards.
              echo "loop_minutes=0" >> "$GITHUB_OUTPUT"
            else
              echo "loop_minutes=320" >> "$GITHUB_OUTPUT"
            fi
          fi

      # 🔴 THE MODE IS A LIST AND A FAILURE IS DEFERRED, NOT FATAL HERE.
      # A block runs several pulls. If the third one dies, the two that
      # already cost credits must still reach the repo -- so the loop
      # records the failure and the job is failed AFTER the commit step.
      # ⛔ Do not turn this back into a bare `python collect.py`. That
      # aborts the step, skips `Commit snapshots`, and throws away paid
      # data to report an error the run would have reported anyway.
      # ══════════════════════════════════════════════════════════════
      # THE HEARTBEAT LOOP
      # ══════════════════════════════════════════════════════════════
      # 🔴 ONE LANDED RUN NOW COVERS MOST OF A DAY. A scheduled job may
      # run for six hours, so instead of exiting after one pass it
      # converges, verifies, commits, sleeps, and converges again until
      # it nears the limit. That is what makes a dropped cron survivable:
      # the schedule has to drop ELEVEN OF TWELVE entries before the site
      # goes out of contract.
      #
      # ⛔ THE COMMIT IS INSIDE THE LOOP, NOT A LATER STEP. A six-hour job
      # that committed only at the end would publish nothing for six
      # hours and lose everything if the runner died.
      #
      # ⚠️ Concurrency (above) uses cancel-in-progress: the next cron that
      # lands REPLACES the loop still running rather than queueing behind
      # it. Newest run wins; no pile-up.
      - name: Converge and hold
        id: collect
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # 🔴🔴 nflverse PUBLISHES THROUGH api.github.com, AND WE WERE
          # ASKING IT ANONYMOUSLY. `[measured 2026-09-19]` every NFL
          # build had failed for 47 hours with
          # `HTTPError: HTTP Error 403: rate limit exceeded` — the
          # unauthenticated GitHub API limit is 60 requests an hour PER
          # IP, and a runner shares that IP. `players-2026.json.gz` held
          # week 1 while the schedule already recorded finals for weeks
          # 1 AND 2, and the NFL possession artifact had never been
          # written at all.
          # ✅ The built-in token raises it to 1,000/hour. NO NEW SECRET
          # — Actions injects this one. 💰 Zero credits: nflverse is
          # free, this only stops us being throttled off it.
          # ⛔ `nfl.py` sends it to api.github.com ONLY and strips it
          # across any redirect that leaves that host, because a release
          # ASSET redirects to objects.githubusercontent.com and urllib
          # re-sends headers. `test_nflverse_auth.py` drives a real
          # redirect and fails if the header survives it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🔴 `LEAGUES`, PLURAL, SINCE 2026-09-06. Sam: *"if any of these
          # runs can be done for nfl and cfb its expected we do that so we
          # can kill two birds with one stone."*
          # ⚠️ It is a SPACE-SEPARATED LIST and it is usually one word. A
          # single-league run behaves exactly as it did before this
          # change -- the loop below runs once and `LEAGUE` ends up
          # holding the same value it was given directly.
          LEAGUES: ${{ steps.mode.outputs.league }}
          SEASON: ${{ steps.mode.outputs.season }}
          MODES: ${{ steps.mode.outputs.mode }}
          LOOP_MINUTES: ${{ steps.mode.outputs.loop_minutes }}
        run: |
          set -o pipefail
          git config user.name  "gizmos-collector"
          git config user.email "collector@users.noreply.github.com"

          DEADLINE=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          PASS=0
          rc=0

          while : ; do
            PASS=$((PASS + 1))
            echo "::group::converge pass $PASS"

            pass_rc=0
            # ══════════════════════════════════════════════════════════
            # 🔴 EVERY LEAGUE THIS RUN WAS ROUTED FOR, IN ONE JOB.
            # ⚠️ ONE LEAGUE IS THE NORMAL CASE and is unchanged: the loop
            # runs once, `LEAGUE` is exported with the same value the job
            # used to receive directly, and every line after this behaves
            # exactly as it did before.
            # ⛔ A LEAGUE THAT FAILS MUST NOT SKIP THE NEXT ONE. Same
            # reason the mode loop does not abort: data already on disk --
            # possibly already PAID FOR -- has to reach the repo.
            # ⚠️ `export`, because `collect.py` and `verify_freshness.py`
            # both read the league from the ENVIRONMENT, not from argv.
            # ══════════════════════════════════════════════════════════
            for LG in $LEAGUES; do
              export LEAGUE="$LG"
              [ "$LEAGUES" = "$LG" ] || echo "── league: $LG ──"
              for m in $MODES; do
                # ⛔ NOT `python collect.py "$m" || exit`. A failing mode
                # must never abort the pass -- paid data already on disk
                # has to reach the repo. The failure is recorded and
                # reported.
                if ! python collect.py "$m"; then
                  pass_rc=1
                  rc=1
                  echo "::error::mode '$m' failed for $LG on pass $PASS"
                fi
              done
            done
            # ⚠️ THE NAME USED BELOW IS THE WHOLE LIST. The MLB-only block
            # tests it for EXACTLY `mlb`, so a multi-league football run
            # can never reach baseball's verifiers -- and MLB is never
            # routed alongside anything, so the guard is unchanged in
            # practice as well as in form.
            LEAGUE_NAME="$LEAGUES"

            # 🔴 MLB-ONLY, AND GUARDED ON THE LEAGUE, NOT THE MODE.
            # statsapi and all three verifiers are baseball.
            if [ "$LEAGUE_NAME" = "mlb" ]; then
              python collect.py schedule converge-off || true

              # 🔴 A CARD THAT FAILS ITS OWN CHECKS IS NOT PUBLISHED.
              # This is the one verifier that blocks the commit: a bad
              # card must never reach the page. If it fails, the card
              # file is reverted and everything else still commits.
              # 🔴 THE REASON IS WRITTEN INTO THE REPO, NOT JUST THE LOG.
              # On 2026-08-28 verify_card blocked the card and the only
              # record of WHY was inside an Actions log -- which nobody
              # outside the runner can read, and which GitHub eventually
              # deletes. ⛔ A diagnosis you cannot retrieve is a diagnosis
              # you do not have. The failing checks now land in a file
              # that gets committed with everything else.
              if ! python verify_card.py > /tmp/vc.txt 2>&1; then
                # ══════════════════════════════════════════════════════
                # 🔴 ~~THE CARD IS REVERTED EITHER WAY.~~ CHANGED
                # 2026-09-04, AND THE ARGUMENT IS THAT THE OLD RULE MADE
                # ACCEPTANCE WORTHLESS.
                # ⛔ WHAT IT PRODUCED: Sam looked at T37, decided the
                # contradiction was a mean-vs-frequency artifact with both
                # numbers correct, and wrote that down. The run went green
                # and **the card was still reverted on every rebuild, so
                # Gizmo's Picks stopped updating entirely.** Green build,
                # frozen product. The 48-hour grace in `freshness.py`
                # exists only to SHOUT about that state -- which is proof
                # the state should not be reachable in the first place.
                # ➡️ EITHER ACCEPTANCE PUBLISHES, OR ACCEPTANCE SHOULD NOT
                # EXIST. The middle was the worst of both.
                # ✅ THE SAFETY PROPERTY THAT REPLACES THE REVERT: an
                # accepted card publishes **and the page says what it is
                # carrying**, naming the check and Sam's own written
                # reason. ⛔ That is the difference between a caveated
                # card and a silently-wrong one, and it is the whole
                # justification for this change.
                # ⚠️ NOTHING ELSE IS RELAXED. A failure that is NOT on
                # `card-accepted.txt` still reverts the card and still
                # fails the run, exactly as before.
                # ══════════════════════════════════════════════════════
                cat /tmp/vc.txt
                mkdir -p data/latest
                {
                  echo "verify_card FAILED at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "pass $PASS of run ${GITHUB_RUN_NUMBER:-?}"
                  echo "--- the failing checks ---"
                  grep -E "FAIL|Traceback|Error|error:" /tmp/vc.txt | head -40
                  echo "--- last 60 lines ---"
                  tail -60 /tmp/vc.txt
                } > data/latest/card-verify-failure.txt
                if python card_gate.py /tmp/vc.txt; then
                  # ✅ EVERY failing check is one Sam has signed off.
                  echo "::warning::verify_card failed on pass $PASS, and every"
                  echo "::warning::failing check is ACCEPTED -- the card is"
                  echo "::warning::PUBLISHED and the page states the caveat."
                  echo "accepted" > data/latest/card-accepted-now.txt
                else
                  rc=1
                  echo "::error::verify_card failed on pass $PASS with a check"
                  echo "::error::nobody has accepted -- reverting the card"
                  rm -f data/latest/card-accepted-now.txt
                  # ⛔ ONLY MLB'S CARD. `git checkout -- picks/` reverted the
                  # WHOLE directory, football cards included -- a failing
                  # BASEBALL check would silently throw away a college board
                  # built in the same pass. Same shared-directory family as
                  # the Track Record bug.
                  # ══════════════════════════════════════════════════
                  # 🔴🔴 ~~git checkout -- "picks/<date>.json" || true~~
                  # STRUCK 2026-09-11. **`git checkout` CANNOT REVERT AN
                  # UNTRACKED FILE**, so on the FIRST card build of any
                  # day the revert did NOTHING and the unverified card
                  # was published by the `git add -A` below.
                  # ⛔ MEASURED, NOT ASSUMED:
                  #     $ git checkout -- picks/new.json
                  #     error: pathspec ... did not match any file(s)
                  #     exit 1, file untouched, then staged as `A`
                  # ⛔ AND IT HAPPENED. `picks/2026-09-11.json` was ADDED
                  # at 14:07Z in the SAME COMMIT that wrote
                  # `card-verify-failure.txt` -- a card that failed its
                  # own verification, published because the revert was a
                  # no-op on a brand-new file. `|| true` swallowed the
                  # error, so nothing anywhere said so.
                  # ⚠️ TODAY'S CARD WAS NOT WRONG -- the failing check was
                  # the one running v4.0's coefficients (ledger rule 207)
                  # -- but that is luck, not a safety property.
                  # ✅ A NEW CARD IS DELETED; AN EDITED ONE IS RESTORED.
                  # ⛔ AND A REVERT THAT CANNOT BE DONE IS AN ERROR, NOT A
                  # `|| true`: the whole point is that the card does not
                  # reach the page.
                  for _c in "picks/$(date -u -d '10 hours ago' +%Y-%m-%d).json" \
                            "picks/$(date -u +%Y-%m-%d).json"; do
                    [ -e "$_c" ] || continue
                    if git ls-files --error-unmatch "$_c" >/dev/null 2>&1; then
                      git checkout -- "$_c" \
                        || { echo "::error::could not restore $_c"; rc=1; }
                    else
                      rm -f "$_c" \
                        || { echo "::error::could not remove unverified $_c"; rc=1; }
                      echo "::error::$_c was NEW and failed verify -- deleted, not published"
                    fi
                  done
                fi
              else
                cat /tmp/vc.txt | tail -5
                rm -f data/latest/card-verify-failure.txt
                rm -f data/latest/card-accepted-now.txt
              fi
            fi

            # --- publish this pass ---
            git add data/ picks/
            if git diff --staged --quiet; then
              echo "pass $PASS: nothing new to commit"
            else
              git commit -q -m "collect[$LEAGUE_NAME]: converge pass $PASS $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                git pull --rebase --autostash -q && git push -q && break
                echo "push attempt $i failed, retrying"
                sleep 5
              done
            fi

            # 🔴 THESE RUN AFTER THE COMMIT, DELIBERATELY. The data they
            # check cost credits and cannot be re-bought; a failure must
            # turn the run red WITHOUT discarding the snapshot.
            if [ "$LEAGUE_NAME" = "mlb" ]; then
              python verify_board.py  || { rc=1; echo "::error::verify_board failed"; }
              python verify_record.py || { rc=1; echo "::error::verify_record failed"; }
            fi
            # ══════════════════════════════════════════════════════════
            # 🔴🔴 AND FOOTBALL GETS THE SAME TREATMENT IT HAS NEVER HAD.
            # `verify_nfl.py`'s own header says it *"caught four real
            # defects, two before Sam saw them"* — and `[measured
            # 2026-09-19]` **no workflow and no test has ever invoked
            # it.** Rule 78: a verifier nothing runs, runs never. It was
            # failing on this tree the whole time and nobody could know.
            # ⚠️ `--current` ON PURPOSE: a pass verifies what it just
            # produced. 2022's snap coverage is 78.3%, a real historical
            # gap this job did not create and cannot repair; a bare
            # `python verify_nfl.py` still reports it.
            # ⛔ SAME PLACEMENT RULE AS MLB'S: after the commit, so a
            # failure turns the run red WITHOUT discarding a snapshot.
            if [ "$LEAGUE_NAME" = "nfl" ]; then
              python verify_nfl.py --current \
                || { rc=1; echo "::error::verify_nfl failed"; }
            fi
            echo "::endgroup::"

            # 🔴 THE FRESHNESS GATE IS THE JOB'S REAL OUTPUT. If anything
            # is still out of contract after a pass, that is the thing
            # worth seeing on the Actions page -- not which mode ran.
            # ⛔ MLB-ONLY, AND IT WAS NOT — CAUGHT 2026-08-28 BEFORE ANY
            # FOOTBALL RUN EXISTED. `freshness.py`'s contract describes
            # MLB's artifacts under `data/` and `picks/`. Football writes
            # to `data/nfl/` and `picks/nfl/`, so an NFL or CFB job would
            # have been graded against BASEBALL's deadlines -- failing for
            # reasons that have nothing to do with football, or passing
            # while football is silently stale. Both are the same bug.
            # ➡️ Football gets a gate when it gets contract rows. Until
            # then it has none, and the run SAYS SO rather than faking it.
            # 🔴 THE GATE RUNS FOR FOOTBALL TOO NOW. ~~"$LEAGUE_NAME has
            # no freshness contract yet"~~ STRUCK 2026-09-04 -- it does,
            # and a gate that never fires is the same as no gate.
            # ⚠️ `verify_freshness.py` reads the league from `LEAGUE`, the
            # same way every other tool in this file does, so there is no
            # baseball-deadlines-applied-to-football hazard: that was the
            # 2026-08-28 concern and the path-based dispatch removed it.
            # ⚠️ ONCE PER LEAGUE. `verify_freshness.py` grades ONE league's
            # contract, so a two-league run that checked only the last one
            # would leave the other ungated — and an unchecked league is
            # exactly the state this gate exists to end.
            for LG in $LEAGUES; do
              LEAGUE="$LG" python verify_freshness.py \
                || { rc=1; echo "::error::$LG is out of contract"; }
            done

            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "loop finished after $PASS pass(es)"
              break
            fi
            SLEEP=900
            LEFT=$(( DEADLINE - NOW ))
            [ "$LEFT" -lt "$SLEEP" ] && SLEEP="$LEFT"
            echo "sleeping ${SLEEP}s before the next pass"
            sleep "$SLEEP"
          done

          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════
      # 🔴 WATCHDOG — does the PAGE look right, and if not, say so.
      # `[Sam, 2026-09-14: "we need a way to notice these problems as
      #  they happen and it needs to fix itself in github when this
      #  happens"]`
      #
      # ⛔ `if: always()` IS THE WHOLE POINT. The run this rides on may
      # already have failed — that is exactly the run where Sam most
      # needs to be told what a reader would SEE, and a step that skips
      # on failure is a smoke alarm wired to the light switch.
      #
      # 🔧 TRY, THEN RE-CHECK, THEN ESCALATE WHAT IS LEFT. The repair
      # modes are FREE local rebuilds chosen by `watchdog.SAFE_REPAIRS`
      # — nothing here decides what is safe to run, because a shell copy
      # of that judgement is the copy no test can reach (rule 66).
      # ══════════════════════════════════════════════════════════════
      - name: Watchdog — check the product, repair what is repairable
        id: watchdog
        if: always()
        continue-on-error: true
        run: |
          set +e
          # ⛔ THE WORKFLOW LANDS BEFORE `watchdog.py` DOES, BY DESIGN.
          # A test in the root drop asserts this file, so the workflow has
          # to go FIRST or that test asserts something not yet present —
          # rule 229, which this project has already paid for once. The
          # guard makes the in-between state a clean no-op instead of a
          # step that half-runs and creates a garbage issue.
          if [ ! -f watchdog.py ]; then
            echo "::notice::watchdog.py is not in the repo yet — skipping"
            echo "healthy=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python watchdog.py | tee /tmp/wd1.txt
          REPAIRS=$(python -c "import json;print(' '.join(json.load(open('data/latest/health.json'))['repairs']))")
          if [ -n "$REPAIRS" ]; then
            echo "::notice::watchdog attempting repair: $REPAIRS"
            for m in $REPAIRS; do
              # ⚠️ EACH LEAGUE IN TURN. A football card mode is a no-op
              #    on mlb and vice versa, and the modes cost nothing, so
              #    the simple loop is also the correct one.
              for lg in mlb ncaaf nfl; do
                LEAGUE=$lg ODDS_API_KEY= timeout 900 python collect.py "$m" || true
              done
            done
            # 🔴 RE-CHECK AFTER REPAIRING. An alarm raised for something
            #    the system just fixed is the alarm Sam learns to ignore.
            python watchdog.py | tee /tmp/wd2.txt
          fi
          HEALTHY=$(python -c "import json;print(json.load(open('data/latest/health.json'))['healthy'])")
          echo "healthy=$HEALTHY" >> "$GITHUB_OUTPUT"
          exit 0

      # ⚠️ THE REPAIR'S OUTPUT HAS TO LAND OR THE REPAIR DID NOT HAPPEN.
      # A rebuilt card that is never committed is a card nobody sees —
      # rule 217 with the subject changed.
      # ⛔ REBASE BEFORE PUSHING. This runs after the converge loop has
      # already pushed, and two leagues' jobs can overlap; a plain push
      # loses to a race and `|| true` would hide it.
      - name: Commit the repair and the health report
        if: always()
        continue-on-error: true
        run: |
          git add data picks 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name=collector -c user.email=collector@local \
              commit -qm "watchdog: health report $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            echo "push race, retrying ($i)"
            sleep 5
          done
          echo "::warning::the health report could not be pushed"

      # 📣 ONE ISSUE, UPDATED IN PLACE, CLOSED WHEN HEALTHY.
      # ⛔ NOT ONE ISSUE PER RUN. A watchdog that opens a new issue every
      # hour is a watchdog whose notifications get filtered, and a
      # filtered alert is the same as no alert — which is the state this
      # whole step exists to leave behind.
      - name: Tell Sam
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # ⛔ NO HEALTH REPORT, NOTHING TO SAY. This is the window where
          # the workflow has landed and `watchdog.py` has not, and an
          # issue opened out of a missing file would make the alert
          # channel's very first message noise.
          if [ ! -f data/latest/health.json ]; then
            echo "no health report — nothing to say"
            exit 0
          fi
          # ⛔ MATCHED ON THE EXACT TITLE IN `jq`, NOT THROUGH GitHub's
          # SEARCH. `--search "in:title ..."` has to survive shell quoting,
          # an em dash, an apostrophe and an emoji before it ever reaches
          # the API, and a search that silently matches nothing would open
          # a NEW issue every run — the spam failure that gets the whole
          # alert channel muted.
          # ⛔ NO HEREDOC IN A YAML BLOCK SCALAR. The terminator has to sit
          # at column 0 for bash and inside the block for YAML, and it
          # cannot do both — the first version of this step broke the
          # workflow file outright. `--jq` does the same job with nothing
          # to indent.
          TITLE="Gizmo's Picks - the watchdog says the site is wrong"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" \
                2>/dev/null | head -1 | tr -dc '0-9')
          HEALTHY=$(python -c "import json;print(json.load(open('data/latest/health.json'))['healthy'])")
          python -c "import json,watchdog;open('/tmp/body.md','w').write(watchdog.render(json.load(open('data/latest/health.json'))))"
          if [ "$HEALTHY" = "True" ]; then
            # ✅ IT CLOSES ITSELF. An alert channel that needs tidying by
            # hand becomes a list of stale issues, and then it is ignored.
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "✅ Resolved — the watchdog now reports the site healthy."
              gh issue close "$NUM"
            fi
            echo "healthy; nothing to report"
            exit 0
          fi
          # 🔴🔴 THE LABEL IS ENSURED HERE, ABOVE THE BRANCH, NOT INSIDE IT.
          # `[measured 2026-09-19]` PR #73 labelled the `gh issue create` path and
          # left the `gh issue edit` path alone. Every watcher files ONCE and then
          # updates in place for ever, so **five of the six open watcher issues
          # carried no label at all** — #69, #44, #42, #31, #16 — and
          # `self-repair.yml` reads the queue BY LABEL. The issue reporting two
          # vacuous guards, which is the exact thing PR #73 existed to make
          # actionable, was one of the five.
          # ✅ `--add-label` on the edit path HEALS them: the next run of each
          # watcher puts its own issue into the queue. Nothing has to be relabelled
          # by hand.
          # ⛔ And the ensure moved ABOVE the branch because `--add-label X` fails
          # when X does not exist — the create path needed that and the edit path
          # needs it too.
          gh label create gizmo-watch --color 5319e7 --description "filed by a Gizmo's Picks watcher; self-repair triages these" 2>/dev/null || true
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --add-label gizmo-watch --body-file /tmp/body.md
            echo "::warning::the watchdog is still reporting the site wrong — issue #$NUM"
          else
            # ⚠️ THE ASSIGNEE IS TRIED AND THEN DROPPED. A create that
            # fails because a username changed would mean NO alert at all,
            # and the notification matters more than the assignment.
            gh issue create --label gizmo-watch --title "$TITLE" --body-file /tmp/body.md --assignee smh0602 \
              || gh issue create --label gizmo-watch --title "$TITLE" --body-file /tmp/body.md \
              || gh issue create --title "$TITLE" --body-file /tmp/body.md
          fi
          exit 0

      # 🔴🔴 A FAILING TEST MUST REACH SAM, NOT JUST THE RUN PAGE.
      #
      # ⛔ THE GAP THIS CLOSES, MEASURED 2026-09-14. `test_board_match.js`
      # went red at 20:08Z when the gamelines pull advanced the board past
      # a date literal the test had written down. Every collector run for
      # the next 2h25m was RED. **The only alarm was Sam opening the
      # Actions tab.** The "Tell Sam" step above reads `health.json` and
      # nothing else, so a test failure produced a red tick and NO issue,
      # NO email, and nothing the watchdog could see — it asks product
      # questions, and a stale test is not a product question.
      #
      # ⚠️ ONE ISSUE, UPDATED IN PLACE, CLOSED BY ITSELF — the same shape
      # as the watchdog's, for the same reason: a workflow that opens a
      # fresh issue every run is one whose notifications get filtered.
      # ⛔ A SEPARATE TITLE from the watchdog's on purpose. "The site is
      # wrong" and "a test is failing" are different problems with
      # different fixes, and merging them would hide whichever arrived
      # second.
      - name: Tell Sam the tests are failing
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TITLE="Gizmo's Picks - the test suite is failing"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          RC='${{ steps.tests.outputs.rc }}'
          NAMES='${{ steps.tests.outputs.failed }}'
          if [ "$RC" = "0" ] || [ -z "$RC" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "✅ Resolved — the suite is green again."
              gh issue close "$NUM"
            fi
            echo "tests green; nothing to report"
            exit 0
          fi
          {
            echo "**The test suite is failing, and it has been failing on every"
            echo "collector run since it started.**"
            echo
            echo "Failing file(s): \`${NAMES:-see the Tests step}\`"
            echo
            echo "A red run does not stop the data — the collector still"
            echo "commits, and the page keeps updating. What it stops is the"
            echo "guarantee that the numbers were checked before they shipped."
            echo
            echo "⛔ Do not fix this by weakening the check. Read CLAUDE.md."
            echo "A check may only change when it asks the WRONG QUESTION,"
            echo "and the replacement must be harder to pass."
            echo
            echo "_This issue is updated in place and closes itself when the"
            echo "suite goes green._"
          } > /tmp/tests_body.md
          # 🔴🔴 THE LABEL IS ENSURED HERE, ABOVE THE BRANCH, NOT INSIDE IT.
          # `[measured 2026-09-19]` PR #73 labelled the `gh issue create` path and
          # left the `gh issue edit` path alone. Every watcher files ONCE and then
          # updates in place for ever, so **five of the six open watcher issues
          # carried no label at all** — #69, #44, #42, #31, #16 — and
          # `self-repair.yml` reads the queue BY LABEL. The issue reporting two
          # vacuous guards, which is the exact thing PR #73 existed to make
          # actionable, was one of the five.
          # ✅ `--add-label` on the edit path HEALS them: the next run of each
          # watcher puts its own issue into the queue. Nothing has to be relabelled
          # by hand.
          # ⛔ And the ensure moved ABOVE the branch because `--add-label X` fails
          # when X does not exist — the create path needed that and the edit path
          # needs it too.
          gh label create gizmo-watch --color 5319e7 --description "filed by a Gizmo's Picks watcher; self-repair triages these" 2>/dev/null || true
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --add-label gizmo-watch --body-file /tmp/tests_body.md
          else
            gh issue create --label gizmo-watch --title "$TITLE" --body-file /tmp/tests_body.md --assignee smh0602 \
              || gh issue create --label gizmo-watch --title "$TITLE" --body-file /tmp/tests_body.md \
              || gh issue create --title "$TITLE" --body-file /tmp/tests_body.md
          fi
          exit 0

      # 🔴 THE DEFERRED FAILURE. Everything is committed and every
      # verifier has spoken; only now does a failure turn the job red.
      # ⛔ Keep this LAST.
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 BOTH GATES REPORT. THE FIRST ONE USED TO EAT THE SECOND.
      # ══════════════════════════════════════════════════════════════
      # `[measured 2026-09-19]` a step that `exit 1`s makes GitHub SKIP
      # every later step that does not say otherwise. So from the moment
      # the suite went red — 2026-09-17T23:27, and it has not been green
      # since — the converge gate below has been **skipped on every
      # run**, and a collector failure could not reach the Actions page
      # at all. Confirmed on job 105631080959, where both gates read
      # `skipped`.
      # ⛔ WHAT WAS HIDING IN THERE: nflverse answered
      #    `403 rate limit exceeded` on every NFL pass for 47 hours. The
      #    run was already red for the tests, so nothing said so.
      # ✅ `!cancelled()` makes each gate run on its own merits. A run
      #    can be red for two reasons and must name both.
      # ⚠️ NOT `always()`: on a CANCELLED run — which is the DESIGNED
      #    outcome for every MLB-group heartbeat, 17 of them in 29 hours
      #    — neither gate should annotate anything.
      - name: Fail if the tests failed
        if: ${{ !cancelled() && steps.tests.outputs.rc != '0' && steps.tests.outputs.rc != '' }}
        run: |
          echo "::error::the test suite failed — see the Tests step"
          exit 1

      - name: Fail if any pass failed
        if: ${{ !cancelled() && steps.collect.outputs.rc != '0' }}
        run: |
          # ⛔ AND IT SAYS WHICH OF THE TWO IT IS. An empty rc means the
          # converge step never reported — it did not run to completion,
          # which is not the same as a pass failing, and the old single
          # message claimed the wrong one every time the suite failed
          # first on a push.
          if [ -z "${{ steps.collect.outputs.rc }}" ]; then
            echo "::error::the converge step never reported a result — it did not run to completion"
          else
            echo "::error::at least one converge pass failed -- see the log"
          fi
          exit 1
