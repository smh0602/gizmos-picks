name: collect

# Times are UTC. The MLB slate runs roughly 16:00Z (noon ET) to 05:00Z.
#
# GitHub bills each job rounded UP to the nearest minute, so pull count
# matters as much as pull cost. The repo is public, so Actions minutes are
# free -- but the SCHEDULE is not unlimited in practice. This file ran 29
# cron entries and GitHub stopped firing every one of them for 21 hours on
# 2026-08-26/27 while manual dispatch kept working. Cause never confirmed
# from the repo side; the response was to stop asking the scheduler for so
# much. A mode is now a LIST, one cron does a whole time block, and the
# count is 16.
#
# Scheduled workflows on GitHub can be delayed several minutes under load.
# That is fine at 30-minute granularity; do not tighten this without
# checking both the credit budget and the Actions minutes budget.

on:
  schedule:
    # ══ GAME LINES ══ hourly, 08:00Z (4am ET) through 04:00Z.
    # 6 credits per run for the WHOLE slate -- the bulk endpoint bills per
    # call, not per game. 21 runs = 126/day.
    # ⚠️ This is CHEAPER than the 28-run half-hourly schedule it replaces
    # (168/day) and starts six hours earlier. Sam, 2026-08-26: "i want the
    # lines to start being posted at around 4am".
    # ⚠️ Minute deliberately off :00 and :30 -- those are the most congested
    # slots on GitHub's scheduler and runs get dropped there.
    - cron: "13 8-23 * * *"
    - cron: "13 0-4 * * *"

    # ══ PROPS ══ three pulls a day. THE REGION IS THE PRICE.
    # Cost is markets x REGIONS x games, and books are FREE inside a
    # region -- one two-region pull returned 18 books for 6 credits
    # (measured 2026-08-26). Narrowing the BOOK list saves nothing.
    #   both regions (us,us2): batter 150 + pitcher 90 = 240
    #   us2 only (Hard Rock) : batter  75 + pitcher 45 = 120
    #
    #   04:00am ET  Hard Rock only   120   board goes up
    #   10:10am ET  BOTH regions     240   feeds the 10:45am card
    #   04:10pm ET  Hard Rock only   120   feeds the 4:50pm card
    #                                ---
    #                                480/day + 126 gamelines = 606/day
    #                                ~= 18,786 of a 20,000 monthly plan
    #
    # 🔴 THE FULL PULL SITS BEFORE THE MORNING CARD ON PURPOSE. A pull at
    # noon would land AFTER the 10:45am card, which would then fall back to
    # the 4am prices -- 6 3/4 hours stale. Anchor paid pulls to the cards.
    # ⚠️ The trade, stated: the EVENING card carries Hard Rock prices only
    # and loses cross-book comparison. Early lines are softer and disagree
    # more, so the full pull is worth more in the morning.

    # -- 4am block. ONE cron does the whole pull; the backup 30 min later
    #    re-runs the same list and costs NOTHING when the first one worked
    #    (freshness guard in collect.py). The card is its OWN cron so a
    #    verifier failure can never discard the props pull that paid for it.
    - cron: "5 8 * * *"
    - cron: "35 8 * * *"
    - cron: "42 8 * * *"

    # -- 10am block: BOTH regions, feeding the morning card.
    - cron: "8 14 * * *"
    - cron: "38 14 * * *"
    - cron: "46 14 * * *"

    # -- 4pm block: Hard Rock only, feeding the evening card.
    - cron: "8 20 * * *"
    - cron: "38 20 * * *"
    - cron: "48 20 * * *"

    # ══ FREE (statsapi or local compute) ══ zero credits, so frequency
    # here is never a budget question.
    # 🔴 Results and the game logs run BEFORE the 4am props pull so the
    # early board carries last night's games rather than yesterday's.
    # 🔴 THE TRACK RECORD GRADES AT 2am ET. Sam, 2026-08-26.
    # Results must land BEFORE it, so results runs first at 01:40am ET.
    # ⚠️ Measured from the archive: the latest first pitch is 9:06pm ET and
    # a typical game ends by 12:16am ET, so 1:40am clears almost every
    # night. A long extra-innings West Coast game could still be live --
    # which is why the ORIGINAL later pass is KEPT below as a backstop.
    # Both modes are statsapi and cost nothing, so running twice is free
    # and a game missed at 2am is graded by breakfast either way.
    - cron: "40 5 * * *"
    - cron: "2 6 * * *"
    # -- the backstop pass: results, both game logs and a re-grade in ONE
    #    run at 3:34am ET -- before the 4:05am props pull, so the early
    #    board carries last night's games.
    - cron: "34 7 * * *"
    - cron: "52 8 * * *"
    - cron: "5 1,13,19 * * *"

  # 🆕 Rebuild the free artefacts whenever the CODE changes, so a fix is
  # visible on the site immediately instead of waiting for the next
  # scheduled run. Costs nothing: the `refresh` mode calls no API.
  # ⛔ Deliberately scoped to the three source files. The collector's own
  # commits only ever touch data/ and picks/, so this cannot re-trigger
  # itself -- there is no loop.
  push:
    branches: [main]
    paths:
      - "collect.py"
      - "card.py"
      - "verify_card.py"

  workflow_dispatch:
    inputs:
      season:
        description: "season year, for nfl-logs"
        required: false
        default: "2025"
      league:
        description: "mlb | nfl | ncaaf"
        required: false
        default: mlb
      mode:
        description: "one mode, or several separated by spaces: card | record | refresh | lineups | gamelines | props-pitcher | props-batter | props-pitcher-hr | props-batter-hr | schedule | results | hitters | news | props-board | pitchers | nfl-probe | nfl-logs"
        required: true
        default: gamelines

# One queue PER MODE, not one queue for everything.
# ⚠️ GitHub keeps a single pending run per concurrency group and CANCELS
# older pending ones. With a shared group, running three jobs by hand
# silently killed whatever scheduled pull was waiting behind them --
# which is the other half of why the board went stale.
concurrency:
  group: collect-${{ github.event.inputs.league || 'mlb' }}-${{ github.event.schedule || github.event.inputs.mode || github.event_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what this run collects
        id: mode
        run: |
          # 🔴 EVERY RUN IS ONE LEAGUE. A cron that does not name one is
          # MLB, so every existing schedule keeps its exact behaviour and
          # every existing path is untouched.
          echo "league=${{ github.event.inputs.league || 'mlb' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=refresh" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              # 🔴 A MODE CAN BE A LIST. The Collect step loops over it, so
              # one cron does a whole time block. This cut the schedule from
              # 29 entries to 16: GitHub drops individual scheduled runs, and
              # a block that fires either does all of its work or none of it,
              # instead of landing four of five pulls and building a card on
              # the gap.
              # -- game lines, hourly
              "13 8-23 * * *")  echo "mode=gamelines" >> "$GITHUB_OUTPUT" ;;
              "13 0-4 * * *")   echo "mode=gamelines" >> "$GITHUB_OUTPUT" ;;
              # -- 4am block, Hard Rock only, then the card on its own run
              "5 8 * * *")      echo "mode=props-pitcher-hr props-batter-hr props-board" >> "$GITHUB_OUTPUT" ;;
              "35 8 * * *")     echo "mode=props-pitcher-hr props-batter-hr props-board" >> "$GITHUB_OUTPUT" ;;
              "42 8 * * *")     echo "mode=card" >> "$GITHUB_OUTPUT" ;;
              # -- 10am block, BOTH regions, then the card
              "8 14 * * *")     echo "mode=props-pitcher props-batter props-board" >> "$GITHUB_OUTPUT" ;;
              "38 14 * * *")    echo "mode=props-pitcher props-batter props-board" >> "$GITHUB_OUTPUT" ;;
              "46 14 * * *")    echo "mode=card" >> "$GITHUB_OUTPUT" ;;
              # -- 4pm block, Hard Rock only, then the card
              "8 20 * * *")     echo "mode=props-pitcher-hr props-batter-hr props-board" >> "$GITHUB_OUTPUT" ;;
              "38 20 * * *")    echo "mode=props-pitcher-hr props-batter-hr props-board" >> "$GITHUB_OUTPUT" ;;
              "48 20 * * *")    echo "mode=card" >> "$GITHUB_OUTPUT" ;;
              # -- free
              "40 5 * * *")     echo "mode=results" >> "$GITHUB_OUTPUT" ;;
              "2 6 * * *")      echo "mode=record" >> "$GITHUB_OUTPUT" ;;
              "34 7 * * *")     echo "mode=results pitchers hitters record" >> "$GITHUB_OUTPUT" ;;
              "52 8 * * *")     echo "mode=lineups" >> "$GITHUB_OUTPUT" ;;
              "5 1,13,19 * * *") echo "mode=news" >> "$GITHUB_OUTPUT" ;;
              # 🔴 NO DEFAULT MODE. This used to be `*) mode=gamelines`,
              # which meant any cron somebody added and forgot to map here
              # SILENTLY became a 6-credit gamelines pull writing the wrong
              # file. An unmapped schedule is a bug, and it now says so.
              *)
                echo "::error::Unmapped schedule '${{ github.event.schedule }}' -- refusing to guess a mode."
                exit 1
                ;;
            esac
          fi

      # 🔴 THE MODE IS A LIST AND A FAILURE IS DEFERRED, NOT FATAL HERE.
      # A block runs several pulls. If the third one dies, the two that
      # already cost credits must still reach the repo -- so the loop
      # records the failure and the job is failed AFTER the commit step.
      # ⛔ Do not turn this back into a bare `python collect.py`. That
      # aborts the step, skips `Commit snapshots`, and throws away paid
      # data to report an error the run would have reported anyway.
      - name: Collect
        id: collect
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          LEAGUE: ${{ steps.mode.outputs.league }}
          SEASON: ${{ github.event.inputs.season || '2025' }}
          # ⛔ VIA env, NOT interpolated into the script body. The dispatch
          # input reaches this string, and `${{ }}` inside `run:` is pasted
          # as raw shell before bash ever sees it.
          MODES: ${{ steps.mode.outputs.mode }}
        run: |
          rc=0
          for m in $MODES; do
            echo "::group::collect $m"
            if ! python collect.py "$m"; then
              rc=1
              echo "::error::mode '$m' failed"
            fi
            echo "::endgroup::"
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # ⛔ MLB-ONLY STEPS. statsapi and all three verifiers are baseball.
      # A football run must not invoke them, and the guard is the LEAGUE,
      # not the mode -- `gamelines` exists in every league.
      - name: Collect schedule (free, statsapi)
        if: steps.mode.outputs.league == 'mlb' && contains(steps.mode.outputs.mode, 'gamelines')
        run: python collect.py schedule

      # 🔴 A card that fails its own checks is not published. verify_card.py
      # recomputes every probability a second, independent way, re-counts
      # every raw rate off the game log, and re-derives every multiplier
      # from the prices. It exits non-zero on any failure, which fails the
      # job BEFORE the commit step -- so a bad card never reaches the page.
      - name: Verify the card
        if: steps.mode.outputs.league == 'mlb' && (contains(steps.mode.outputs.mode, 'card') || contains(steps.mode.outputs.mode, 'refresh'))
        run: python verify_card.py

      - name: Commit snapshots
        run: |
          git config user.name  "gizmos-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/ picks/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "collect[${{ steps.mode.outputs.league }}]: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have landed while this one was working.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push attempt $i failed, retrying"
              sleep 5
            done
          fi

      # 🔴 THIS RUNS *AFTER* THE COMMIT, AND THAT IS THE WHOLE POINT.
      # verify_card.py blocks its commit because a bad card must never
      # publish. The board check must NOT block, because the raw pull it
      # is checking cost credits and cannot be bought back at any sane
      # price. A failure here turns the job red -- visible -- with the
      # snapshot already safely committed.
      - name: Verify the board
        if: steps.mode.outputs.league == 'mlb' && contains(steps.mode.outputs.mode, 'gamelines')
        run: python verify_board.py

      # 🔴 THE TRACK RECORD IS AUDITED EVERY TIME IT IS BUILT.
      # It re-grades every published pick from the stored box scores a
      # SECOND way and compares. ⛔ Like the board check, this runs AFTER
      # the commit: the record is derived and can be rebuilt, but a run
      # that fails must not discard the data it was built from.
      - name: Verify the track record
        if: steps.mode.outputs.league == 'mlb' && (contains(steps.mode.outputs.mode, 'record') || contains(steps.mode.outputs.mode, 'refresh'))
        run: python verify_record.py

      # 🔴 THE DEFERRED FAILURE. Everything the run collected is committed
      # and every verifier has spoken; only now does a failed pull turn the
      # job red. ⛔ Keep this LAST.
      - name: Fail if any collect mode failed
        if: steps.collect.outputs.rc != '0'
        run: |
          echo "::error::at least one collect mode failed -- see the Collect step"
          exit 1
