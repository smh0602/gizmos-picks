name: collect

# Times are UTC. The MLB slate runs roughly 16:00Z (noon ET) to 05:00Z.
#
# GitHub bills each job rounded UP to the nearest minute, so pull count
# matters as much as pull cost. At 31 runs a day this uses ~930 of the
# 2,000 free minutes a private repo gets each month.
#
# Scheduled workflows on GitHub can be delayed several minutes under load.
# That is fine at 30-minute granularity; do not tighten this without
# checking both the credit budget and the Actions minutes budget.

on:
  schedule:
    # Game lines: every 30 minutes, 15:00Z - 04:30Z.
    # 6 credits per run for the whole slate. Feeds line movement,
    # best-odds shopping, and the implied team totals owed-test T25 needs.
    # ⚠️ Minutes deliberately OFF the hour and half-hour. GitHub runs
    # scheduled workflows on a best-effort queue and drops them under load,
    # and :00 / :30 are the most congested slots on the platform. Measured
    # 2026-08-23: six consecutive runs at 0,30 were skipped, leaving a
    # three-hour hole in the board.
    - cron: "7,37 15-23 * * *"
    - cron: "7,37 0-4 * * *"

    # Pitcher props: morning board, then a pregame refresh.
    - cron: "10 14 * * *"
    - cron: "40 21 * * *"

    # Hitter props: once. Banked for a model that does not exist yet.
    - cron: "20 14 * * *"

    # Hitter game logs: free (statsapi), ~500 players, a couple of minutes.
    # Runs before the batter-props pull so the props tab has evidence to
    # attach to each line.
    - cron: "0 14 * * *"

    # Pitcher game logs: free, mirrors the hitter pull, feeds the
    # strikeout and outs markets on the props tab.
    - cron: "50 13 * * *"

    # Props board: joins the batter odds to the hitter logs. Runs after
    # both, costs nothing, and is what the Player Props tab reads.
    - cron: "35 14 * * *"

    # The card. Free -- it spends no credits and calls nothing; it reads
    # the game logs and the prop board this workflow already stores and
    # runs the v4.0 model over them, writing picks/<date>.json.
    #
    # Two runs. The morning one publishes the board off the 14:10Z prop
    # pull. The evening one re-prices it against the 21:40Z pull, because
    # a card built at 10am may not assert a 6pm price (ledger rule 49).
    # The 21:45 props-board rebuild exists so the evening card is joined to
    # the fresh odds rather than to the morning's.
    - cron: "45 14 * * *"
    - cron: "45 21 * * *"
    - cron: "50 21 * * *"

    # News: three times a day. Free, no CORS-safe way to do it in the page.
    - cron: "5 13 * * *"
    - cron: "5 19 * * *"
    - cron: "5 1 * * *"

    # Final results: 08:00Z = 4am ET, after the last game ends and well
    # before the 11:31Z grading run. Free (statsapi). This is the feed the
    # pick ledger is graded from -- a Claude session cannot be relied on to
    # reach statsapi itself, so results are fetched here and read out of
    # the repo instead.
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "card | gamelines | props-pitcher | props-batter | schedule | results | hitters | news | props-board | pitchers"
        required: true
        default: gamelines

# One queue PER MODE, not one queue for everything.
# ⚠️ GitHub keeps a single pending run per concurrency group and CANCELS
# older pending ones. With a shared group, running three jobs by hand
# silently killed whatever scheduled pull was waiting behind them --
# which is the other half of why the board went stale.
concurrency:
  group: collect-${{ github.event.schedule || github.event.inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what this run collects
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "10 14 * * *") echo "mode=props-pitcher" >> "$GITHUB_OUTPUT" ;;
              "40 21 * * *") echo "mode=props-pitcher" >> "$GITHUB_OUTPUT" ;;
              "20 14 * * *") echo "mode=props-batter"  >> "$GITHUB_OUTPUT" ;;
              "0 14 * * *")  echo "mode=hitters"       >> "$GITHUB_OUTPUT" ;;
              "0 8 * * *")   echo "mode=results"       >> "$GITHUB_OUTPUT" ;;
              "50 13 * * *") echo "mode=pitchers"      >> "$GITHUB_OUTPUT" ;;
              "35 14 * * *") echo "mode=props-board"   >> "$GITHUB_OUTPUT" ;;
              "45 21 * * *") echo "mode=props-board"   >> "$GITHUB_OUTPUT" ;;
              "45 14 * * *") echo "mode=card"          >> "$GITHUB_OUTPUT" ;;
              "50 21 * * *") echo "mode=card"          >> "$GITHUB_OUTPUT" ;;
              "5 13 * * *")  echo "mode=news"          >> "$GITHUB_OUTPUT" ;;
              "5 19 * * *")  echo "mode=news"          >> "$GITHUB_OUTPUT" ;;
              "5 1 * * *")   echo "mode=news"          >> "$GITHUB_OUTPUT" ;;
              *)             echo "mode=gamelines"     >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Collect
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python collect.py "${{ steps.mode.outputs.mode }}"

      - name: Collect schedule (free, statsapi)
        if: steps.mode.outputs.mode == 'gamelines'
        run: python collect.py schedule

      # 🔴 A card that fails its own checks is not published. verify_card.py
      # recomputes every probability a second, independent way, re-counts
      # every raw rate off the game log, and re-derives every multiplier
      # from the prices. It exits non-zero on any failure, which fails the
      # job BEFORE the commit step -- so a bad card never reaches the page.
      - name: Verify the card
        if: steps.mode.outputs.mode == 'card'
        run: python verify_card.py

      - name: Commit snapshots
        run: |
          git config user.name  "gizmos-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/ picks/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "collect: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have landed while this one was working.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push attempt $i failed, retrying"
              sleep 5
            done
          fi
