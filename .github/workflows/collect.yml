name: collect

# Times are UTC. The MLB slate runs roughly 16:00Z (noon ET) to 05:00Z.
#
# GitHub bills each job rounded UP to the nearest minute, so pull count
# matters as much as pull cost. At 31 runs a day this uses ~930 of the
# 2,000 free minutes a private repo gets each month.
#
# Scheduled workflows on GitHub can be delayed several minutes under load.
# That is fine at 30-minute granularity; do not tighten this without
# checking both the credit budget and the Actions minutes budget.

on:
  schedule:
    # Game lines: every 30 minutes, 15:00Z - 04:30Z.
    # 6 credits per run for the whole slate. Feeds line movement,
    # best-odds shopping, and the implied team totals owed-test T25 needs.
    - cron: "0,30 15-23 * * *"
    - cron: "0,30 0-4 * * *"

    # Pitcher props: morning board, then a pregame refresh.
    - cron: "10 14 * * *"
    - cron: "40 21 * * *"

    # Hitter props: once. Banked for a model that does not exist yet.
    - cron: "20 14 * * *"

    # Hitter game logs: free (statsapi), ~500 players, a couple of minutes.
    # Runs before the batter-props pull so the props tab has evidence to
    # attach to each line.
    - cron: "0 14 * * *"

    # Final results: 08:00Z = 4am ET, after the last game ends and well
    # before the 11:31Z grading run. Free (statsapi). This is the feed the
    #
