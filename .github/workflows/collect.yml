name: collect

# Times are UTC. The MLB slate runs roughly 16:00Z (noon ET) to 05:00Z.
#
# GitHub bills each job rounded UP to the nearest minute, so pull count
# matters as much as pull cost. The repo is public, so Actions minutes are
# free -- but the SCHEDULE is not unlimited in practice. This file ran 29
# cron entries and GitHub stopped firing every one of them for 21 hours on
# 2026-08-26/27 while manual dispatch kept working. Cause never confirmed
# from the repo side; the response was to stop asking the scheduler for so
# much. A mode is now a LIST, one cron does a whole time block, and the
# count is 16.
#
# Scheduled workflows on GitHub can be delayed several minutes under load.
# That is fine at 30-minute granularity; do not tighten this without
# checking both the credit budget and the Actions minutes budget.

on:
  schedule:
    # ══════════════════════════════════════════════════════════════════
    # SAM'S SCHEDULE — 2026-08-28. Times below are UTC; ET is UTC-4.
    # ══════════════════════════════════════════════════════════════════
    #   6:00am ET   Trends + Track Record   (grade last night's slate)
    #   7:00am ET   Odds + Player Props
    #  10:00am ET   Gizmo's Picks + Parlays
    #   4:00pm ET   Odds + Player Props
    #   News        unchanged, 3x daily
    #   Scores      live in the browser, 45s, free
    #
    # 🔴 THESE CRONS ARE NOT WHAT MAKES THOSE TIMES HAPPEN, AND THAT IS
    # THE POINT. `[measured 2026-08-28 from this repo's commit log]`
    # GitHub dropped 19 of 21 daily runs on 8/27 and 17 of 21 on 8/26. A
    # cron AT 7am is a cron that sometimes does not fire, which is the
    # failure this whole design replaces.
    #
    # ✅ What makes the times happen: each artifact declares a DUE TIME
    # in `freshness.py`, and every run -- whichever cron fired, or a push
    # -- builds whatever is past due. The crons below are just chances to
    # land. Miss one and the next run catches up; the page says it was
    # late; nothing is ever skipped.
    #
    # ⚠️ Minutes off :00 -- the most congested slot on GitHub's scheduler.
    # Each fires a few minutes AFTER its deadline so the deadline has
    # actually passed when the run surveys.
    - cron: "4 10 * * *"     #  6:04am ET — grading
    - cron: "4 11 * * *"     #  7:04am ET — odds + props (full, both regions)
    - cron: "4 14 * * *"     # 10:04am ET — the card
    - cron: "4 20 * * *"     #  4:04pm ET — odds + props (Hard Rock)
    - cron: "5 13,19,1 * * *" # news, unchanged

    # ══ THE BACKSTOP ══
    # Every 3 hours. If one of the four above is dropped, this lands and
    # builds whatever is overdue. Combined with the heartbeat loop (a
    # landed run converges every 15 min for ~5 hours), the schedule has
    # to fail repeatedly and consecutively before a deadline is missed by
    # more than an hour.
    - cron: "9 */3 * * *"

    # ══ FOOTBALL ══
    # 🔴 ZERO football odds have ever been collected. These are the first.
    # ⚠️ Props bill PER GAME, so CFB runs the Power 4 gate in collect.py --
    # an unfiltered NCAAF Saturday is ~70 events and ~700 credits.
    # 💰 Priced before shipping, at ~25 P4 games and 16 NFL games:
    #    CFB Sat props  5 x 2 x 25 = 250   ·  NFL Sun props 6 x 2 x 16 = 192
    #    gamelines 6 per call, flat -- 4 calls a day is 24.
    #    MLB currently runs 240-317/day against a 600 cap.
    # ⛔ ONE props pull per game day to start. A second would put a
    # Saturday at ~740 and over the cap.
    - cron: "20 15 * * 6"       # Sat 11:20am ET — CFB props + lines
    - cron: "20 */6 * * 4,5,6"  # Thu/Fri/Sat — CFB line movement
    - cron: "25 15 * * 0"       # Sun 11:25am ET — NFL props + lines
    - cron: "25 22 * * 4"       # Thu 6:25pm ET — TNF
    - cron: "25 */6 * * 0,1,4"  # Thu/Sun/Mon — NFL line movement

    # ══ THE WEEK-BY-WEEK TRENDS REFRESH ══
    # 🔴 NOTHING REBUILT THE CURRENT SEASON. The back-fill only ever ran
    # by hand, so the trends board would have frozen on 2025 while 2026
    # was being played. Sam, 2026-09-01: "when these games start week by
    # week, day by day we need to be updating the trends tab showing
    # accurate stats on a week by week basis."
    # ⚠️ TIMED AFTER THE SLATE IS FINAL, not during it -- college plays
    # into Saturday night, the NFL into Monday night.
    # 💰 FREE. Both back-fills read published stat files, not the odds API.
    - cron: "35 14 * * 0"       # Sun 10:35am ET — rebuild CFB, after Saturday
    - cron: "35 15 * * 2"       # Tue 11:35am ET — rebuild NFL, after MNF

    # ══ THE FOOTBALL CARD REBUILD ══
    # 🔴 `card-fb` RAN ONLY CHAINED INSIDE THE PAID `props-player` PULL,
    # SO A CODE FIX DID NOT REACH THE PAGE UNTIL THE NEXT PAID PULL.
    # `[measured 2026-09-04]` the live college board was still **50 of 50
    # Anytime TD with +5000 on top** -- the exact board Sam complained
    # about -- while THREE shipped fixes sat on `main` unused: the +400
    # ceiling, the market mix, and college rates. The card was last
    # written 2026-09-03T22:36Z, when the props pull last ran.
    # ⛔ AND `refresh` CANNOT COVER IT: the push trigger is MLB-only.
    # ✅ `card-fb` is FREE -- it reads the board already on disk and
    # computes -- and it is a clean no-op when there is no board yet, so
    # it is safe to hang off every football cron. It is now attached to
    # the line-movement crons AND the daily news crons, which means the
    # board rebuilds at least once a day whatever else happens.
    # ══ FOOTBALL NEWS ══
    # 🔴 THE FEEDS WERE ADOPTED ON 2026-09-03 AND NO CRON EVER RAN THEM.
    # `[measured 2026-09-04]` NEWS_FEEDS carries CBS Sports +
    # ProFootballTalk for the NFL and CBS Sports + Yahoo for college, and
    # `data/nfl/latest/news.json` and `data/ncaaf/latest/news.json` DO NOT
    # EXIST -- both News tabs have been rendering an empty state since the
    # day they were built. ⛔ Same defect as the college logo directory:
    # a writer built, wired to a mode, and named by no schedule.
    # ⚠️ DAILY, NOT GAME-DAY. News does not stop on a Tuesday, and the
    # football odds crons only fire Thu-Sun -- so hanging news off them
    # would leave the tab four days stale every week.
    # 💰 FREE. RSS, not the Odds API. It cannot spend a credit.
    - cron: "40 12 * * *"       # 8:40am ET — CFB headlines
    - cron: "45 12 * * *"       # 8:45am ET — NFL headlines
    # ══ THE GAME DAYS THE FIRST PASS MISSED ══
    # 🔴 A PROPS CRON THAT ONLY FIRES ON THE MAIN DAY IS A PROPS CRON
    # THAT LOSES EVERY OTHER GAME. College plays THURSDAY AND FRIDAY all
    # season, and the NFL adds SATURDAY from mid-December through the
    # playoffs. ⛔ Those boards are small, but odds history cannot be
    # bought back at any price, and a missed Thursday is missed forever.
    # 💰 Small slates are cheap: a 3-game CFB Thursday is 5 x 2 x 3 = 30
    # credits. ⚠️ On a day with no games the events list is empty and the
    # pull costs nothing at all.
    - cron: "30 22 * * 4"       # Thu 6:30pm ET — CFB props
    - cron: "30 21 * * 5"       # Fri 5:30pm ET — CFB props
    - cron: "30 16 * * 6"       # Sat 12:30pm ET — NFL props (Dec/Jan)

  # 🔴 RESTORED 2026-08-28 AFTER I DELETED IT BY ACCIDENT. The schedule
  # rewrite replaced everything between `schedule:` and
  # `workflow_dispatch:`, and this block was sitting in the middle of it.
  # ⛔ Losing it would have broken exactly what Sam asked for: "when i
  # submit our files you also update all of these tabs now as well." An
  # upload would have been silent.
  #
  # ⚠️ A push now runs a FULL CONVERGE, not the old free-only `refresh`.
  # That means an upload CAN spend credits -- deliberately, because the
  # point is that submitting files brings the site current. The daily cap
  # and the 45-minute props guard bound it; a second upload minutes later
  # costs nothing.
  push:
    branches: [main]
    paths:
      - "collect.py"
      - "card.py"
      - "verify_card.py"
      - "freshness.py"
      - "verify_freshness.py"
      - "index.html"
      - ".github/workflows/collect.yml"

  workflow_dispatch:
    inputs:
      season:
        description: "season year, for nfl-logs"
        required: false
        default: "2025"
      league:
        description: "mlb | nfl | ncaaf"
        required: false
        default: mlb
      mode:
        # ⚠️ LEAVE THIS AS `converge` unless you know why you are changing
        # it. `converge` builds everything past its deadline, which is
        # almost always what a hand-run is for. Naming a single mode still
        # converges the rest as well -- add `converge-off` after it to run
        # that one mode ALONE (used for nfl-logs).
        description: "converge (default — build everything overdue) | or: card | record | gamelines | props-pitcher | props-batter | results | pitchers | hitters | lineups | news | news-probe | card-fb | nfl-logs converge-off"
        required: true
        default: converge

# One queue PER MODE, not one queue for everything.
# ⚠️ GitHub keeps a single pending run per concurrency group and CANCELS
# older pending ones. With a shared group, running three jobs by hand
# silently killed whatever scheduled pull was waiting behind them --
# which is the other half of why the board went stale.
# 🔴 ONE GROUP PER LEAGUE, AND THE NEWEST RUN WINS.
# The heartbeat loop holds a job open for hours, so the old per-schedule
# group would queue every later cron behind it and GitHub would cancel
# the pending ones anyway. cancel-in-progress means a freshly landed run
# REPLACES the loop that is already holding the line -- which is exactly
# what you want, because the new one starts by converging too.
concurrency:
  group: collect-${{ github.event.inputs.league || 'mlb' }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # ⚠️ Under GitHub's 6-hour ceiling with room to spare. The loop stops
    # itself at LOOP_MINUTES; this is the backstop if it ever does not.
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ══════════════════════════════════════════════════════════════
      # THE TESTS RUN HERE, BEFORE ANY CREDIT IS SPENT
      # ══════════════════════════════════════════════════════════════
      # 🔴 A TEST SUITE THAT LIVES ON SAM'S LAPTOP IS A TEST SUITE THAT
      # NEVER RUNS. Both of these have already caught real defects --
      # the nightly phantom props pull at the UTC day boundary, and a
      # deleted `push:` trigger that would have made every upload silent.
      # Neither would have been caught by a human reading the diff.
      #
      # ⛔ ON A PUSH THIS BLOCKS. Someone just changed code; if the
      # freshness logic is broken, the plan it produces is not to be
      # trusted with money, so nothing is collected.
      # ✅ ON A SCHEDULE IT DOES NOT BLOCK. The data still needs to
      # arrive, and a failing test must not take the site down with it --
      # the failure is recorded and turns the run red at the end.
      - name: Tests
        id: tests
        continue-on-error: ${{ github.event_name != 'push' }}
        run: |
          # 🔴 THIS STEP NAMED ONE TEST FILE AND THE REPO HELD SIX.
          # `[measured 2026-09-01]` test_cfb.py, test_p4.py,
          # test_regions.py and test_board_match.js were all in the repo,
          # all passing, and NONE of them had ever gated anything. They
          # were written to protect the Power 4 name matcher, the props
          # region pricing and the CFB parsers -- three of the places
          # this project has actually been burned.
          # ⛔ A TEST THAT NEVER RUNS IS WORSE THAN NO TEST: it is a
          # false sense of cover, and it rots silently.
          # ✅ So DISCOVER them. Same rule as budget.py -- never put a
          # list anywhere you cannot auto-update. A new test_*.py is
          # picked up by existing here, with no workflow edit.
          rc=0
          found=0
          for t in test_*.py; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "── $t"
            python "$t" || { rc=1; echo "::error::$t FAILED"; }
          done
          for t in test_*.js; do
            [ -e "$t" ] || continue
            found=$((found+1))
            echo "── $t"
            node "$t" || { rc=1; echo "::error::$t FAILED"; }
          done
          echo "ran $found test file(s)"
          # ⚠️ ZERO TEST FILES IS A FAILURE, NOT A PASS. A glob that
          # matches nothing is exactly how a suite disappears unnoticed.
          if [ "$found" -lt 4 ]; then
            echo "::error::only $found test file(s) found — the suite has shrunk"
            rc=1
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Decide what this run collects
        id: mode
        run: |
          # 🔴 THERE IS NO LONGER A SCHEDULE-TO-MODE TABLE, AND ITS
          # ABSENCE IS THE FIX. That table was the cron-owns-artifact
          # design: every entry claimed one job, so a dropped entry meant
          # a permanently missing file. `converge` asks the CONTRACT what
          # is late instead of asking the clock what it is time for.
          # ══════════════════════════════════════════════════════════
          # 🔴 FOOTBALL RUNS ON ITS OWN CRONS. Until now every scheduled
          # run hardcoded `mlb`, so NOTHING has ever collected football.
          # ⛔ ZERO football odds have ever been pulled -- and odds
          # history cannot be bought back at any price (the T25 lesson),
          # so every weekend missed is gone permanently.
          #
          # ⚠️ THE DEFAULT IS `mlb` AND EVERY UNRECOGNISED SCHEDULE FALLS
          # THROUGH TO IT. That is deliberate and it is the safety
          # property: if this case block is wrong, or a cron string is
          # edited and no longer matches, the run behaves EXACTLY as it
          # does today. ⛔ A football routing bug must never be able to
          # stop MLB collecting.
          # ══════════════════════════════════════════════════════════
          LEAGUE="${{ github.event.inputs.league }}"
          MODES="${{ github.event.inputs.mode }}"
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$LEAGUE" ]; then
            case "${{ github.event.schedule }}" in
              # ── COLLEGE FOOTBALL — Thu/Fri/Sat ──────────────────────
              "20 15 * * 6")      LEAGUE=ncaaf; MODES="gamelines props-player" ;;
              "20 */6 * * 4,5,6") LEAGUE=ncaaf; MODES="gamelines card-fb" ;;
              # ── NFL — Thu/Sun/Mon ──────────────────────────────────
              "25 15 * * 0")      LEAGUE=nfl;   MODES="gamelines props-player" ;;
              "25 22 * * 4")      LEAGUE=nfl;   MODES="gamelines props-player" ;;
              "25 */6 * * 0,1,4") LEAGUE=nfl;   MODES="gamelines card-fb" ;;
              # ── the current-season trends rebuild ──────────────────
              # ⚠️ `cfb-teams` REBUILDS THE LOGO DIRECTORY AND IS FREE
              # (CFBD, not the Odds API). ⛔ It was in NO cron at all --
              # teams.json existed only because one ad-hoc run wrote it.
              # 🔴 THE WEEKLY REBUILD IS THE BACKSTOP, NOT THE FIX: this
              # project loses scheduled runs, so collect.py ALSO rebuilds
              # the directory on demand whenever it is missing or names
              # the wrong season.
              "35 14 * * 0")      LEAGUE=ncaaf; MODES="cfb-probe cfb-teams"; SEASON=CUR ;;              # ── football news, daily and free ─────────────────────
              "40 12 * * *")      LEAGUE=ncaaf; MODES="news card-fb" ;;
              "45 12 * * *")      LEAGUE=nfl;   MODES="news card-fb" ;;
              "35 15 * * 2")      LEAGUE=nfl;   MODES="nfl-logs";   SEASON=CUR ;;
              # ── the game days the first pass missed ───────────────
              "30 22 * * 4")      LEAGUE=ncaaf; MODES="gamelines props-player" ;;
              "30 21 * * 5")      LEAGUE=ncaaf; MODES="gamelines props-player" ;;
              "30 16 * * 6")      LEAGUE=nfl;   MODES="gamelines props-player" ;;
              *)                  LEAGUE=mlb ;;
            esac
          fi
          # 🔴 `CUR` RESOLVES ON THE RUNNER, NOT IN A CRON STRING. A
          # season written into the schedule is a season that goes stale
          # in January and nothing announces it.
          # ⚠️ A football season is named for the year it STARTS, so
          # anything before August belongs to the previous year.
          if [ "$SEASON" = "CUR" ]; then
            Y=$(date -u +%Y); M=$(date -u +%m)
            [ "$M" -lt 8 ] && Y=$((Y - 1))
            SEASON="$Y"
          fi
          echo "season=${SEASON:-2025}" >> "$GITHUB_OUTPUT"
          echo "league=${LEAGUE:-mlb}" >> "$GITHUB_OUTPUT"
          if [ "$LEAGUE" != "mlb" ] && [ -n "$MODES" ] \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            # 🔴 FOOTBALL IS ONE-SHOT, NOT A HEARTBEAT. The loop exists to
            # survive dropped runs on a DAILY contract; football has no
            # freshness contract yet, and holding a job open for 5 hours
            # would let `cancel-in-progress` kill the MLB loop.
            echo "mode=$MODES converge-off" >> "$GITHUB_OUTPUT"
            echo "loop_minutes=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'converge' }}" >> "$GITHUB_OUTPUT"
            # A hand-dispatched job is a one-shot: no heartbeat loop, so
            # a person debugging is not left with a 6-hour job running.
            echo "loop_minutes=0" >> "$GITHUB_OUTPUT"
          else
            echo "mode=converge" >> "$GITHUB_OUTPUT"
            # push -> one pass; schedule -> hold the line for 5.5 hours.
            if [ "${{ github.event_name }}" = "push" ]; then
              # One pass, no heartbeat: an upload brings the site current
              # immediately and then gets out of the way. The scheduled
              # runs hold the line afterwards.
              echo "loop_minutes=0" >> "$GITHUB_OUTPUT"
            else
              echo "loop_minutes=320" >> "$GITHUB_OUTPUT"
            fi
          fi

      # 🔴 THE MODE IS A LIST AND A FAILURE IS DEFERRED, NOT FATAL HERE.
      # A block runs several pulls. If the third one dies, the two that
      # already cost credits must still reach the repo -- so the loop
      # records the failure and the job is failed AFTER the commit step.
      # ⛔ Do not turn this back into a bare `python collect.py`. That
      # aborts the step, skips `Commit snapshots`, and throws away paid
      # data to report an error the run would have reported anyway.
      # ══════════════════════════════════════════════════════════════
      # THE HEARTBEAT LOOP
      # ══════════════════════════════════════════════════════════════
      # 🔴 ONE LANDED RUN NOW COVERS MOST OF A DAY. A scheduled job may
      # run for six hours, so instead of exiting after one pass it
      # converges, verifies, commits, sleeps, and converges again until
      # it nears the limit. That is what makes a dropped cron survivable:
      # the schedule has to drop ELEVEN OF TWELVE entries before the site
      # goes out of contract.
      #
      # ⛔ THE COMMIT IS INSIDE THE LOOP, NOT A LATER STEP. A six-hour job
      # that committed only at the end would publish nothing for six
      # hours and lose everything if the runner died.
      #
      # ⚠️ Concurrency (above) uses cancel-in-progress: the next cron that
      # lands REPLACES the loop still running rather than queueing behind
      # it. Newest run wins; no pile-up.
      - name: Converge and hold
        id: collect
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          LEAGUE: ${{ steps.mode.outputs.league }}
          SEASON: ${{ steps.mode.outputs.season }}
          MODES: ${{ steps.mode.outputs.mode }}
          LOOP_MINUTES: ${{ steps.mode.outputs.loop_minutes }}
          LEAGUE_NAME: ${{ steps.mode.outputs.league }}
        run: |
          set -o pipefail
          git config user.name  "gizmos-collector"
          git config user.email "collector@users.noreply.github.com"

          DEADLINE=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          PASS=0
          rc=0

          while : ; do
            PASS=$((PASS + 1))
            echo "::group::converge pass $PASS"

            pass_rc=0
            for m in $MODES; do
              # ⛔ NOT `python collect.py "$m" || exit`. A failing mode must
              # never abort the pass -- paid data already on disk has to
              # reach the repo. The failure is recorded and reported.
              if ! python collect.py "$m"; then
                pass_rc=1
                rc=1
                echo "::error::mode '$m' failed on pass $PASS"
              fi
            done

            # 🔴 MLB-ONLY, AND GUARDED ON THE LEAGUE, NOT THE MODE.
            # statsapi and all three verifiers are baseball.
            if [ "$LEAGUE_NAME" = "mlb" ]; then
              python collect.py schedule converge-off || true

              # 🔴 A CARD THAT FAILS ITS OWN CHECKS IS NOT PUBLISHED.
              # This is the one verifier that blocks the commit: a bad
              # card must never reach the page. If it fails, the card
              # file is reverted and everything else still commits.
              # 🔴 THE REASON IS WRITTEN INTO THE REPO, NOT JUST THE LOG.
              # On 2026-08-28 verify_card blocked the card and the only
              # record of WHY was inside an Actions log -- which nobody
              # outside the runner can read, and which GitHub eventually
              # deletes. ⛔ A diagnosis you cannot retrieve is a diagnosis
              # you do not have. The failing checks now land in a file
              # that gets committed with everything else.
              if ! python verify_card.py > /tmp/vc.txt 2>&1; then
                # 🔴 THE CARD IS REVERTED EITHER WAY. What `card_gate`
                # decides is only whether this turns the RUN red.
                # `[measured 2026-08-29]` Sam looked at T37, chose to leave
                # the bar alone, and every run afterwards went red for a
                # decision already made. ⛔ An alarm that fires every
                # fifteen minutes gets ignored, and ignoring red is how the
                # original staleness survived a whole day.
                # ✅ A failure listed in `card-accepted.txt` — by Sam, in
                # writing — warns. ANYTHING ELSE still fails the run.
                echo "::error::verify_card failed on pass $PASS -- reverting the card only"
                if ! python card_gate.py /tmp/vc.txt; then
                  rc=1
                fi
                cat /tmp/vc.txt
                mkdir -p data/latest
                {
                  echo "verify_card FAILED at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "pass $PASS of run ${GITHUB_RUN_NUMBER:-?}"
                  echo "--- the failing checks ---"
                  grep -E "FAIL|Traceback|Error|error:" /tmp/vc.txt | head -40
                  echo "--- last 60 lines ---"
                  tail -60 /tmp/vc.txt
                } > data/latest/card-verify-failure.txt
                git checkout -- picks/ 2>/dev/null || true
              else
                cat /tmp/vc.txt | tail -5
                rm -f data/latest/card-verify-failure.txt
              fi
            fi

            # --- publish this pass ---
            git add data/ picks/
            if git diff --staged --quiet; then
              echo "pass $PASS: nothing new to commit"
            else
              git commit -q -m "collect[$LEAGUE_NAME]: converge pass $PASS $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                git pull --rebase --autostash -q && git push -q && break
                echo "push attempt $i failed, retrying"
                sleep 5
              done
            fi

            # 🔴 THESE RUN AFTER THE COMMIT, DELIBERATELY. The data they
            # check cost credits and cannot be re-bought; a failure must
            # turn the run red WITHOUT discarding the snapshot.
            if [ "$LEAGUE_NAME" = "mlb" ]; then
              python verify_board.py  || { rc=1; echo "::error::verify_board failed"; }
              python verify_record.py || { rc=1; echo "::error::verify_record failed"; }
            fi
            echo "::endgroup::"

            # 🔴 THE FRESHNESS GATE IS THE JOB'S REAL OUTPUT. If anything
            # is still out of contract after a pass, that is the thing
            # worth seeing on the Actions page -- not which mode ran.
            # ⛔ MLB-ONLY, AND IT WAS NOT — CAUGHT 2026-08-28 BEFORE ANY
            # FOOTBALL RUN EXISTED. `freshness.py`'s contract describes
            # MLB's artifacts under `data/` and `picks/`. Football writes
            # to `data/nfl/` and `picks/nfl/`, so an NFL or CFB job would
            # have been graded against BASEBALL's deadlines -- failing for
            # reasons that have nothing to do with football, or passing
            # while football is silently stale. Both are the same bug.
            # ➡️ Football gets a gate when it gets contract rows. Until
            # then it has none, and the run SAYS SO rather than faking it.
            if [ "$LEAGUE_NAME" = "mlb" ]; then
              python verify_freshness.py || { rc=1; echo "::error::out of contract"; }
            else
              echo "::warning::$LEAGUE_NAME has no freshness contract yet —"
              echo "::warning::this run is NOT checked for staleness."
            fi

            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "loop finished after $PASS pass(es)"
              break
            fi
            SLEEP=900
            LEFT=$(( DEADLINE - NOW ))
            [ "$LEFT" -lt "$SLEEP" ] && SLEEP="$LEFT"
            echo "sleeping ${SLEEP}s before the next pass"
            sleep "$SLEEP"
          done

          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # 🔴 THE DEFERRED FAILURE. Everything is committed and every
      # verifier has spoken; only now does a failure turn the job red.
      # ⛔ Keep this LAST.
      - name: Fail if the tests failed
        if: steps.tests.outputs.rc != '0' && steps.tests.outputs.rc != ''
        run: |
          echo "::error::the test suite failed — see the Tests step"
          exit 1

      - name: Fail if any pass failed
        if: steps.collect.outputs.rc != '0'
        run: |
          echo "::error::at least one converge pass failed -- see the log"
          exit 1
