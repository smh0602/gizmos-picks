# 🔴🔴 DOES EACH GUARD ACTUALLY BITE? NOTHING HAS EVER ASKED.
#
# ⛔ THIS REPO'S MOST REPEATED DEFECT IS A GUARD THAT PASSES WHILE
# PROVING NOTHING — the ledger records at least seven (rules 67, 244,
# 249 among them). `[2026-09-15]` **Four new guards shipped in one day
# and TWO were vacuous**: the CFBD bar that never read `cfbd_budget.py`,
# and the one-issue-in-place check that did not exist at all. Both were
# found by **Sam mutating them by hand.** A defect whose only detector is
# one person's patience has no detector.
#
# ✅ `CLAUDE.md` already says *a guard that cannot fail is not a guard*
# and *prove it bites before you call it done*. This is that sentence,
# nightly.
#
# 💰 FREE. It runs the repo's own test files against mutated copies of
# the repo's own source. ⛔ No API call, no Odds credit, no CFBD call, no
# Claude usage.
#
# ⛔ IT REPORTS AND NEVER EDITS. A guard it finds is not deleted and not
# weakened — CLAUDE.md forbids removing a check outright, and a weak
# guard removed is strictly worse than a weak guard reported. Sam decides
# what happens to each.
name: vacuity
# 🔴 THE RUN SAYS WHICH CRON FIRED IT — ledger rule 271; `runs_report.py`
# reads this back to tell a landed cron from a dropped one.
run-name: ${{ github.event.schedule && format('vacuity [cron {0}]', github.event.schedule) || format('vacuity [{0}]', github.event_name) }}

on:
  # ⚠️ NIGHTLY, NOT PER-PUSH. Mutating and re-running every name-mapped
  # pair plus every declared mutation grows with the suite; hanging
  # that off every push would tax the collector's own runs for an answer
  # that changes only when a guard changes.
  # ⛔ Off :00 and :30 like every cron here; those slots are the most
  # congested on GitHub's scheduler and runs get dropped.
  # ⚠️ 06:47Z = 2:47am ET — quiet, and well clear of the 6am ET trends job.
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

# ⚠️ PER-WORKFLOW GROUP. A shared group silently cancels queued scheduled
# runs when someone triggers a job by hand — CLAUDE.md.
concurrency:
  group: vacuity
  cancel-in-progress: true

jobs:
  # 🔴🔴 `[2026-11-01]` FOUR JOBS SWEEP AND A FIFTH REPORTS. On one runner the
  # 120-minute clock ran out on 9 of the last 15 nights, the sweep printed
  # nothing, and Tell Sam wrote that nothing over issue #249. Each part now has
  # its own runner and its own clock, and `watch` below is the only job that
  # touches the issue, so a part that dies cannot take the report with it.
  # ⛔ THE SHARES ARE THE ONES PR-TESTS SWEEPS: every mutation and every tier 1
  # pair exactly once (`test_pr_shards.py`). Nothing is sampled.
  # ⛔ `sweep` STAYS THE FIRST JOB: `test_vacuity_pool.py` reads the file's first
  # clock as the nightly's.
  sweep:
    # ⚠️ PINNED, NOT `ubuntu-latest` `[2026-09-24]`: GitHub moves -latest to
    # Ubuntu 26.04 from 2026-10-19. test_runner_image.py fails on a floating label.
    runs-on: ubuntu-24.04
    # 🔴 `[2026-09-23]` WAS 30, AND THE SWEEP OUTGREW IT: cancelled at 30
    # minutes on 09-22 and 09-23, so two nights reported nothing. The sweep
    # now runs in parallel worktrees — tier 2 measured 1054s on a slow
    # runner — but the slowest runner seen is ~1.4x slower again.
    # ⛔ `test_vacuity_pool.py` requires this to be at least the ~~2400s~~
    # 5400s pr-tests gives `test_vacuity.py`, which runs LESS of the same sweep.
    # `[2026-10-02]` ~~60~~ 120: tier 2 alone outran 2400s in collect #2093
    # once #218 added ~140 declarations, and this job runs tier 1 as well.
    # `[2026-11-01]` Now per part, not for the whole sweep: pr-tests' parts took
    # 27-48 minutes on 10-31. ⛔ Not raised to fit: raising it is how this clock
    # got outgrown three times.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # ⛔ ONE PART FAILING MUST NOT CANCEL THE OTHERS: their findings still count.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          # ⛔ THE HARNESS REWRITES SOURCE FILES AND ASKS GIT WHETHER IT
          # PUT THEM BACK. It needs a real working tree, not a bare tree.
          fetch-depth: 1

      # ⚠️ PYTHON IS PINNED HERE, NOT TAKEN FROM THE IMAGE `[2026-09-24]`: the
      # image's own `python` is 3.12 on ubuntu-24.04 and 3.14 on ubuntu-26.04.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Does every guard actually bite?
        env:
          VACUITY_PART: ${{ matrix.part }}/4
          # ⚠️ OUTSIDE THE CHECKOUT: the sweep needs a clean tree, and the check
          # below would read the report as a leftover mutation.
          VACUITY_OUT: ${{ runner.temp }}/vacuity-part.json
        run: |
          set +e
          # ⛔ THE JUDGEMENT LIVES IN PYTHON, NOT IN THIS SHELL — rule 66.
          # `vacuity.py` is driven by `test_vacuity.py`, which plants
          # deliberately vacuous guards and proves the harness names them.
          # `[2026-11-01]` This part only reports; `watch` judges all of them.
          python vacuity.py > /tmp/vacuity.md 2>/tmp/vacuity.err
          cat /tmp/vacuity.md
          cat /tmp/vacuity.err >&2
          # 🔴 AND IT MUST NOT HAVE LEFT A MUTATION BEHIND. vacuity.py
          # checks this itself and reports it; this is the second pair
          # of eyes, because a leaked mutation in a repo whose collector
          # commits every few minutes would be committed.
          # ⛔ No report means this part reads as missing: "could not look".
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::vacuity left the working tree modified"
            git status --porcelain
            rm -f "$VACUITY_OUT"
          fi
          exit 0

      # ⚠️ `always()`, AND NO FILE IS NOT A FAILURE: a part that ran out its
      # clock has written nothing, and `watch` reports that part by number.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vacuity-part-${{ matrix.part }}
          path: ${{ runner.temp }}/vacuity-part.json
          if-no-files-found: warn
          retention-days: 1

  # 🔴🔴 THE REPORT. `[2026-11-01]` Everything from here down was the last half
  # of the one job, and still reads the same way to whoever reads the issue.
  watch:
    needs: sweep
    if: always() # a part that ran out its clock must not skip the report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ⚠️ NOT FATAL: no reports at all is a state `--merge` knows how to say.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: vacuity-part-*
          path: ${{ runner.temp }}/vacuity-parts

      - name: What did the parts find?
        id: look
        env:
          PARTS: ${{ runner.temp }}/vacuity-parts
        run: |
          set +e
          # ⛔ STILL IN PYTHON: `vacuity.py --merge` puts every part through the
          # same `verdict()`, and a part that never reported is never a pass.
          # `test_vacuity_merge.py` drives it, and this mapping.
          python vacuity.py --merge "$PARTS" > /tmp/vacuity.md 2>/tmp/vacuity.err
          rc=$?
          cat /tmp/vacuity.md
          cat /tmp/vacuity.err >&2
          if [ "$rc" = "0" ]; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "1" ]; then
            echo "state=bad" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vacuity could not complete a clean run"
            echo "state=unknown" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # ⚠️ ONE ISSUE, UPDATED IN PLACE, CLOSED BY ITSELF — the same shape
      # as every other watcher here, for the same reason: a workflow that
      # opens a fresh issue nightly is one whose notifications get
      # filtered, and a filtered alert is no alert.
      # ⛔ AND `unknown` CHANGES NOTHING. "I could not look" is not "every
      # guard bites" and must never close an open issue.
      - name: Tell Sam
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          STATE='${{ steps.look.outputs.state }}'
          TITLE="Gizmo's Picks - a guard is not guarding anything"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          # 🔴 `[2026-11-01]` EMPTY IS A STEP THAT NEVER FINISHED, NOT A FINDING.
          # It fell through to `bad` below and blanked #249 on 9 nights.
          if [ -z "$STATE" ] || [ "$STATE" = "unknown" ]; then
            echo "could not complete a clean run — leaving any open issue alone"
            exit 0
          fi
          if [ "$STATE" = "ok" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "✅ Resolved — every checked guard bites again."
              gh issue close "$NUM"
            fi
            echo "every guard bites"
            exit 0
          fi
          # 🔴🔴 THE LABEL IS ENSURED HERE, ABOVE THE BRANCH, NOT INSIDE IT.
          # `[measured 2026-09-19]` PR #73 labelled the `gh issue create` path and
          # left the `gh issue edit` path alone. Every watcher files ONCE and then
          # updates in place for ever, so **five of the six open watcher issues
          # carried no label at all** — #69, #44, #42, #31, #16 — and
          # `self-repair.yml` reads the queue BY LABEL. The issue reporting two
          # vacuous guards, which is the exact thing PR #73 existed to make
          # actionable, was one of the five.
          # ✅ `--add-label` on the edit path HEALS them: the next run of each
          # watcher puts its own issue into the queue. Nothing has to be relabelled
          # by hand.
          # ⛔ And the ensure moved ABOVE the branch because `--add-label X` fails
          # when X does not exist — the create path needed that and the edit path
          # needs it too.
          gh label create gizmo-watch --color 5319e7 --description "filed by a Gizmo's Picks watcher; self-repair triages these" 2>/dev/null || true
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --add-label gizmo-watch --body-file /tmp/vacuity.md
          else
            gh issue create --label gizmo-watch --title "$TITLE" --body-file /tmp/vacuity.md --assignee smh0602 \
              || gh issue create --label gizmo-watch --title "$TITLE" --body-file /tmp/vacuity.md \
              || gh issue create --title "$TITLE" --body-file /tmp/vacuity.md
          fi
          exit 0

      # 🔴 A RUN THAT COULD NOT LOOK IS RED `[2026-11-01]`, so `runs_report.py`
      # sees it. Tell Sam leaves the issue alone on those nights, on purpose,
      # and a green tick there would be the only thing anybody saw.
      # ⛔ ANYTHING BUT `ok` OR `bad`: an empty state is a step that never finished.
      - name: A run that could not look is red
        if: always()
        run: |
          STATE='${{ steps.look.outputs.state }}'
          case "$STATE" in
            ok|bad) echo "the sweep reported: $STATE" ;;
            *) echo "::error::the nightly sweep could not look (state '$STATE')"; exit 1 ;;
          esac
