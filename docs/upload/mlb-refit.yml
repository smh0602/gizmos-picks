# ══════════════════════════════════════════════════════════════════════
# MLB CHAMPION VS CHALLENGER — RE-FITTED AND SCORED EVERY WEEK, BY ITSELF.
# `[Sam, 2026-09-23; research/mlb_refit_spec.md]`
# ⛔ SAM UPLOADS THIS FILE BY HAND. It carries a `cron:` block, and GitHub
# attributes every scheduled run in the repository to whoever last changed
# one. CLAUDE.md, "IF YOU CAN PUSH TO THIS REPO".
# ⛔ IT CHANGES NO COEFFICIENT. It writes a report, and when the challenger
# QUALIFIES under Sam's rule it opens ONE "[ASK SAM]" pull request with
# the proposed coefficients. Switching models stays Sam's decision.
# 💰 statsapi is free and needs no key. No Odds API, no CFBD.
# ⚠️ Minute is off :00 and :30 on purpose: those slots get dropped.
# ══════════════════════════════════════════════════════════════════════
name: mlb-refit
# ⛔ THE STAMP — every cron workflow writes its schedule into the run name
#    so `runs_report.py` can tell a missed fire from a landed one.
run-name: ${{ github.event.schedule && format('mlb-refit [cron {0}]', github.event.schedule) || format('mlb-refit [{0}]', github.event_name) }}

on:
  schedule:
    # Monday 11:43 UTC — Sunday's games are final and logged by then.
    - cron: "43 11 * * 1"
  workflow_dispatch:

concurrency:
  group: mlb-refit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull new games and score the walk-forward
        run: python mlb_refit.py weekly

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/mlb-starts-*.json.gz data/latest/mlb-refit.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "mlb-refit: weekly champion vs challenger $(date -u +%Y-%m-%dT%H:%MZ)"
            # ⛔ THE ONE WAY A WORKFLOW LANDS ITS COMMITS (CLAUDE.md).
            bash push_retry.sh mlb-refit
          fi

      - name: Open a PR for Sam only if the challenger qualifies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python mlb_refit.py open-pr
